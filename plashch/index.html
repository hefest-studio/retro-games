<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0a1e;color:#eef2f8;font-family:Inter,system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;min-height:100dvh;user-select:none;overflow:hidden}
.wrap{position:relative;width:min(96vw,620px);margin-top:10px}
canvas{width:100%;display:block;border:1px solid #241f3a;border-radius:10px;background:#0b0a1e}
.pad{width:min(96vw,620px);margin:10px 0;display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:470px}
.pad button{height:54px;background:#17142a;border:1px solid #2a2446;border-radius:12px;color:#eef2f8;font-size:19px;font-weight:800}
.pad button:active{background:#241f3a}
.foot{color:#6a6290;font-size:11px;margin:2px 12px 16px;text-align:center;max-width:620px}
a.back{position:fixed;left:10px;top:8px;color:#6a6290;font-size:12px;text-decoration:none}
@media(min-width:760px){.pad{display:none}}
</style></head><body>
<a class="back" href="../">← Каталог</a>
<div class="wrap"><canvas id="c" width="960" height="600" aria-label="ПЛАЩ"></canvas></div>
<div class="pad">
  <button data-d="L">◀</button><button data-d="R">▶</button>
  <button data-d="U">⤒</button><button id="bFire">●</button><button id="bHook">⚓</button>
</div>
<div class="foot"><b>ПЛАЩ</b> · ◀▶ ход, ↑/W/пробел — прыжок, J/X/● — выстрел, K/Shift/⚓ — крюк, P — пауза · L язык, T тема, M звук.</div>
<script src="./engine.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/game.js"></script>
<script src="./js/classic.js"></script>
<script src="./js/modern.js"></script>
<script>
'use strict';
var STR={
 ru:{play:'Играть',language:'Язык',theme:'Тема',sound:'Звук',on:'вкл',off:'выкл',score:'Счёт',level:'Ур.',best:'Рекорд',win:'ГОРОД СПАСЁН!',gameover:'ПОВЕРЖЕН',pause:'ПАУЗА',resume:'Продолжить',menu:'В меню',tapstart:'пробел / тап',title:'ПЛАЩ',subtitle:'Ночной мститель · крюк-кошка'},
 en:{play:'Play',language:'Language',theme:'Theme',sound:'Sound',on:'on',off:'off',score:'Score',level:'Lvl',best:'Best',win:'CITY SAVED!',gameover:'DEFEATED',pause:'PAUSE',resume:'Resume',menu:'Menu',tapstart:'space / tap',title:'PLASHCH',subtitle:'Night avenger · grappling hook'}
};
var g=Arcade.createGame({canvas:'#c',width:960,height:600,gameId:'plashch',strings:STR,theme:'modern'});
g.input.bindDpad(document.querySelector('.pad'));
g.fit(620); addEventListener('resize',function(){g.fit(620);});
var game=null;
function bp(f,d,t,v){ g.audio.beep(f,d,t,v); }
function mkGame(){ return PLASHCH.Game({hi:g.state.best,onEvent:function(type){
  if(type==='jump') bp(520,.05,'square',.05);
  else if(type==='shoot') bp(900,.04,'square',.05);
  else if(type==='grapple') bp(640,.06,'triangle',.05);
  else if(type==='explode'||type==='bosshit') bp(140,.12,'sawtooth',.07);
  else if(type==='pickup'||type==='medkit') bp(1100,.06,'triangle');
  else if(type==='door') bp(1300,.12,'triangle');
  else if(type==='hurt') bp(200,.12,'sawtooth',.07);
  else if(type==='gameover'){ if(game) g.state.score=game.state().score; g.gameover(); }
  else if(type==='win'){ if(game) g.state.score=game.state().score; g.win(); }
}}); }
function render(ctx){ var st=game?game.state():null; if(!st){ g.clear(); return; }
  (g.themeName==='modern'?PLASHCH.modern:PLASHCH.classic).draw(ctx,st); }
g.useStandardScreens({title:'ПЛАЩ',subtitle:STR.ru.subtitle,lives:0});
g.scene('play',{realtime:true,
  enter:function(d){ if(!(d&&d.resume)){ game=mkGame(); game.start(); } },
  press:function(a){ if(!game) return; if(a==='pause'){ this.pause(); return; } if(a==='up'){ game.jump(); return; } },
  update:function(dt){ if(!game) return; var dx=this.input.dir.x, dy=this.input.dir.y;
    game.setHeld('left',dx<0); game.setHeld('right',dx>0); game.setHeld('up',dy<0); game.setHeld('down',dy>0);
    if(window.PLASHCH&&PLASHCH.i18n) PLASHCH.i18n.lang=g.i18n.lang; game.update(dt); g.state.score=game.state().score; },
  draw:function(ctx){ render(ctx); }
});
addEventListener('keydown',function(e){ if(g._sceneName!=='play'||!game) return;
  if(e.code==='Space'){ game.jump(); e.preventDefault(); }
  else if(e.code==='KeyJ'||e.code==='KeyX'){ game.shoot(); e.preventDefault(); }
  else if(e.code==='KeyK'||e.code==='ShiftLeft'||e.code==='ShiftRight'){ game.grapple(); e.preventDefault(); }
});
(function(){ function bind(id,fn){ var el=document.getElementById(id); if(!el) return;
    var h=function(e){ e.preventDefault(); if(g._sceneName==='play'&&game) fn(); };
    el.addEventListener('touchstart',h,{passive:false}); el.addEventListener('mousedown',h); }
  bind('bFire',function(){ game.shoot(); }); bind('bHook',function(){ game.grapple(); });
})();
g.start('title');
</script></body></html>

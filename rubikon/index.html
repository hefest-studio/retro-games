         box-shadow:0 0 0 1px #23232b,0 0 60px rgba(85,255,255,.08),0 0 140px rgba(255,85,255,.05)}

       background:#000;color:#f66;font:12px/1.4 monospace;padding:8px}
  #testout{position:fixed;left:0;top:0;z-index:9;display:none;background:#000;color:#5f5;

<script>
'use strict';
(function(){
window.addEventListener('error', function(ev){ try{ reportError(String(ev.message||ev.error||'error')); }catch(e){} });
window.addEventListener('unhandledrejection', function(ev){ try{ reportError('promise: '+String(ev.reason)); }catch(e){} });
/* ==========================================================================
   РУБИКОН — HTML5 port of the 1987 студия «Гефест» game
   Internal resolution 320x200, CGA four-colour palette.
   ========================================================================== */

/* ---------- palette ---------- */
const BK = '#000000', WH = '#ffffff', CY = '#55ffff', MG = '#ff55ff';

/* ---------- screen ---------- */
const W = 320, H = 200, PH = 144, TS = 8, ROWS = 18, SCRW = 320;
const GW = 40;                 // tiles per screen
const GND = 16 * TS;           // 128 - top of the ground
const HUD_Y = 148;
const TOTAL_FLOORS = 11;

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const pad   = (n,l)=> { let s=String(Math.max(0,Math.floor(n))); while(s.length<l) s='0'+s; return s.slice(-l); };

function mulberry32(a){
  return function(){
    a|=0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1|a);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14)>>>0)/4294967296;
  };
}

/* ---------- canvas / graphics-mode switching ---------- */
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');
const GFX_PREF_VERSION = '2';
let GFX = loadGfx();          // 'modern' (neon) | 'retro' (CGA), retro by default
let curBacking = '';
let MS = 1;                   // backing-store scale, used to size glows
let PIX = 1;                  // css scale

function loadGfx(){
  try{
    const ver = localStorage.getItem('lastmission.gfxVer');
    if(ver !== GFX_PREF_VERSION){
      // one-time migration: CGA is now the default style
      try{
        localStorage.setItem('lastmission.gfxVer', GFX_PREF_VERSION);
        localStorage.setItem('lastmission.gfx', 'retro');
      }catch(e){}
      return 'retro';
    }
    return localStorage.getItem('lastmission.gfx') === 'modern' ? 'modern' : 'retro';
  }catch(e){ return 'retro'; }
}
function fit(){
  const s = Math.max(1, Math.min(Math.floor(innerWidth/W), Math.floor(innerHeight/H)));
  PIX = s;
  const cssW = W*s, cssH = H*s;
  cv.style.width = cssW+'px';
  cv.style.height = cssH+'px';
  let bw, bh;
  if(GFX === 'modern'){
    const q = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    bw = Math.round(cssW*q); bh = Math.round(cssH*q);
  } else {
    bw = W; bh = H;
  }
  const key = bw+'x'+bh;
  if(key !== curBacking){
    curBacking = key;
    cv.width = bw; cv.height = bh;
    ctx = cv.getContext('2d');
    ctx.setTransform(1,0,0,1,0,0);
    if(GFX === 'modern'){
      ctx.scale(bw/W, bh/H);
      ctx.imageSmoothingEnabled = true;
    } else {
      ctx.imageSmoothingEnabled = false;
    }
  }
  MS = bw/W;
  document.body.classList.toggle('modern', GFX === 'modern');
  cv.classList.toggle('modern', GFX === 'modern');
}
function setGfx(v){
  GFX = (v === 'retro') ? 'retro' : 'modern';
  try{
    localStorage.setItem('lastmission.gfx', GFX);
    localStorage.setItem('lastmission.gfxVer', GFX_PREF_VERSION);
  }catch(e){}
  curBacking = '';
  fit();
}
function toggleGfx(){
  setGfx(GFX === 'modern' ? 'retro' : 'modern');
  if(G.mode === 'play' || G.mode === 'paused'){
    say(T(GFX === 'modern' ? 'gfx_neon' : 'gfx_cga'), 1.3);
  }
}
addEventListener('resize', fit); fit();

/* ---------- tiny drawing helpers ---------- */
function off(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function pix(g,x,y,col){ g.fillStyle=col; g.fillRect(x|0,y|0,1,1); }
function rect(g,x,y,w,h,col){ g.fillStyle=col; g.fillRect(x|0,y|0,w|0,h|0); }
function frame(g,x,y,w,h,col){
  g.fillStyle=col;
  g.fillRect(x|0,y|0,w|0,1); g.fillRect(x|0,(y+h-1)|0,w|0,1);
  g.fillRect(x|0,y|0,1,h|0); g.fillRect((x+w-1)|0,y|0,1,h|0);
}
function dashFrame(g,x,y,w,h,col,step){
  step=step||4;
  g.fillStyle=col;
  for(let i=0;i<w;i+=step){ g.fillRect(x+i, y, 2,1); g.fillRect(x+i, y+h-1, 2,1); }
  for(let j=0;j<h;j+=step){ g.fillRect(x, y+j, 1,2); g.fillRect(x+w-1, y+j, 1,2); }
}
function ell(g,cx,cy,rx,ry,col){
  for(let y=-ry;y<=ry;y++){
    for(let x=-rx;x<=rx;x++){
      if((x*x)/(rx*rx)+(y*y)/(ry*ry) <= 1.0001){
        g.fillStyle=col; g.fillRect((cx+x)|0,(cy+y)|0,1,1);
      }
    }
  }
}
function ellRing(g,cx,cy,rx,ry,col){
  const ri = Math.max(0,rx-1), rj = Math.max(0,ry-1);
  for(let y=-ry;y<=ry;y++){
    for(let x=-rx;x<=rx;x++){
      const d = (x*x)/(rx*rx)+(y*y)/(ry*ry);
      if(d<=1.0001){
        if(rx<=1 || ry<=1 || (x*x)/(ri*ri)+(y*y)/(rj*rj) > 1.0001){
          g.fillStyle=col; g.fillRect((cx+x)|0,(cy+y)|0,1,1);
        }
      }
    }
  }
}
function ditherRect(g,x,y,w,h,col,phase){
  g.fillStyle=col;
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    if(((i+j+(phase||0))&1)===0) g.fillRect((x+i)|0,(y+j)|0,1,1);
  }
}

const FONT_CHARS = Object.keys(FONT);
const FONT_IDX = {};
FONT_CHARS.forEach((c,i)=>{
  const rows = FONT[c].split(' ');
  if(rows.length !== 7 || rows.some(r=>r.length !== 5)) throw new Error('bad glyph '+c);
  FONT_IDX[c] = i;
});
const FONTS = {};
function buildFont(col){
  const cw=5, chh=7;
  const c = off(cw*FONT_CHARS.length, chh);
  const g = c.getContext('2d');
  g.fillStyle = col;
  FONT_CHARS.forEach((ch,i)=>{
    const rows = FONT[ch].split(' ');
    for(let y=0;y<7;y++) for(let x=0;x<5;x++)
      if(rows[y][x]==='1') g.fillRect(i*5+x,y,1,1);
  });
  return c;
}
FONTS.w = buildFont(WH); FONTS.c = buildFont(CY); FONTS.m = buildFont(MG); FONTS.k = buildFont(BK);

function textW(s,sc){ sc=sc||1; return String(s).length*6*sc - sc; }
function text(s,x,y,col,sc){
  col = col||'w'; sc = sc||1;
  const img = FONTS[col] || FONTS.w;
  let cx = Math.round(x), cy = Math.round(y);
  const str = String(s).toUpperCase();
  for(let i=0;i<str.length;i++){
    const idx = FONT_IDX[str[i]];
    if(idx !== undefined) ctx.drawImage(img, idx*5,0,5,7, cx, cy, 5*sc, 7*sc);
    cx += 6*sc;
  }
  return cx;
}
function textC(s,cx,y,col,sc){ text(s, Math.round(cx - textW(s,sc)/2), y, col, sc); }
function textR(s,rx,y,col,sc){ text(s, Math.round(rx - textW(s,sc)), y, col, sc); }

/* ==========================================================================
   SPRITES
   ========================================================================== */
const SPR = {};
function spriteFrom(rows){
  const h = rows.length, w = rows[0].length;
  for(const r of rows) if(r.length !== w) throw new Error('sprite row width');
  const c = off(w,h), g = c.getContext('2d');
  const map = {'.':null, 'w':WH, 'c':CY, 'm':MG, 'k':BK};
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const col = map[rows[y][x]];
    if(col){ g.fillStyle=col; g.fillRect(x,y,1,1); }
  }
  return c;
}
function flipC(src){
  const c = off(src.width, src.height);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.translate(src.width,0); g.scale(-1,1);
  g.drawImage(src,0,0);
  return c;
}

function makeBase(){
  const c = off(26,13), g = c.getContext('2d');
  for(let x=3;x<23;x++){ pix(g,x,11,(x%2)?MG:WH); }
  rect(g,2,12,22,1,MG);
  ell(g,13,8,12,4,WH);
  ell(g,13,8,11,3,CY);
  ell(g,13,3,5,3,WH);
  ell(g,13,3,4,2,CY);
  pix(g,12,2,WH);
  pix(g,4,8,WH); pix(g,21,8,WH);
  pix(g,8,7,MG); pix(g,17,7,MG);
  rect(g,8,10,10,1,WH);
  return c;
}
function makeTurret(){
  const c = off(15,10), g = c.getContext('2d');
  rect(g,8,4,7,2,WH); pix(g,14,4,CY); pix(g,14,5,CY);
  ell(g,6,5,5,4,WH);
  ell(g,6,5,4,3,CY);
  rect(g,4,4,3,2,MG); pix(g,5,4,WH);
  pix(g,4,0,CY); pix(g,5,1,CY);
  pix(g,3,8,WH);
  return c;
}
function makeSaucer(){
  const c = off(16,8), g = c.getContext('2d');
  ell(g,8,4,7,3,CY);
  ell(g,8,3,4,2,WH);
  for(let x=1;x<15;x+=2) pix(g,x,5,WH);
  pix(g,8,1,MG); pix(g,3,6,MG); pix(g,12,6,MG);
  pix(g,2,3,WH); pix(g,13,3,WH);
  return c;
}
function makeRing(){
  const c = off(10,10), g = c.getContext('2d');
  ellRing(g,5,5,5,5,MG);
  ellRing(g,5,5,3,3,CY);
  pix(g,5,5,WH);
  pix(g,5,0,WH);
  return c;
}
function makeShip(){
  const c = off(66,32), g = c.getContext('2d');
  rect(g,2,14,8,4,MG); pix(g,1,15,WH);
  ell(g,30,16,24,8,WH);
  ell(g,30,16,21,6,CY);
  for(let i=0;i<12;i++){ rect(g,52+i,16-i,1,2*i+1,WH); }
  rect(g,10,5,7,5,MG); rect(g,10,22,7,5,MG);
  ell(g,34,16,5,4,MG); ell(g,34,16,3,3,WH); pix(g,34,16,CY);
  rect(g,18,12,26,1,WH);
  pix(g,60,16,CY); pix(g,62,16,CY); pix(g,64,16,CY);
  return c;
}

/* ==========================================================================
   AUDIO (tiny WebAudio beeper)
   ========================================================================== */
const A = {
  ctx:null, master:null, noiseBuf:null, muted:false,
  init(){
    if(this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
      const len = Math.floor(this.ctx.sampleRate*0.4);
      const buf = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
      this.noiseBuf = buf;
      this.master.gain.value = 0.55;
      if(this.ctx.state === 'suspended') this.ctx.resume();
      Music.ensure();
    }catch(e){ this.ctx = null; }
  },
  tone(f,dur,type,vol,to){
    if(!this.ctx || this.muted) return;
    try{
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(Math.max(20,f), t);
      if(to) o.frequency.exponentialRampToValueAtTime(Math.max(20,to), t+dur);
      g.gain.setValueAtTime(Math.max(0.0001,vol||0.05), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t+dur+0.03);
    }catch(e){}
  },
  noise(dur,vol,cut){
    if(!this.ctx || this.muted || !this.noiseBuf) return;
    try{
      const t = this.ctx.currentTime;
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
      const f = this.ctx.createBiquadFilter(); f.type='lowpass';
      f.frequency.setValueAtTime(cut||1000,t);
      f.frequency.exponentialRampToValueAtTime(120,t+dur);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(Math.max(0.0001,vol||0.15),t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      s.connect(f); f.connect(g); g.connect(this.master);
      s.start(t); s.stop(t+dur+0.02);
    }catch(e){}
  }
};
const SFX = {
  shoot(){ A.tone(920,0.055,'square',0.045,320); },
  hit(){ A.tone(200,0.05,'square',0.045,90); },
  clang(){ A.tone(1500,0.035,'square',0.04,900); },
  explode(){ A.noise(0.32,0.16,1200); A.tone(120,0.25,'sawtooth',0.05,40); },
  bigboom(){ A.noise(0.6,0.22,900); A.tone(90,0.5,'sawtooth',0.07,30); },

function makeBaseEntity(x){

}
function makeTurretEntity(b){
  return { x:b.x+6, y:b.y-10, w:15, h:10, vx:0, vy:0, facing:1, attached:true, alive:true };

function genFloor(n){
  const screens = n<=3 ? 3 : (n<=6 ? 4 : (n<=9 ? 5 : 6));
  const surface = (n === TOTAL_FLOORS);
  const TW = GW*screens, WW = TW*TS;
  const grid = new Uint8Array(TW*ROWS);
  const rng = mulberry32((0x9E3779B1 ^ (n*2654435761))>>>0);
  const F = {
    n:n, TW:TW, WW:WW, screens:screens, surface:surface,
    grid:grid, barriers:[], spawnX:24, liftX:WW-56, shipX:WW-136,
    stars:[], bg:null
  };
  const gi = (x,y)=> y*TW+x;
  const get = (x,y)=> (x<0||y<0||x>=TW||y>=ROWS) ? 1 : grid[gi(x,y)];
  const set = (x,y,v)=>{ if(x>=0&&x<TW&&y>=0&&y<ROWS) grid[gi(x,y)] = v; };

  if(!surface){
    for(let x=0;x<TW;x++){ set(x,0,1); set(x,1,1); }
  }
  for(let x=0;x<TW;x++){ set(x,16,1); set(x,17,1); }
  for(let y=0;y<ROWS;y++){ set(0,y,1); set(1,y,1); set(TW-1,y,1); }

  const forbidden = [];   // {x0,x1,y0,y1} tile ranges structures must avoid

  /* ---- barriers: destructible only from the far (right) side ---- */
  const barCount = clamp(1 + Math.floor(n*0.55), 1, 5);
  const bars = [];
  let guard = 0;
  while(bars.length < barCount && guard++ < 500){
    const bw = 2;
    const bx = 5 + Math.floor(rng()*(TW-12));
    const x = bx*TS;
    if(x < 200 || x > WW-170) continue;
    if(bars.some(b=> Math.abs(b.x-x) < 112)) continue;
    if(bars.some(b=> Math.abs(b.x-x) < (b.bw+bw+4)*TS)) continue;
    const bar = { x:x, y:GND-32, w:bw*TS, h:32, hp:2, maxhp:2, tx:bx, tw:bw, bw:bw, flash:0, dead:false, hitT:0 };
    bars.push(bar);
    for(let ty=12; ty<16; ty++) for(let tx=bx; tx<bx+bw; tx++) set(tx,ty,2);
    // always clear a flight shaft above the armour
    for(let ty=2; ty<12; ty++)
      for(let tx=bx-2; tx<bx+bw+2; tx++)
        if(get(tx,ty)===1) set(tx,ty,0);
    forbidden.push({x0:bx-3, x1:bx+bw+2, y0:2, y1:15});
  }
  F.barriers = bars;

  /* ---- zapper sentries hanging from the ceiling ---- */
  const zappers = [];
  const zcount = surface ? 1 : clamp(n-1, 0, 3);
  guard = 0;
  while(zappers.length < zcount && guard++ < 300){
    const tx = 7 + Math.floor(rng()*(TW-16));
    const x = tx*TS;
    if(x < 180 || x > WW-140) continue;
    if(bars.some(b=> Math.abs(b.x-x) < 88)) continue;
    if(zappers.some(z=> Math.abs(z.x-x) < 96)) continue;
    zappers.push({ t: rng()*2.5 });
    for(let ty=2; ty<16; ty++){
      for(let k=-1;k<=1;k++) if(get(tx+k,ty)===1) set(tx+k,ty,0);
    }
    forbidden.push({x0:tx-2, x1:tx+2, y0:2, y1:15});
    zappers[zappers.length-1].tx = tx;
  }

  /* ---- architecture ---- */
  const free = (x0,x1,y0,y1)=>{
    for(const f of forbidden){
      if(x1 >= f.x0 && x0 <= f.x1 && y1 >= f.y0 && y0 <= f.y1) return false;
    }
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(get(x,y)!==0) return false;
    return true;
  };
  const block = (x0,y0,w,h)=>{
    for(let y=y0;y<y0+h;y++) for(let x=x0;x<x0+w;x++) set(x,y,1);
  };

  // structural columns at the screen joints
  if(!surface){
    for(let s=1; s<screens; s++){
      const tx=s*GW;
      if(free(tx,tx+1,2,8)){
        for(let ty=2; ty<=8; ty++){ set(tx,ty,3); set(tx+1,ty,3); }
        forbidden.push({x0:tx-1,x1:tx+2,y0:2,y1:9});
      }
    }
    // ceiling machine pods
    for(let i=0;i<screens*3;i++){
      const tx = 4 + Math.floor(rng()*(TW-10));
      if(free(tx,tx+2,2,3)){
        for(let ty=2; ty<=3; ty++) for(let k=0;k<3;k++) set(tx+k,ty,3);
        forbidden.push({x0:tx-1,x1:tx+3,y0:2,y1:5});
      }
    }
  }

  if(!surface){
    for(let s=0; s<screens; s++){
      const tries = 5;
      for(let k=0;k<tries;k++){
        const kind = rng();
        const bx = s*GW + 3 + Math.floor(rng()*(GW-10));
        if(bx*TS < 152) continue;
        if(bx*TS > F.WW-160) continue;
        if(kind < 0.45){
          const row = 4 + Math.floor(rng()*5);
          const w = 3 + Math.floor(rng()*4);
          if(free(bx,bx+w+1,row-1,row+1) && bx+w < TW-4){
            block(bx,row,w,1);
            if(rng()<0.7) block(bx,2,1,row-2);
            if(rng()<0.45) block(bx+w-1,2,1,row-2);
            forbidden.push({x0:bx-1,x1:bx+w,y0:2,y1:row+1});
          }
        } else if(kind < 0.72){
          const w = 2 + Math.floor(rng()*3);
          if(free(bx,bx+w,2,4)){
            block(bx,2,w,2);
            forbidden.push({x0:bx-1,x1:bx+w,y0:2,y1:5});
          }
        } else {
          const h = 4 + Math.floor(rng()*4);
          if(free(bx,bx+1,2,h+1)){
            block(bx,2,1,h);
            forbidden.push({x0:bx-1,x1:bx+1,y0:2,y1:h+2});
          }
        }
      }
    }
    // thin wall at the far end of the corridor
    for(let y=2;y<=4;y++){ set(TW-4,y,1); set(TW-5,y,1); }
  } else {
    // surface: overhead slabs only - the ground route must stay clear
    for(let s=1;s<screens;s++){
      if(rng()<0.85){
        const bx = s*GW + 6 + Math.floor(rng()*(GW-16));
        const w = 3 + Math.floor(rng()*4);
        const row = 5 + Math.floor(rng()*4);
        if(free(bx,bx+w,row-1,row+1)){
          block(bx,row,w,1);
          if(rng()<0.5) block(bx,2,1,row-2);
        }
      }
    }
  }

  /* ---- decorate ceiling ---- */
  if(!surface){
    for(let x=2;x<TW-2;x+=7){
      if(rng()<0.55){ set(x,0,1); set(x+1,0,1); }
    }
  }

  /* ---- pickups ---- */
  const cells = 1 + (n>=4?1:0) + (n>=7?1:0);
  for(let i=0;i<cells;i++){
    for(let tr=0;tr<80;tr++){
      const tx = 3 + Math.floor(rng()*(TW-8));
      const ty = 4 + Math.floor(rng()*6);
      if(!free(tx-1,tx+1,ty-1,ty+1)) continue;
      F.cells = F.cells || [];
      F.cells.push({ x:tx*TS+4, y:ty*TS+4, t:rng()*6, taken:false });
      break;
    }
  }

  /* ---- enemies ---- */
  const enemies = [];
  const types = n<=2 ? ['saucer','bug'] : (n<=4 ? ['saucer','bug','ring'] : ['saucer','bug','ring','hunter']);
  const ecount = surface ? 6 : clamp(3 + n, 4, 10);
  for(let i=0;i<ecount;i++){
    for(let tr=0;tr<60;tr++){
      const tx = 8 + Math.floor(rng()*(TW-14));
      const ty = 3 + Math.floor(rng()*9);
      if(get(tx,ty)!==0 || get(tx,ty+1)!==0 || get(tx+1,ty)!==0) continue;
      const x = tx*TS, y = ty*TS;
      if(x < 140 || x > WW-60) continue;
      let type = types[Math.floor(rng()*types.length)];
      if(surface) type = rng()<0.5 ? 'saucer' : 'hunter';
      const baseY = y;
      const speed = (28 + rng()*26) * (1 + (n-1)*0.045) * (type==='hunter'?1.3:1);
      enemies.push({
        type:type, x:x, y:y, w:16, h:8, hp:1, pts:50,
        vx: (rng()<0.5?-1:1)*speed, baseX:x, baseY:baseY,
        t: rng()*6, phase: rng()*6.28, flash:0, dead:false,
        spd: speed, shootT: 1.2+rng()*1.6
      });
      break;
    }
  }
  const EDEF = {
    saucer:{w:16,h:8,hp:1,pts:50},
    bug:{w:8,h:6,hp:1,pts:25},
    ring:{w:10,h:10,hp:99,pts:0,invul:true},
    hunter:{w:12,h:9,hp:2,pts:100},
    zapper:{w:12,h:16,hp:3,pts:150}
  };
  for(const e of enemies){
    const d = EDEF[e.type];
    e.w=d.w; e.h=d.h; e.hp=d.hp; e.pts=d.pts;
    e.invul = !!d.invul;
    e.y = e.baseY;
    if(e.type==='hunter') e.spd = 13 + n*1.15;
  }
  F.cells = F.cells || [];
  // ensure at least one opponent on the entry screen
  if(enemies.length && !enemies.some(e=>e.x < SCRW)){
    const e=enemies[0];
    e.type='saucer'; e.w=16; e.h=8; e.hp=1; e.pts=50; e.invul=false;
    e.x=244; e.baseX=244; e.y=74; e.baseY=74; e.vx=34; e.dead=false;
  }
  // zappers become enemies
  zappers.forEach((z,i)=>{
    const d = EDEF.zapper;
    enemies.push({
      type:'zapper', x:(z.tx*TS), y:16, w:d.w, h:d.h, hp:d.hp, pts:d.pts,
      t: z.t, phase: z.t, flash:0, dead:false, baseX:z.tx*TS, baseY:16,
      vx:0, vy:0, charge:false, active:false
    });
  });
  F.enemies = enemies;

  /* ---- lift / ship / backdrop ---- */
  if(surface){
    for(let i=0;i<90;i++){
      F.stars.push({ x:Math.floor(rng()*WW), y:Math.floor(rng()*(GND-24)), ph:rng()*6.28 });
    }
  }
  F.bg = buildBackdrop(F, rng);

  return F;
}

/* ---------- static tile backdrop baked into a canvas ---------- */
function buildBackdrop(F, rng){
  const c = off(F.WW, PH), g = c.getContext('2d');
  if(F.surface){
    rect(g,0,0,F.WW,PH,BK);
    // stars
    for(const s of F.stars){ pix(g,s.x,s.y,WH); }
    // a big dithered planet low on the horizon
    const px = F.WW-120, py = 78, pr = 46;
    for(let y=-pr;y<=pr;y++) for(let x=-pr;x<=pr;x++){
      if(x*x+y*y <= pr*pr && ((x+y)&1)===0) pix(g,px+x,py+y,MG);
    }
    // ruined skyline
    for(let i=0;i<Math.floor(F.WW/16);i++){
      const x = Math.floor(rng()*F.WW);
      const hh = 6 + Math.floor(rng()*34);
      rect(g,x,GND-10-hh,2+Math.floor(rng()*3),hh,MG);
      for(let k=2;k<hh;k+=5) pix(g,x+1,GND-10-hh+k,BK);
    }
    // horizon stripes
    rect(g,0,GND-8,F.WW,8,MG);
    for(let x=0;x<F.WW;x+=4) pix(g,x,GND-8,BK);
    // ground panels (rows 12..17 may be solid on the surface)
    for(let ty=12;ty<ROWS;ty++) for(let tx=0;tx<F.TW;tx++){
      const v=F.grid[ty*F.TW+tx];
      if(v===1) drawPanel(g,F,tx,ty,rng);
      else if(v===3) drawMachine(g,F,tx,ty);
    }
    // landing pad and the ship
    g.drawImage(SPR.ship, F.shipX, GND-30);
    drawStartPad(g,F);
    return c;
  }

  // underground backdrop: faint circuitry in open space
  for(let i=0;i<F.WW/16;i++){
    const x = Math.floor(rng()*F.WW), y = 20 + Math.floor(rng()*100);
    pix(g,x,y, x%32===0 ? CY : MG);
  }
  for(let sx=0;sx<F.screens;sx++){
    const x0 = sx*SCRW;
    // dotted vertical service line at each screen boundary
    for(let y=20;y<GND;y+=4) pix(g,x0,y, (y%8)? CY:MG);
  }

  // sparse service greebles (kept faint so they never read as walls)
  for(let i=0;i<F.screens*6;i++){
    const x = 10+Math.floor(rng()*(F.WW-20));
    const y = 20+Math.floor(rng()*96);
    for(let k=0;k<3;k++) pix(g,x,y+k*3, (k%2)?CY:MG);
  }
  // ceiling service pipe and hanging cables
  for(let x=2;x<F.WW;x+=3) pix(g,x,18, (x%9===0)?WH:CY);
  for(let x=8;x<F.WW;x+=48){ rect(g,x,16,1,4,WH); }
  for(let i=0;i<F.screens*3;i++){
    const x = 8+Math.floor(rng()*(F.WW-16));
    const len = 8+Math.floor(rng()*26);
    for(let y=19;y<19+len;y+=2) pix(g,x,y,CY);
    pix(g,x,19+len,WH);
  }

  // tiles
  for(let ty=0;ty<ROWS;ty++) for(let tx=0;tx<F.TW;tx++){
    const v = F.grid[ty*F.TW+tx];
    if(v === 1) drawPanel(g, F, tx, ty, rng);
    else if(v === 3) drawMachine(g, F, tx, ty);
  }

  // lift pad
  drawLiftPad(g, F);

  // start pad
  drawStartPad(g, F);

  // ship
  if(F.surface){
    g.drawImage(SPR.ship, F.shipX, GND-30);
  }
  return c;
}

function drawPanel(g, F, tx, ty, rng){
  const x = tx*TS, y = ty*TS;
  rect(g,x,y,TS,TS,MG);
  const up    = ty>0 ? F.grid[(ty-1)*F.TW+tx]===1 : true;
  const down  = ty<ROWS-1 ? F.grid[(ty+1)*F.TW+tx]===1 : true;
  const left  = tx>0 ? F.grid[ty*F.TW+tx-1]===1 : true;
  const right = tx<F.TW-1 ? F.grid[ty*F.TW+tx+1]===1 : true;
  if(!up)    rect(g,x,y,TS,1,WH);
  if(!down)  rect(g,x,y+TS-1,TS,1,WH);
  if(!left)  rect(g,x,y,1,TS,WH);
  if(!right) rect(g,x+TS-1,y,1,TS,WH);
  // panel detail: deterministic hash so the floor is stable
  const h = (tx*73856093 ^ ty*19349663) >>> 0;
  if(h & 1) rect(g,x+3,y+3,2,2,WH);
  else if(h & 2) pix(g,x+5,y+2,WH);
  else if(h & 4) pix(g,x+2,y+5,CY);
  if(!down && up){ for(let i=2;i<7;i+=3) pix(g,x+i,y+TS-2,CY); }
}

function drawMachine(g, F, tx, ty){
  const x = tx*TS, y = ty*TS;
  rect(g,x,y,TS,TS,CY);
  const up    = ty>0 ? F.grid[(ty-1)*F.TW+tx]===1 || F.grid[(ty-1)*F.TW+tx]===3 : true;
  const down  = ty<ROWS-1 ? F.grid[(ty+1)*F.TW+tx]===1 || F.grid[(ty+1)*F.TW+tx]===3 : true;
  const left  = tx>0 ? F.grid[ty*F.TW+tx-1]===1 || F.grid[ty*F.TW+tx-1]===3 : true;
  const right = tx<F.TW-1 ? F.grid[ty*F.TW+tx+1]===1 || F.grid[ty*F.TW+tx+1]===3 : true;
  if(!up)    rect(g,x,y,TS,1,WH);
  if(!down)  rect(g,x,y+TS-1,TS,1,WH);
  if(!left)  rect(g,x,y,1,TS,WH);
  if(!right) rect(g,x+TS-1,y,1,TS,WH);
  const h = (tx*2654435761 ^ ty*40503) >>> 0;
  if(h & 1){ rect(g,x+2,y+2,3,1,WH); rect(g,x+2,y+4,1,2,WH); }
  else { rect(g,x+5,y+2,1,3,MG); pix(g,x+2,y+6,WH); }
  if(h & 8) pix(g,x+6,y+1,CY);
}

function drawStartPad(g, F){
  const x = F.spawnX-8, y = GND-2;
  rect(g,x,y,42,2,CY);
  for(let i=0;i<42;i+=4) pix(g,x+i,y,WH);
  textAt(g,T('dock'),x+9,GND-12,'c',1);
  // blinking marker is drawn live
}
function drawLiftPad(g, F){
  if(F.surface) return;
  const x = F.WW-56;
  rect(g,x,GND-2,56,2,MG);
  for(let i=0;i<56;i+=4) pix(g,x+i,GND-2,WH);
  // rails
  for(let y=GND-6;y<GND;y+=2){ pix(g,x+2,y,CY); pix(g,x+53,y,CY); }
  textAt(g,T('lift'),x+18,GND-14,'m',1);
}
// draw text into an offscreen context using the atlas
function textAt(g,s,x,y,col,sc){
  sc=sc||1;
  const img = FONTS[col]||FONTS.w;
  let cx=x;
  for(const ch of String(s).toUpperCase()){
    const idx = FONT_IDX[ch];
    if(idx!==undefined) g.drawImage(img, idx*5,0,5,7, cx, y, 5*sc, 7*sc);
    cx += 6*sc;
  }
}

/* ==========================================================================
   TUNING
   ========================================================================== */
const BASE_SPEED     = 72;
const BOLT_SPEED     = 430;
const FIRE_INTERVAL  = 0.145;
const HEAT_PER_SHOT  = 5;
const COOL_RATE      = 30;
const TURRET_MAX     = 118;
const TURRET_ACC     = 620;
const ENERGY_DRAIN   = 0.5;     // per second while the tower is detached
const ENERGY_PER_FLOOR = 20;    // the lift salvages a little power

/* ==========================================================================
   PARTICLES
   ========================================================================== */
function part(x,y,vx,vy,col,life,size){
  return {x:x,y:y,vx:vx,vy:vy,col:col,life:life,max:life,size:size||1,ring:false};
}
function sparks(x,y,n,col){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283, s=20+Math.random()*70;
    G.parts.push(part(x,y,Math.cos(a)*s,Math.sin(a)*s,col||WH,0.15+Math.random()*0.25,1));
  }
}
function boom(x,y,scl){
  scl = scl||1;
  for(let i=0;i<Math.round(12*scl);i++){
    const a=Math.random()*6.283, s=20+Math.random()*100;
    G.parts.push(part(x,y,Math.cos(a)*s,Math.sin(a)*s,[WH,CY,MG][i%3],0.25+Math.random()*0.55,Math.random()<0.35?2:1));
  }
  G.parts.push({x:x,y:y,vx:0,vy:0,col:WH,life:0.14,max:0.14,size:Math.round(10*scl),ring:true});
}
function updateParts(dt){
  if(!G.parts.length) return;
  for(const p of G.parts){
    p.life -= dt;
    if(p.ring) continue;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= Math.pow(0.08,dt); p.vy *= Math.pow(0.08,dt);
  }
  G.parts = G.parts.filter(p=>p.life>0);
}

/* ==========================================================================
   COLLISION HELPERS
   ========================================================================== */
function solidTile(tx,ty){
  const F=G.stage;
  if(!F) return true;
  if(tx<0||ty<0||tx>=F.TW||ty>=ROWS) return true;
  const v = F.grid[ty*F.TW+tx];
  return v===1 || v===2 || v===3;
}
function boxSolid(x,y,w,h){
  const x0=Math.floor(x/TS), x1=Math.floor((x+w-1)/TS);
  const y0=Math.floor(y/TS), y1=Math.floor((y+h-1)/TS);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solidTile(tx,ty)) return true;
  return false;
}
function ov(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function turretBox(){ const t=G.turret; return {x:t.x+2,y:t.y+1,w:11,h:8}; }
function baseBox(){ const b=G.base; return {x:b.x+2,y:b.y+3,w:b.w-4,h:b.h-3}; }

/* ==========================================================================
   MOVEMENT
   ========================================================================== */
function moveBase(dx){
  const b=G.base, F=G.stage;
  const dir = Math.sign(dx);
  let remain = Math.abs(dx);
  while(remain > 0){
    const step = Math.min(2, remain);
    const nx = b.x + dir*step;
    if(nx < 2 || nx + b.w > F.WW-1) break;
    if(boxSolid(nx, b.y+2, b.w, b.h-2)) break;
    b.x = nx;
    remain -= step;
  }
  b.x = clamp(b.x, 2, F.WW-b.w-1);
}
function moveTurret(dx,dy){
  const t=G.turret, F=G.stage;
  const hw=11, hh=8, ox=2, oy=1;
  let nx = t.x + dx;
  if(!boxSolid(nx+ox, t.y+oy, hw, hh)) t.x = nx; else t.vx = 0;
  let ny = t.y + dy;
  if(!boxSolid(t.x+ox, ny+oy, hw, hh)) t.y = ny; else t.vy = 0;
  t.x = clamp(t.x, 2, F.WW-17);
  t.y = clamp(t.y, 8, GND-11);
}

/* ==========================================================================
   PLAYER / GAME FLOW
   ========================================================================== */
function placePlayer(F){
  G.base = makeBaseEntity(F.spawnX);
  G.base.y = GND-13;
  G.turret = makeTurretEntity(G.base);
  G.turret.x = G.base.x+6;
  G.turret.y = G.base.y-10;
}
function levelLabel(){
  return G.floor>=TOTAL_FLOORS ? T('surface') : T('level')+pad(G.floor,2);
}
function say(m,t){ G.msg=m; G.msgT = t||1.8; }

function newGame(n){
  n = n||1;
  G.floor=n; G.lives=10; G.energy=100; G.heat=0; G.score=0;
  G.stats={kills:0,deaths:0,shots:0}; G.time=0;
  G.bolts=[]; G.ebolts=[]; G.parts=[]; G.fireCD=0;
  G.cam=0; G.shake=0; G.flash=0; G.msg=''; G.msgT=0; G.hint='';
  G.invuln=1.2; G.deadT=0; G.deadReason=''; G.liftT=0; G.liftY=0;
  G.overReason=''; G.winStats=null;
  G.stage = genFloor(n);
  const F=G.stage;
  F.enemies.forEach(e=>{ e.dead=false; });
  G.pickups = (F.cells||[]).map(c=>({x:c.x,y:c.y,t:c.t||0,taken:false}));
  placePlayer(F);
  G.mode='play'; G.modeT=0;
  say(levelLabel(),1.6);
  SFX.level();
}

function focusX(){
  const t=G.turret;
  return (!t.attached && t.alive) ? (t.x+7) : (G.base.x+13);
}
function updateCamera(){
  const F=G.stage; if(!F) return;
  const sx = clamp(Math.floor(focusX()/SCRW),0,F.screens-1);
  if(sx!==G.cam){ G.cam=sx; SFX.tick(); }
}

function fireBolt(){
  const t=G.turret;
  if(!t.alive) return;
  const mx = t.facing>0 ? t.x+14 : t.x+1;
  const my = t.y+4;
  G.bolts.push({x:mx, y:my, vx:t.facing*BOLT_SPEED, w:8, h:2, life:1.7, dead:false});
  G.stats.shots++;
  sparks(mx,my,2,CY);
  SFX.shoot();
  G.heat = Math.min(100, G.heat + HEAT_PER_SHOT);
  if(G.heat >= 100) killTurret(T('r_overheat'));
}

function killTurret(reason){
  if(G.mode!=='play') return;
  const t=G.turret;
  if(!t.alive || G.invuln>0) return;
  t.alive=false;
  boom(t.x+7,t.y+5,2);
  G.lives--; G.stats.deaths++;
  G.shake=3; G.flash=0.55; G.heat=0;
  G.mode='dead'; G.modeT=0; G.deadT=1.15;
  G.deadReason = reason || 'TURRET DESTROYED';
  SFX.hurt(); SFX.explode();
}

function destroyBase(reason){
  const b=G.base;
  if(!b || !b.alive) return;
  b.alive=false; b.respawn=1.3;
  boom(b.x+13,b.y+6,2.5);
  G.shake=3; SFX.bigboom();
  if(G.turret.alive && G.turret.attached){
    G.turret.attached=false;
    G.turret.x = b.x+6;
    G.turret.y = b.y-12;
    G.turret.vx = 0; G.turret.vy = -20;
  }
  say(T('msg_base_dead'),2.8);
}

function respawnPlayer(){
  const F=G.stage;
  G.heat=0; G.invuln=2.0; G.mode='play'; G.modeT=0;
  G.turret.alive=true;
  if(!G.base.alive){
    G.base.x=F.spawnX; G.base.y=GND-13; G.base.respawn=0; G.base.alive=true;
  }
  const b=G.base;
  G.turret.attached=true; G.turret.vx=0; G.turret.vy=0;
  G.turret.x=b.x+6; G.turret.y=b.y-10;
  updateCamera();
  say(T('msg_life_lost'),1.2);
}

function gameOver(reason){
  if(G.mode==='gameover') return;
  G.mode='gameover'; G.modeT=0;
  G.overReason = reason || G.deadReason || T('over_default');
  if(G.score > G.record){ G.record=G.score; if(!G.demo) saveRecord(G.record); }
  Music.jingle('gameover');
  SFX.gameover();
}
function winGame(){
  if(G.mode==='win') return;
  G.mode='win'; G.modeT=0;
  G.winStats = {score:G.score, floor:G.floor, kills:G.stats.kills, time:G.time, lives:G.lives};
  if(G.score > G.record){ G.record=G.score; if(!G.demo) saveRecord(G.record); }
  Music.jingle('win');
  SFX.win();
}

function startLift(){
  if(G.mode!=='play') return;
  const t=G.turret;
  if(t.alive){ t.attached=true; t.x=G.base.x+6; t.y=G.base.y-10; }
  G.mode='lift'; G.modeT=0; G.liftT=0; G.liftY=0;
  G.score += 500;
  G.lives = Math.min(99, G.lives+1);
  G.energy = Math.min(100, G.energy+ENERGY_PER_FLOOR);
  G.heat = 0;
  say(T('msg_level_clear'),2.4);
  SFX.lift();
  Music.jingle('levelup');
}
function updateLift(dt){
  G.liftT += dt;
  if(G.liftT > 0.5) G.liftY += 190*dt;
  if(G.liftT > 1.9) nextFloor();
}
function nextFloor(){
  G.floor++;
  if(G.floor > TOTAL_FLOORS){ winGame(); return; }
  const F=genFloor(G.floor);
  G.stage = F;
  G.pickups = (F.cells||[]).map(c=>({x:c.x,y:c.y,t:c.t||0,taken:false}));
  G.bolts=[]; G.ebolts=[]; G.parts=[];
  G.heat=0; G.invuln=1.5; G.liftY=0; G.liftT=0; G.cam=0;
  G.time += 0;
  placePlayer(F);
  G.mode='play'; G.modeT=0;
  say(levelLabel(),1.6);
  SFX.level();
}

function toggleDetach(){
  if(G.mode!=='play') return;
  const t=G.turret, b=G.base;
  if(!t.alive) return;
  if(t.attached){
    t.attached=false;
    t.vx = t.facing*22; t.vy = -46;
    SFX.detach();
    say(T('msg_detached'),1.0);
  } else {
    if(!b.alive){ say(T('msg_no_base'),1.2); return; }
    const dx=(t.x+6)-(b.x+6), dy=(t.y+5)-(b.y-5);
    if(Math.hypot(dx,dy) < 26){
      t.attached=true; t.vx=0; t.vy=0;
      t.x=b.x+6; t.y=b.y-10;
      SFX.dock();
      say(T('msg_docked'),0.8);
    } else {
      say(T('msg_fly_back'),1.2);
    }
  }
}

function updateHint(){
  const t=G.turret, b=G.base;
  if(!t || !t.alive){ G.hint=''; return; }
  if(t.attached){
    if(G.heat > 70) G.hint=T('hint_laser_hot');
    else if(G.energy < 20) G.hint=T('hint_power_low');
    else G.hint=T('hint_controls');
  } else {
    if(!b.alive) G.hint=T('hint_fly_dock');
    else {
      const near = Math.hypot((t.x+6)-(b.x+13),(t.y+5)-(b.y-4)) < 30;
      G.hint = near ? T('hint_dock') : T('hint_fly_back');
    }
  }
}

/* ==========================================================================
   PLAY UPDATE
   ========================================================================== */
function updatePlay(dt){
  G.time += dt;
  stepPlayer(dt);
  if(G.mode!=='play') return;
  stepEnemies(dt);
  stepBolts(dt);
  stepEBolts(dt);
  stepPickups(dt);
  checkCollisions();
  if(G.mode!=='play'){ cleanupEntities(); return; }
  cleanupEntities();
  baseRespawn(dt);
  updateCamera();
  checkLift();
  updateHint();
}

function stepPlayer(dt){
  const b=G.base, t=G.turret;
  if(!b || !t) return;
  G.fireCD = Math.max(0, G.fireCD-dt);

  if(b.alive){
    if(t.alive && t.attached){
      const dir = (G.keys.right?1:0) - (G.keys.left?1:0);
      b.vx = dir*BASE_SPEED;
      moveBase(b.vx*dt);
      if(dir) t.facing = dir;
      t.x = b.x+6;
      t.y = b.y-10;
    } else {
      b.vx = 0;
    }
  }

  if(t.alive && !t.attached){
    const ax = (G.keys.right?1:0) - (G.keys.left?1:0);
    const ay = (G.keys.down?1:0) - (G.keys.up?1:0);
    if(ax) t.facing = ax;
    t.vx += ax*TURRET_ACC*dt;
    t.vy += ay*TURRET_ACC*dt;
    if(!ax) t.vx *= Math.pow(0.0006,dt);
    if(!ay) t.vy *= Math.pow(0.0006,dt);
    t.vx = clamp(t.vx, -TURRET_MAX, TURRET_MAX);
    t.vy = clamp(t.vy, -TURRET_MAX, TURRET_MAX);
    moveTurret(t.vx*dt, t.vy*dt);
    G.energy = Math.max(0, G.energy - ENERGY_DRAIN*dt);
    if(G.energy <= 0){ gameOver(T('r_power')); return; }
  }

  if(t.alive){
    if(G.keys.fire && G.fireCD <= 0){
      fireBolt();
      G.fireCD = FIRE_INTERVAL;
    } else if(G.mode==='play' && !G.keys.fire){
      G.heat = Math.max(0, G.heat - COOL_RATE*dt);
    }
  }
  if(G.invuln > 0) G.invuln = Math.max(0, G.invuln-dt);
}

function stepEnemies(dt){
  const F=G.stage;
  for(const e of F.enemies){
    if(e.dead) continue;
    e.t += dt;
    if(e.flash > 0) e.flash -= dt;

    if(e.type==='saucer'){
      e.x += e.vx*dt;
      if(e.x < 4 || e.x > F.WW-e.w-4) e.vx *= -1;
      e.y = clamp(e.baseY + Math.sin(e.t*2.2 + e.phase)*9, 20, GND-e.h-8);
    } else if(e.type==='bug'){
      e.x = e.baseX + Math.sin(e.t*1.3 + e.phase)*34;
      e.y = clamp(e.baseY + Math.sin(e.t*2.1 + e.phase*1.7)*26, 20, GND-e.h-8);
    } else if(e.type==='ring'){
      e.x += e.vx*dt; e.y += e.vy*dt;
      if(e.x < 4 || e.x > F.WW-e.w-4) e.vx *= -1;
      if(e.y < 18 || e.y > GND-e.h-6) e.vy *= -1;
    } else if(e.type==='hunter'){
      const target = G.turret.alive ? G.turret : G.base;
      const tx = target.x + (target.w||14)/2;
      const ty = target.y + (target.h||10)/2;
      let dx = tx-(e.x+e.w/2), dy = ty-(e.y+e.h/2);
      const d = Math.hypot(dx,dy) || 1;
      e.x += dx/d*e.spd*dt;
      e.y += dy/d*e.spd*dt;
      e.facing = dx >= 0 ? 1 : -1;
      e.shootT -= dt;
      if(e.shootT <= 0 && d < 300 && G.turret.alive && G.mode==='play'){
        e.shootT = 2.3 + Math.random()*1.5;
        const sp = 76;
        G.ebolts.push({x:e.x+e.w/2-2, y:e.y+e.h/2-2, vx:dx/d*sp, vy:dy/d*sp, w:4, h:4, life:4.5, dead:false});
        SFX.hit();
      }
    } else if(e.type==='zapper'){
      const ph = (e.t + e.phase) % 2.5;
      e.active = ph > 1.85;
      e.charge = ph > 1.40 && !e.active;
    }
  }
}

function stepBolts(dt){
  const F=G.stage;
  for(const b of G.bolts){
    if(b.dead) continue;
    b.x += b.vx*dt;
    b.life -= dt;
    if(b.life <= 0 || b.x < -20 || b.x > F.WW+20) b.dead=true;
  }
}
function stepEBolts(dt){
  const F=G.stage;
  for(const b of G.ebolts){
    if(b.dead) continue;
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if(b.life <= 0 || b.x < 0 || b.x > F.WW || b.y < 0 || b.y > GND) b.dead=true;
  }
}
function stepPickups(dt){
  const t=G.turret;
  const tb = turretBox();
  for(const p of G.pickups){
    if(p.taken) continue;
    p.t += dt;
    if(!t.alive) continue;
    const yy = p.y + Math.sin(p.t*3)*2;
    if(ov(tb,{x:p.x-2,y:yy-2,w:12,h:12})){
      p.taken = true;
      G.score += 250;
      sparks(p.x+4, yy+4, 10, CY);
      SFX.pick();
      say(T('msg_cell'),1.1);
    }
  }
}

function checkCollisions(){
  const F=G.stage, t=G.turret, b=G.base;

  /* --- player bolts --- */
  for(const bolt of G.bolts){
    if(bolt.dead) continue;
    const bb = {x:bolt.x, y:bolt.y, w:8, h:2};
    for(const bar of F.barriers){
      if(bar.dead) continue;
      if(ov(bb,{x:bar.x,y:bar.y,w:bar.w,h:bar.h})){
        if(bolt.vx > 0){
          SFX.clang();
          bar.flash = Math.max(bar.flash, 0.09);
          sparks(bolt.x+8, bolt.y+1, 4, WH);
          if(G.msgT <= 0) say(T('msg_armour_front'),1.6);
        } else {
          bar.hp--; bar.flash=0.16; SFX.hit();
          sparks(bolt.x, bolt.y+1, 7, MG);
          if(bar.hp <= 0) breakBarrier(bar);
        }
        bolt.dead = true;
        break;
      }
    }
    if(bolt.dead) continue;
    if(boxSolid(bolt.x, bolt.y, 8, 2)){
      sparks(bolt.x+4, bolt.y+1, 2, CY);
      bolt.dead = true;
      continue;
    }
    if(b.alive && ov(bb, baseBox())){
      bolt.dead = true;
      destroyBase('HIT BY YOUR OWN LASER');
      continue;
    }
    for(const e of F.enemies){
      if(e.dead) continue;
      if(ov(bb,{x:e.x+1,y:e.y+1,w:e.w-2,h:e.h-2})){
        bolt.dead = true;
        if(e.invul){
          SFX.clang(); sparks(bolt.x+4,bolt.y+1,5,WH);
        } else {
          e.hp--; e.flash=0.14; SFX.hit();
          if(e.hp <= 0) killEnemy(e);
        }
        break;
      }
    }
  }

  /* --- turret hazards --- */
  if(t.alive && G.invuln <= 0 && G.mode==='play'){
    const tb = turretBox();
    for(const e of F.enemies){
      if(e.dead) continue;
      if(e.type==='zapper'){
        if(e.active && ov(tb,{x:e.x+4,y:32,w:4,h:GND-32})){ killTurret(T('r_arc')); break; }
        continue;
      }
      if(ov(tb,{x:e.x+1,y:e.y+1,w:e.w-2,h:e.h-2})){ killTurret(T('r_drone')); break; }
    }
    if(G.mode==='play'){
      for(const eb of G.ebolts){
        if(eb.dead) continue;
        if(ov(tb,{x:eb.x,y:eb.y,w:eb.w,h:eb.h})){
          killTurret(T('r_shot'));
          eb.dead = true;
          break;
        }
      }
    }
  }

  /* --- base hazards --- */
  if(b.alive && G.mode==='play'){
    const bbx = baseBox();
    for(const e of F.enemies){
      if(e.dead) continue;
      if(e.type==='zapper'){
        if(e.active && ov(bbx,{x:e.x+4,y:32,w:4,h:GND-32})){ destroyBase('ELECTRIC ARC'); break; }
        continue;
      }
      if(ov(bbx,{x:e.x+1,y:e.y+1,w:e.w-2,h:e.h-2})){ destroyBase('DRONE COLLISION'); break; }
    }
    if(b.alive){
      for(const eb of G.ebolts){
        if(eb.dead) continue;
        if(ov(bbx,{x:eb.x,y:eb.y,w:eb.w,h:eb.h})){ destroyBase('SHOT DOWN'); eb.dead=true; break; }
      }
    }
  }
}

function breakBarrier(bar){
  bar.dead = true;
  G.score += 200;
  G.stats.kills++;
  boom(bar.x+bar.w/2, bar.y+bar.h/2, 2.6);
  G.shake = 2.5;
  SFX.bigboom();
  const F=G.stage;
  for(let ty=12; ty<16; ty++) for(let tx=bar.tx; tx<bar.tx+bar.tw; tx++){
    const idx = ty*F.TW+tx;
    if(F.grid[idx]===2) F.grid[idx]=0;
  }
  say(T('msg_armour_breach'),1.2);
}

function killEnemy(e){
  e.dead = true;
  G.score += e.pts||0;
  G.stats.kills++;
  boom(e.x+e.w/2, e.y+e.h/2, e.type==='zapper'?3:1.6);
  SFX.explode();
  if(e.type==='zapper') say(T('msg_sentry'),1.2);
}

function cleanupEntities(){
  const F=G.stage;
  if(!F) return;
  G.bolts = G.bolts.filter(b=>!b.dead);
  G.ebolts = G.ebolts.filter(b=>!b.dead);
  F.enemies = F.enemies.filter(e=>!e.dead);
}

function baseRespawn(dt){
  const b=G.base;
  if(!b || b.alive) return;
  b.respawn -= dt;
  if(b.respawn <= 0){
    b.x = G.stage.spawnX; b.y = GND-13;
    b.vx = 0; b.alive = true;
    SFX.dock();
    say(T('msg_new_base'),1.6);
  }
}

function checkLift(){
  if(G.mode!=='play') return;
  const F=G.stage, b=G.base;
  if(!b || !b.alive) return;
  if(F.surface){
    if(b.x + b.w >= F.shipX + 12){ winGame(); }
  } else {
    if(b.x + b.w >= F.WW - 24){ startLift(); }
  }
}

/* ==========================================================================
   TITLE / MUSIC
   ========================================================================== */
const MELODY = [220,0,220,0,262,0,330,0,294,0,262,0,220,0,196,0,165,0,196,0,220,0,262,0,220,0,196,0,165,0,131,0];
function updateStars(dt){
  for(const s of G.stars){
    s.y += s.v*dt;
    if(s.y > H){ s.y = 0; s.x = Math.random()*W; }
  }
}
function updateMusic(dt){
  if(A.muted || G.mode!=='title' || !A.ctx) return;
  G.musicT -= dt;
  if(G.musicT <= 0){
    G.musicT = 0.19;
    const f = MELODY[(G.musicI++) % MELODY.length];
    if(f) A.tone(f,0.16,'square',0.022);
  }
}

/* ==========================================================================
   RENDER — PLAYFIELD
   ========================================================================== */
function linePix(x0,y0,x1,y1,col){
  x0|=0; y0|=0; x1|=0; y1|=0;
  const dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  const sx=x0<x1?1:-1, sy=y0<y1?1:-1;
  let err=dx-dy;
  for(let i=0;i<80;i++){
    pix(ctx,x0,y0,col);
    if(x0===x1 && y0===y1) break;
    const e2=2*err;
    if(e2 > -dy){ err-=dy; x0+=sx; }
    if(e2 < dx){ err+=dx; y0+=sy; }
  }
}

function drawBarrier(bar,sx){
  const y=bar.y, w=bar.w, h=bar.h;
  rect(ctx,sx,y,w,h,CY);
  for(let yy=7; yy<h-6; yy+=10) rect(ctx,sx+3,y+yy,w-6,2,MG);
  // armoured front plate (faces the approaching base)
  rect(ctx,sx,y,5,h,WH);
  for(let yy=1; yy<h; yy+=7) rect(ctx,sx+1,y+yy,2,4,CY);
  // weak back side: glowing core
  const cx=sx+w-5, cy=y+h/2;
  ell(ctx,cx,cy,4,4,WH);
  ell(ctx,cx,cy,3,3,MG);
  ell(ctx,cx,cy,1,1,WH);
  frame(ctx,sx,y,w,h,WH);
  // hit points
  for(let i=0;i<bar.maxhp;i++){
    const px=sx+7+i*4, py=y+2;
    rect(ctx,px,py,2,2, i<bar.hp?WH:BK);
  }
  if(bar.hp < bar.maxhp){
    const n=bar.maxhp-bar.hp;
    for(let i=0;i<n;i++){
      const yy=y+10+i*9;
      linePix(sx+7,yy,sx+11,yy+4,BK);
      linePix(sx+11,yy+4,sx+8,yy+8,BK);
    }
  }
  if(bar.flash>0){
    ctx.globalAlpha = clamp(bar.flash*4,0,0.8);
    rect(ctx,sx,y,w,h,WH);
    ctx.globalAlpha = 1;
  }
}

function drawArc(sx, active){
  if(!active) return;
  const cx = sx+6;
  let px = cx;
  for(let y=32; y<GND; y+=8){
    const nx = cx + (Math.random()*9-4);
    const col = Math.random()<0.35 ? WH : CY;
    linePix(px,y,nx,y+8,col);
    pix(px+1,y+2,CY);
    px = nx;
  }
}

function drawEnemies(camX){
  const F=G.stage;
  // sentries first
  for(const e of F.enemies){
    if(e.dead || e.type!=='zapper') continue;
    const sx = e.x-camX;
    if(sx<-20 || sx>340) continue;
    ctx.drawImage(SPR.zapper, Math.round(sx), 16);
    if(e.charge){
      const bx = sx+6;
      const n = Math.random()<0.7?3:1;
      for(let i=0;i<n;i++) pix(ctx, bx+Math.floor(Math.random()*7-3), 30+Math.floor(Math.random()*4), WH);
    }
    if(e.active) drawArc(sx, true);
    if(e.flash>0){
      ctx.globalAlpha = clamp(e.flash*4,0,0.7);
      rect(ctx,sx,16,e.w,e.h,WH);
      ctx.globalAlpha = 1;
    }
  }
  // mobile drones
  for(const e of F.enemies){
    if(e.dead || e.type==='zapper') continue;
    const sx = e.x-camX;
    if(sx<-30 || sx>350) continue;
    let img = SPR.saucer;
    if(e.type==='bug') img = SPR.bug;
    else if(e.type==='ring') img = SPR.ring;
    else if(e.type==='hunter') img = e.facing<0 ? SPR.hunterL : SPR.hunterR;
    ctx.drawImage(img, Math.round(sx), Math.round(e.y));
    if(e.type==='ring'){
      const a = e.t*5;
      pix(ctx, Math.round(sx+5+Math.cos(a)*5), Math.round(e.y+5+Math.sin(a)*5), WH);
    }
    if(e.flash>0){
      ctx.globalAlpha = clamp(e.flash*4,0,0.7);
      rect(ctx,sx,e.y,e.w,e.h,WH);
      ctx.globalAlpha = 1;
    }
  }
}

function drawPickups(camX){
  for(const p of G.pickups){
    if(p.taken) continue;
    const sx = p.x-camX;
    if(sx<-16 || sx>336) continue;
    const yy = p.y + Math.sin(p.t*3)*2;
    ctx.drawImage(SPR.cell, Math.round(sx), Math.round(yy));
    if(Math.sin(p.t*6)>0.8) pix(ctx, Math.round(sx+3), Math.round(yy-3), WH);
  }
}

function drawBolts(camX){
  for(const b of G.bolts){
    const sx = b.x-camX;
    rect(ctx,sx,b.y,8,2,WH);
    rect(ctx,sx+1,b.y+1,6,1,CY);
  }
  for(const b of G.ebolts){
    const sx = b.x-camX;
    rect(ctx,sx,b.y,4,4,MG);
    rect(ctx,sx+1,b.y+1,2,2,WH);
  }
}

function drawParts(camX){
  for(const p of G.parts){
    const a = clamp(p.life/p.max,0,1);
    const sx = p.x-camX;
    if(p.ring){
      const s = Math.round(p.size*(1-a)+2);
      ctx.globalAlpha = a;
      frame(ctx,Math.round(sx-s/2),Math.round(p.y-s/2),s,s,WH);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.round(sx),Math.round(p.y),p.size,p.size);
      ctx.globalAlpha = 1;
    }
  }
}

function drawPlayer(camX){
  const yo = (G.mode==='lift') ? -G.liftY : 0;
  const b=G.base, t=G.turret;
  // base ghost at the dock
  if(!b.alive){
    if(Math.sin(G.t*6)>0){
      ctx.drawImage(SPR.base, Math.round(G.stage.spawnX-camX), GND-13);
    }
  } else {
    ctx.drawImage(SPR.base, Math.round(b.x-camX), Math.round(b.y+yo));
    const led = (Math.sin(G.t*8)>0) ? WH : MG;
    pix(ctx, Math.round(b.x-camX+12), Math.round(b.y+yo+1), led);
    if(G.mode==='lift'){
      const px = b.x-camX;
      rect(ctx,px-6, b.y+13+yo, b.w+12, 3, WH);
      for(let i=0;i<b.w+12;i+=4) pix(ctx, Math.round(px-6+i), b.y+13+yo, CY);
      linePix(px-6, b.y+13+yo, px-6, b.y+13+yo-260, MG);
      linePix(px+b.w+6, b.y+13+yo, px+b.w+6, b.y+13+yo-260, MG);
    }
  }
  if(t.alive){
    const img = t.facing<0 ? SPR.turretL : SPR.turretR;
    ctx.drawImage(img, Math.round(t.x-camX), Math.round(t.y+yo));
    if(!t.attached && G.keys.fire) pix(ctx, Math.round(t.x-camX + (t.facing>0?15:0)), Math.round(t.y+yo+4), WH);
    if(G.invuln>0 && Math.sin(G.t*22)>0){
      frame(ctx, Math.round(t.x-camX), Math.round(t.y+yo), t.w, t.h, WH);
    }
  }
}

function drawMarkers(camX){
  const b=G.base, t=G.turret;
  if(!t.attached && t.alive && b && b.alive){
    const bx = b.x + b.w/2 - camX;
    if(bx < 0 || bx > W){
      const left = bx < 0;
      const ex = left ? 4 : W-4;
      const ey = 58;
      for(let i=0;i<7;i++) rect(ctx, ex + (left?i:-i-1), ey-i+3, 1, 2*i+1, CY);
      const label = T('base');
      const lx = left ? ex+12 : ex-12-textW(label);
      text(label, lx, ey-4, 'c');
    }
  }
}

function drawPlay(){
  const F=G.stage;
  if(!F) return;
  const camX=G.cam*SCRW;
  rect(ctx,0,0,W,H,BK);
  ctx.save();
  if(G.shake>0){
    const s=Math.ceil(G.shake);
    ctx.translate(Math.round((Math.random()*2-1)*s), Math.round((Math.random()*2-1)*s));
  }
  ctx.drawImage(F.bg, camX, 0, SCRW, PH, 0, 0, SCRW, PH);

  for(const bar of F.barriers){
    if(bar.dead) continue;
    const sx=bar.x-camX;
    if(sx>-20 && sx<W) drawBarrier(bar,sx);
  }
  drawPickups(camX);
  drawEnemies(camX);
  drawPlayer(camX);
  drawBolts(camX);
  drawParts(camX);
  drawMarkers(camX);
  ctx.restore();

  drawHUD();
  drawToast();
  if(G.flash>0 && G.mode!=='paused'){
    ctx.globalAlpha = clamp(G.flash,0,0.75);
    rect(ctx,0,0,W,PH,WH);
    ctx.globalAlpha = 1;
  }
}

/* ==========================================================================
   HUD
   ========================================================================== */
function dispBox(x,y,digits,val,sc){
  sc = sc||1;
  const w = digits*6*sc+4, h = 7*sc+4;
  rect(ctx,x,y,w,h,WH);
  frame(ctx,x,y,w,h,BK);
  for(let i=1;i<digits;i++) rect(ctx,x+i*6*sc,y+1,1,h-2,CY);
  text(pad(val,digits), x+2, y+2, 'k', sc);
  return w;
}
function drawBar(x,y,w,h,frac,col){
  rect(ctx,x,y,w,h,BK);
  frame(ctx,x,y,w,h,WH);
  const fw = Math.round((w-2)*clamp(frac,0,1));
  if(fw>0){
    rect(ctx,x+1,y+1,fw,h-2,col);
    rect(ctx,x+1,y+1,fw,1,WH);
  }
}
function drawHUD(){
  const y0=HUD_Y;
  rect(ctx,0,y0,W,H-y0,BK);
  rect(ctx,0,y0,W,2,MG);
  rect(ctx,0,H-2,W,2,MG);
  rect(ctx,5,y0+2,310,48,CY);
  frame(ctx,5,y0+2,310,48,WH);
  dashFrame(ctx,9,y0+5,302,32,BK,4);

  text(T('hud_level'), 10, y0+7, 'k');
  dispBox(52, y0+4, 2, Math.min(G.floor,99), 1);
  text(T('hud_power'), 10, y0+17, 'k');
  drawBar(52, y0+18, 64, 5, G.energy/100, (G.energy<25 && Math.sin(G.t*10)>0)?WH:CY);
  text(T('hud_points'), 10, y0+27, 'k');
  dispBox(52, y0+24, 6, G.score, 1);

  text(T('hud_lives'), 272, y0+7, 'k');
  dispBox(244, y0+4, 2, G.lives, 1);
  text(T('hud_laser'), 272, y0+17, 'k');
  drawBar(196, y0+18, 64, 5, G.heat/100, (G.heat>72 && Math.sin(G.t*12)>0)?WH:MG);
  text(T('hud_record'), 272, y0+27, 'k');
  dispBox(216, y0+24, 6, Math.max(G.record,G.score), 1);

  for(let y=y0+7; y<y0+36; y+=4){
    rect(ctx,150,y,4,2,MG);
    rect(ctx,166,y,4,2,CY);
  }
  rect(ctx,160,y0+6,1,30,WH);
  rect(ctx,159,y0+6,1,30,MG);

  if(G.hint) textC(G.hint, 160, y0+40, 'k');
}

function drawToast(){
  if(G.msgT<=0 || !G.msg) return;
  const m = G.msg;
  const w = Math.min(310, textW(m)+10);
  const x = Math.round((W-w)/2);
  rect(ctx,x,5,w,11,BK);
  frame(ctx,x,5,w,11,CY);
  textC(m,160,7,'c');
}
function drawPause(){
  ctx.globalAlpha = 0.6;
  rect(ctx,0,0,W,PH,BK);
  ctx.globalAlpha = 1;
  textC(T('pause'), 160, 54, 'c', 2);
  textC(T('pause_hint'), 160, 82, 'w', 1);
  frame(ctx,60,44,200,50,CY);
}

  text(s,x-o,y,'m',sc);
  text(s,x+o,y,'m',sc);
  text(s,x,y-o,'m',sc);
  text(s,x,y+o,'m',sc);
  text(s,x+o,y+o,'m',sc);
  text(s,x,y,'w',sc);
}

}

function drawGameOver(){

  for(let x=0;x<W;x+=2){ pix(ctx,x,3,MG); pix(ctx,x,H-4,MG); }

}

function drawWin(){
  const L=L10N[LANG];
  rect(ctx,0,0,W,H,BK);
  for(let i=0;i<80;i++){
    const x=(i*97+31)%W, y=(i*57+13)%160;
    pix(ctx,x,y, i%7===0?CY:WH);
  }
  rect(ctx,0,178,W,2,WH);
  ditherRect(ctx,0,180,W,20,MG,0);
  ctx.drawImage(SPR.ship, 208, 148);
  ctx.drawImage(SPR.base, 64, 151);
  ctx.drawImage(SPR.turretR, 76, 143);

  textC(L.win_title,160,14,'c',2);
  let y=42;
  for(const line of L.win_lines){ textC(line,160,y,'w',1); y+=9; }
  const ws=G.winStats||{score:G.score,floor:G.floor,kills:G.stats.kills,time:G.time};
  textC(L.st_score+' '+pad(ws.score,6)+'    '+L.st_kills+' '+pad(ws.kills,3),160,88,'c',1);
  textC(L.st_time+' '+fmtTime(ws.time)+'    '+L.st_record+' '+pad(Math.max(G.record,ws.score),6),160,100,'c',1);
  if(Math.sin(G.t*4)>0) textC(L.back,160,116,'m',1);
  rect(ctx,80,182,W-160,12,BK);
  frame(ctx,80,182,W-160,12,CY);
  textC(L.win_foot,160,184,'w',1);
}

function wrapCentered(s,cx,y,col,sc,maxW,lineH){
  const words=String(s).split(' ');
  const lines=[]; let cur='';
  for(const w of words){
    const t2 = cur ? cur+' '+w : w;
    if(textW(t2,sc) > maxW && cur){ lines.push(cur); cur=w; }
    else cur=t2;
  }
  if(cur) lines.push(cur);
  let yy=y;
  for(const l of lines){ textC(l,cx,yy,col,sc); yy+=lineH; }
  return yy;
}
function fmtTime(t){
  const m=Math.floor(t/60), s=Math.floor(t%60);
  return pad(m,2)+':'+pad(s,2);
}

/* ==========================================================================
   INPUT HANDLING
   ========================================================================== */
function onKeyDown(e){
  A.init();
  const m = G.mode;
  if(e.code==='KeyL'){ e.preventDefault(); toggleLang(); return; }
  if(e.code==='KeyM'){ e.preventDefault(); toggleMute(); return; }
  if(e.code==='KeyG'){ e.preventDefault(); toggleGfx(); return; }
  if(e.code==='KeyP' || e.code==='Escape'){
    e.preventDefault();
    if(m==='play') G.mode='paused';
    else if(m==='paused') G.mode='play';
    else if(m==='briefing') G.mode='title';
    return;
  }
  if(e.code==='Enter' || e.code==='Space'){
    if(m!=='play'){
      e.preventDefault();
      onEnter();
      return;
    }
  }
  if(e.code==='KeyI' && m==='title'){ e.preventDefault(); G.mode='briefing'; return; }
  const k = KEYMAP[e.code];
  if(k){
    e.preventDefault();
    if(!G.keys[k]){
      G.keys[k] = true;
      if(k==='detach') toggleDetach();
    }
  }
}
function onKeyUp(e){
  const k = KEYMAP[e.code];
  if(k){ e.preventDefault(); G.keys[k] = false; }
}
function onEnter(){
  if(G.mode==='title'){ A.init(); startGame(); }
  else if(G.mode==='briefing'){ G.mode='title'; }
  else if(G.mode==='paused'){ G.mode='play'; }
  else if(G.mode==='gameover' || G.mode==='win'){ G.mode='title'; }
}
function startGame(){
  A.init();
  G.demo = false;
  newGame(1);
}
function toggleMute(){
  A.muted = !A.muted;
  if(!A.muted) A.init();
  try{ if(A.master) A.master.gain.value = A.muted ? 0 : 0.55; }catch(e){}
  if(G.mode==='play' || G.mode==='paused'){
    say(A.muted ? T('mute_off') : T('mute_on'), 1.1);
  }
}

/* ==========================================================================
   MAIN LOOP
   ========================================================================== */
function update(dt){
  G.t += dt; G.modeT += dt;
  syncMusic();
  if(G.flash > 0) G.flash = Math.max(0, G.flash - dt*2.2);
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*10);
  if(G.msgT > 0) G.msgT = Math.max(0, G.msgT - dt);
  updateParts(dt);
  switch(G.mode){
    case 'title': updateStars(dt); updateMusic(dt); break;
    case 'play': updatePlay(dt); break;
    case 'lift': updateLift(dt); break;
    case 'dead':
      G.deadT -= dt;
      if(G.deadT <= 0){
        if(G.lives <= 0) gameOver(G.deadReason);
        else respawnPlayer();
      }
      break;
  }
}

function renderRetro(){
  rect(ctx,0,0,W,H,BK);
  switch(G.mode){
    case 'title': drawTitle(); break;
    case 'briefing': drawBriefing(); break;
    case 'gameover': drawGameOver(); break;
    case 'win': drawWin(); break;
    default:
      drawPlay();
      if(G.mode==='paused') drawPause();
      break;
  }
}
function render(){
  if(GFX === 'modern') renderModern();
  else renderRetro();
}

let lastT = 0;
let reporting = false;
function loop(ts){
  const dt = Math.min(0.05, lastT ? (ts-lastT)/1000 : 1/60);
  lastT = ts;
  fit();
  try{
    update(dt);
    render();
  }catch(err){
    if(!reporting){
      reporting = true;
      reportError((err && err.message) ? err.message : String(err));
    }
  }
  requestAnimationFrame(loop);
}

function reportError(msg){
  try{
    document.title = 'ERR: ' + msg;
    const el = document.getElementById('err');
    if(el){ el.style.display='block'; el.textContent += msg + '\n'; }
  }catch(e){}
}


/* ==========================================================================
   CHIPTUNE SOUNDTRACK  (4-channel WebAudio tracker)
   ========================================================================== */
let PULSE = null;
function buildPulseWave(duty){
  const N = 32;
  const real = new Float32Array(N), imag = new Float32Array(N);
  for(let k=1;k<N;k++) real[k] = (4/(k*Math.PI)) * Math.sin(Math.PI*k*duty);
  return A.ctx.createPeriodicWave(real, imag);
}
function ensurePulse(){
  if(PULSE || !A.ctx) return;
  PULSE = { p12: buildPulseWave(0.125), p25: buildPulseWave(0.25), p50: buildPulseWave(0.5) };
}
function noteFreq(n){ return 440 * Math.pow(2, (n-69)/12); }

function musicVoice(inst, note, dur, when, vol){
  if(!A.ctx || A.muted || !Music.gain) return;
  Music.notes = (Music.notes||0) + 1;
  const c = A.ctx;
  const v = Math.max(0.0004, vol || 0.06);
  try{
    if(inst === 'kick'){
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(155, when);
      o.frequency.exponentialRampToValueAtTime(42, when+0.12);
      g.gain.setValueAtTime(v, when);
      g.gain.exponentialRampToValueAtTime(0.0001, when+0.17);
      o.connect(g); g.connect(Music.gain);
      o.start(when); o.stop(when+0.2);
      return;
    }
    if(inst === 'snare' || inst === 'hat'){
      if(!A.noiseBuf) return;
      const s = c.createBufferSource(); s.buffer = A.noiseBuf;
      const f = c.createBiquadFilter();
      f.type = (inst === 'hat') ? 'highpass' : 'bandpass';
      f.frequency.value = (inst === 'hat') ? 7200 : 1900;
      f.Q.value = 0.7;
      const g = c.createGain();
      g.gain.setValueAtTime(v, when);
      g.gain.exponentialRampToValueAtTime(0.0001, when + (inst==='hat' ? 0.045 : 0.13));
      s.connect(f); f.connect(g); g.connect(Music.gain);
      s.start(when); s.stop(when + dur + 0.02);
      return;
    }
    const o = c.createOscillator(), g = c.createGain();
    if(inst === 'tri'){ o.type = 'triangle'; }
    else { o.type = 'square'; if(PULSE && PULSE[inst]) o.setPeriodicWave(PULSE[inst]); }
    o.frequency.setValueAtTime(noteFreq(note), when);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(v, when+0.012);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, v*0.55), when+Math.max(0.05, dur*0.55));
    g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
    o.connect(g); g.connect(Music.gain);
    o.start(when); o.stop(when+dur+0.03);
  }catch(e){}
}

const CH = {

  G: {root:43, arp:[67,71,74,71,67,71,74,71,67,71,74,71,67,71,74,71]}

function makeTrack(bpm, bars, defs){
  const length = bars*16;
  const channels = defs.map(d=>{
    const events = Array.from({length:length}, ()=>[]);
    for(const ev of d.notes){
      if(ev[1] === null || ev[1] === undefined) continue;
      const st = ((ev[0] % length) + length) % length;
      events[st].push({n:ev[1], l:ev[2] || 1});
    }
    return {inst:d.inst, vol:d.vol, events:events};
  });
  return {bpm:bpm, length:length, channels:channels};
}
function buildTitleTrack(){
  const bars = [CH.Am, CH.F, CH.C, CH.G];
  const lead = [
    [0,76,2],[2,74,2],[4,72,2],[6,71,2],[8,69,4],[12,64,2],[14,67,2],
    [16,65,2],[18,69,2],[20,72,4],[24,74,2],[26,72,2],[28,69,4],
    [32,67,2],[34,72,2],[36,76,4],[40,74,2],[42,72,2],[44,67,4],
    [48,71,2],[50,74,2],[52,79,4],[56,77,2],[58,74,2],[60,71,4]
  ];
  const bass=[], arp=[], kick=[], snare=[], hat=[];
  bars.forEach((c,i)=>{
    const o=i*16, p=[0,12,7,12];
    for(let k=0;k<4;k++) bass.push([o+k*4, c.root+p[k], 3]);
    for(let k=0;k<16;k++) arp.push([o+k, c.arp[k], 1]);
    kick.push([o,0,1],[o+8,0,1]);
    snare.push([o+4,0,1],[o+12,0,1]);
    for(let k=0;k<16;k+=2) hat.push([o+k,0,1]);
  });
  return makeTrack(96,4,[
    {inst:'p25', vol:0.085, notes:lead},
    {inst:'p12', vol:0.034, notes:arp},
    {inst:'tri', vol:0.10,  notes:bass},
    {inst:'kick',vol:0.16,  notes:kick},

const Music = {
  gain:null, timer:null, name:null, track:null, step:0, nextT:0, ducked:false, notes:0,
  ensure(){
    if(!A.ctx) return;
    ensurePulse();
    if(!this.gain){
      this.gain = A.ctx.createGain();
      this.gain.gain.value = 0.55;
      this.gain.connect(A.master);
    }
    if(!this.timer) this.timer = setInterval(()=>this.pump(), 25);
  },
  setTrack(name){
    if(this.name === name) return;
    this.name = name;
    this.track = name ? (TRACKS[name] || null) : null;
    this.step = 0;
    if(A.ctx) this.nextT = A.ctx.currentTime + 0.06;
  },
  pump(){
    if(!A.ctx || !this.track) return;
    this.ensure();
    const stepDur = 60/this.track.bpm/4;
    if(this.nextT < A.ctx.currentTime - 0.4) this.nextT = A.ctx.currentTime + 0.05;
    let guard = 0;
    while(this.nextT < A.ctx.currentTime + 0.18 && guard++ < 64){
      if(!A.muted) this.playStep(this.track, this.step, this.nextT);
      this.nextT += stepDur;
      this.step = (this.step + 1) % this.track.length;
    }
  },
  playStep(tr, s, t){
    const stepDur = 60/tr.bpm/4;
    for(const ch of tr.channels){
      const evs = ch.events[s];
      if(!evs || !evs.length) continue;
      for(const ev of evs){
        musicVoice(ch.inst, ev.n, Math.max(0.04, ev.l*stepDur*0.92), t, ch.vol);
      }
    }
  },
  jingle(name){
    const seq = JINGLES[name];
    if(!seq || !A.ctx) return;
    this.ensure();
    const t0 = A.ctx.currentTime + 0.04;
    for(const ev of seq) musicVoice(ev.inst, ev.n, ev.d, t0+ev.t, ev.vol);
  },
  duck(paused){
    if(!this.gain || !A.ctx) return;
    if(this.ducked === paused) return;
    this.ducked = paused;
    try{ this.gain.gain.setTargetAtTime(paused ? 0.22 : 0.55, A.ctx.currentTime, 0.15); }catch(e){}
  }
};
function syncMusic(){
  if(!A.ctx) return;
  Music.ensure();
  const m = G.mode;
  if(m === 'title' || m === 'briefing') Music.setTrack('title');
  else if(m === 'play' || m === 'lift' || m === 'paused' || m === 'dead') Music.setTrack('game');
  else Music.setTrack(null);
  Music.duck(m === 'paused' || m === 'briefing');
}

const MC = {

};
const MFONT = '"SF Pro Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif';
let M_STARS = null;
function mStars(){
  if(M_STARS) return M_STARS;
  M_STARS = [];
  for(let i=0;i<95;i++){
    M_STARS.push({x:Math.random()*W, y:Math.random()*200, r:0.2+Math.random()*0.8, p:Math.random()*6.28, s:0.4+Math.random()});
  }
  return M_STARS;
}
function mPath(x,y,w,h,r){
  r = Math.min(r||0, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function mFill(x,y,w,h,r,fill){
  mPath(x,y,w,h,r); ctx.fillStyle = fill; ctx.fill();
}
function mStroke(x,y,w,h,r,stroke,lw){
  mPath(x,y,w,h,r); ctx.strokeStyle = stroke; ctx.lineWidth = lw || 0.4; ctx.stroke();
}
function mLine(x1,y1,x2,y2,color,w,alpha,blur){
  ctx.save();
  if(alpha !== undefined) ctx.globalAlpha = alpha;
  if(blur){ ctx.shadowColor = color; ctx.shadowBlur = blur*MS; }
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
}
function mTxt(s,x,y,size,color,o){
  o = o || {};
  ctx.save();
  ctx.font = (o.w || 600) + ' ' + size + 'px ' + MFONT;
  ctx.fillStyle = color;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  if(o.sp !== undefined) ctx.letterSpacing = o.sp + 'px';
  if(o.glow){ ctx.shadowColor = o.glowColor || color; ctx.shadowBlur = o.glow*MS; }
  ctx.fillText(String(s), x, y);
  const wid = ctx.measureText(String(s)).width;
  ctx.restore();
  return wid;
}
function mMeasure(s,size,w,sp){
  ctx.save();
  ctx.font = (w||600)+' '+size+'px '+MFONT;
  if(sp!==undefined) ctx.letterSpacing = sp+'px';
  const wid = ctx.measureText(String(s)).width;
  ctx.restore();
  return wid;
}
function mGlass(x,y,w,h,r){
  mFill(x,y,w,h,r||3,'rgba(8,13,28,0.72)');

    case 'gameover': mGameOver(); break;

function mLevel(F,camX){
  const tx0 = Math.max(0, Math.floor(camX/8)-1);
  const tx1 = Math.min(F.TW-1, Math.floor((camX+W)/8)+1);
  for(let ty=0;ty<ROWS;ty++){
    let run = -1;
    for(let tx=tx0; tx<=tx1+1; tx++){
      const solid = tx<=tx1 && (F.grid[ty*F.TW+tx]===1 || F.grid[ty*F.TW+tx]===3);
      if(solid && run<0) run = tx;
      if(!solid && run>=0){ mTileRun(F,run,tx-1,ty,camX); run = -1; }
    }
  }
  mLine(0,16,320,16,'rgba(60,232,255,0.36)',0.5,0.6,8);
  mLine(0,127.7,320,127.7,'rgba(255,47,155,0.30)',0.5,0.6,8);
}
function mTileRun(F,x0,x1,ty,camX){
  const x = x0*8 - camX, w = (x1-x0+1)*8, y = ty*8;
  const v = F.grid[ty*F.TW+x0];
  ctx.fillStyle = v===3 ? 'rgba(33,21,68,0.95)' : 'rgba(17,27,52,0.95)';
  ctx.fillRect(x,y,w,8);
  const g = ctx.createLinearGradient(0,y,0,y+8);
  g.addColorStop(0,'rgba(255,255,255,0.045)'); g.addColorStop(0.4,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(x,y,w,8);
  const up = ty>0 ? F.grid[(ty-1)*F.TW+x0] : 1;
  const dn = ty<ROWS-1 ? F.grid[(ty+1)*F.TW+x0] : 1;
  if(up!==1 && up!==3){
    ctx.fillStyle = v===3 ? MC.violet : MC.cyan;
    ctx.globalAlpha = 0.6; ctx.fillRect(x,y,w,0.8); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(x,y+0.9,w,0.5);
  }
  if(dn!==1 && dn!==3){
    ctx.fillStyle = MC.mag;
    ctx.globalAlpha = 0.22; ctx.fillRect(x,y+7.2,w,0.8); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = 'rgba(160,210,255,0.07)';
  for(let sx=x+8; sx<x+w; sx+=8) ctx.fillRect(sx,y,0.35,8);
}

function mPlayer(camX){

      ctx.beginPath();

/* ==========================================================================
   DEBUG / TEST HARNESS
   ========================================================================== */
function runTests(){
  const res=[];
  const ok=(name,cond,info)=>res.push((cond?'PASS':'FAIL')+' : '+name+(info?('  ['+info+']'):''));

  G.demo = true;
  newGame(1);
  ok('floor generated', G.stage && G.stage.TW===120 && G.stage.screens===3, 'TW='+(G.stage&&G.stage.TW));
  ok('ground is solid', G.stage.grid[16*G.stage.TW+5]===1);
  ok('robot assembled', !!G.base && !!G.turret && G.turret.attached);

  const x0=G.base.x;
  G.keys.right=true;
  for(let i=0;i<60;i++) stepPlayer(1/60);
  G.keys.right=false;
  ok('tracked base moves', G.base.x > x0, x0.toFixed(1)+' -> '+G.base.x.toFixed(1));

  toggleDetach();
  ok('turret detaches', G.turret.attached===false);
  const en0=G.energy;
  for(let i=0;i<30;i++) stepPlayer(1/60);
  ok('detached tower drains power', G.energy < en0, en0.toFixed(1)+' -> '+G.energy.toFixed(1));

  G.turret.x = G.base.x+6; G.turret.y = G.base.y-10;
  toggleDetach();
  ok('turret docks again', G.turret.attached===true);

  // barrier: armoured front face vs weak back face
  newGame(3);
  let bar = G.stage.barriers[0];
  if(!bar){
    bar = {x:400,y:GND-32,w:8,h:32,hp:2,maxhp:2,tx:50,tw:1,dead:false,flash:0};
    G.stage.barriers.push(bar);
  }
  const hp0=bar.hp;
  G.bolts=[{x:bar.x-4,y:bar.y+10,vx:400,w:8,h:2,life:1,dead:false}];
  checkCollisions();
  ok('armoured face stops laser', bar.hp===hp0, 'hp='+bar.hp);
  G.bolts=[{x:bar.x+bar.w-4,y:bar.y+10,vx:-400,w:8,h:2,life:1,dead:false}];
  checkCollisions();
  ok('weak face takes damage', bar.hp===hp0-1, 'hp='+bar.hp);
  G.bolts=[];

  // laser heat
  G.mode='play'; G.invuln=0; G.heat=0; G.keys.fire=true; G.turret.alive=true; G.turret.attached=true;
  for(let i=0;i<90;i++) stepPlayer(1/60);
  G.keys.fire=false;
  ok('laser heat builds up', G.heat>10, 'heat='+G.heat.toFixed(0));

  // drone destroyed by laser
  newGame(1);
  const foe = G.stage.enemies.find(e=>e.type!=='zapper');
  if(foe){
    foe.x = G.turret.x+40; foe.y = G.turret.y; foe.baseX=foe.x; foe.baseY=foe.y;
    foe.invul=false; foe.hp=1; foe.dead=false;
    G.score=0; G.turret.facing=1;
    G.bolts=[{x:foe.x-3,y:foe.y+2,vx:0,w:8,h:2,life:1,dead:false}];
    checkCollisions();
    ok('drone destroyed by laser', foe.dead===true && G.score>0, 'score='+G.score);
  } else ok('drone destroyed by laser', false, 'no enemy spawned');

  // losing a life
  newGame(1); G.invuln=0;
  const lives0=G.lives;
  killTurret('test');
  ok('death costs a life', G.lives===lives0-1 && G.mode==='dead');

  // lift
  newGame(2);
  G.base.x = G.stage.WW-40;
  checkLift();
  ok('lift ends the floor', G.mode==='lift');

  // camera flip
  newGame(6);
  G.base.x = 380; updateCamera();
  ok('flip-screen camera', G.cam===1, 'cam='+G.cam);

  // every floor must leave a driveable ground corridor
  let traversable = true; const badFloors = [];
  for(let fn=1; fn<=TOTAL_FLOORS; fn++){
    const F = genFloor(fn);
    let bad = 0;
    for(let ty=13; ty<=15; ty++) for(let tx=2; tx<F.TW-1; tx++){
      const v = F.grid[ty*F.TW+tx];
      if(v===1 || v===3) bad++;
    }
    F.barriers.forEach(b=>{ if(!b || b.w<8) bad++; });
    if(bad){ traversable=false; badFloors.push(fn+':'+bad); }
  }
  ok('all 11 floors have a clear ground route', traversable, badFloors.join(',') || '11/11');
  ok('surface has a ship to reach', !!(genFloor(TOTAL_FLOORS).shipX));

  // localisation
  setLang('ru');
  ok('russian ui loaded', T('hud_level')==='УРОВЕНЬ' && T('win_title')==='МИССИЯ ВЫПОЛНЕНА', T('hud_level'));
  setLang('en');
  ok('english toggle works', T('hud_level')==='LEVEL');
  setLang('ru');
  ok('cyrillic font glyphs', !!(FONT['Ж'] && FONT['Я'] && FONT['Ё'] && FONT['Ъ'] && FONT['Ю']));

  // graphics modes and renderers
  const gfx0 = GFX;
  setGfx('modern');
  ok('modern graphics mode', GFX === 'modern');
  newGame(3);
  let renderOk = true, renderErr = '';
  const testModes = ['title','briefing','play','paused','gameover','win'];
  for(const m of testModes){
    G.mode = m;
    try{ render(); }catch(e){ renderOk = false; renderErr = String((e&&e.message)||e); break; }
  }
  ok('modern renderer draws all screens', renderOk, renderErr);
  setGfx('retro');
  renderOk = true; renderErr = '';
  for(const m of testModes){
    G.mode = m;
    try{ render(); }catch(e){ renderOk = false; renderErr = String((e&&e.message)||e); break; }
  }
  ok('retro renderer draws all screens', renderOk, renderErr);
  setGfx(gfx0);
  ok('chiptune engine tracks built', !!TRACKS.title && !!TRACKS.game && TRACKS.game.length === 64 && TRACKS.title.channels.length >= 4,
     'title=' + (TRACKS.title ? TRACKS.title.length : 0) + ' game=' + (TRACKS.game ? TRACKS.game.length : 0));

  newGame(1);
  G.mode='title';

  const fails = res.filter(r=>r.indexOf('FAIL')===0);
  const el = document.getElementById('testout');
  if(el){
    el.style.display='block';
    el.textContent = res.join('\n') + '\n\nRESULT: ' + (res.length-fails.length) + '/' + res.length + (fails.length?' FAIL':' PASS');
  }
  document.title = 'LM TESTS ' + (res.length-fails.length) + '/' + res.length + (fails.length?' FAIL':' PASS') + ' vp='+innerWidth+'x'+innerHeight;
  window.__LM_RESULTS__ = res;
}

function setupFromHash(){
  const p = new URLSearchParams(location.hash.replace(/^#/,''));
  if(p.has('lang')) setLang(p.get('lang'));
  if(p.has('gfx')) setGfx(p.get('gfx'));
  if(p.has('test')){ runTests(); return; }
  const shot = p.get('shot');
  G.demo = !!shot;
  if(shot==='play'){
    const fl = clamp(parseInt(p.get('floor')||'1',10)||1,1,TOTAL_FLOORS);
    newGame(fl);
    G.invuln=0;
    if(p.has('screen')){
      const sc = clamp(parseInt(p.get('screen')||'0',10)||0,0,G.stage.screens-1);
      G.base.x = sc*SCRW + 40;
      G.turret.x = G.base.x + 6;
      G.cam = sc;
      updateCamera();
    }
    if(p.has('detach')){ toggleDetach(); G.turret.x += 110; G.turret.y -= 50; updateCamera(); }
  } else if(shot==='briefing'){
    G.mode='briefing';
  } else if(shot==='gameover'){
    newGame(4); G.score=12345; G.floor=5; G.stats.kills=17; G.invuln=0;
    gameOver(T('r_drone'));
  } else if(shot==='win'){
    newGame(TOTAL_FLOORS); G.score=54321; G.stats.kills=42; winGame();
  } else if(shot==='lift'){
    newGame(4); G.base.x=G.stage.WW-40; updateCamera(); startLift();
  } else {
    G.mode='title';
  }
}

function initStars(){
  G.stars=[];
  for(let i=0;i<80;i++){
    G.stars.push({x:Math.random()*W, y:Math.random()*H, v:3+Math.random()*13, ph:Math.random()*6.28});
  }
}

function init(){
  initSprites();
  initStars();
  G.record = loadRecord();
  setLang(loadLang());
  addEventListener('keydown', onKeyDown);
  addEventListener('keyup', onKeyUp);
  addEventListener('blur', ()=>{ for(const k in G.keys) G.keys[k]=false; });
  cv.addEventListener('pointerdown', ()=>{ A.init(); if(G.mode==='title') startGame(); });
  setupFromHash();
  window.__LM = {
    G:G, T:T, setLang:setLang, newGame:newGame, genFloor:genFloor, startGame:startGame,
    setGfx:setGfx, gfx:()=>GFX, Music:Music, TRACKS:TRACKS, tick:(dt)=>update(dt||1/60),
    audio:()=>({ state: A.ctx ? A.ctx.state : null, muted:A.muted, music:Music.name,
                  notes:Music.notes, gain:Music.gain ? Music.gain.gain.value : null })
  };
  requestAnimationFrame(loop);
}

init();
})();
</script>

<script>
(function () {
  var link = document.getElementById('catalog-back');
  if (!link) return;

  /* На file:// каталог лежит в index.html корня: «../» открыл бы листинг. */
  if (location.protocol === 'file:') link.setAttribute('href', '../index.html');

  /* Не даём клику/Enter всплывать в игровые обработчики (старт, пауза и т.п.). */
  ['pointerdown', 'click', 'keydown'].forEach(function (type) {
    link.addEventListener(type, function (event) { event.stopPropagation(); }, true);
  });

  /* --- адаптивное размещение, чтобы не перекрывать меню и кнопки игр --- */
  var INTERACTIVE = 'a,button,input,select,textarea,[role="button"],[tabindex],[onclick]';
  link.style.setProperty('transform', 'none', 'important');

  function interactiveBoxes() {
    var boxes = [];
    var nodes = document.querySelectorAll(INTERACTIVE);
    for (var i = 0; i < nodes.length; i += 1) {
      var el = nodes[i];
      if (el === link || el.contains(link)) continue;
      var r = el.getBoundingClientRect();
      if (r.width < 4 || r.height < 4) continue;
      var cs = window.getComputedStyle(el);
      if (cs.visibility === 'hidden' || cs.display === 'none' || Number(cs.opacity) < 0.05) continue;
      if (cs.pointerEvents === 'none') continue;
      boxes.push({ left: r.left, top: r.top, right: r.right, bottom: r.bottom });
    }
    return boxes;
  }

  function overlap(a, b) {
    return a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
  }

  function place() {
    var w = link.offsetWidth;
    var h = link.offsetHeight;
    if (!w || !h) return;
    var W = window.innerWidth;
    var H = window.innerHeight;
    var m = 10;
    var candidates = [
      { name: 'left-mid', left: 0, top: Math.round((H - h) / 2), shape: 'tab' },
      { name: 'bottom-left', left: m, top: H - h - m, shape: 'round' },
      { name: 'top-left', left: m, top: m, shape: 'round' },
      { name: 'bottom-right', left: W - w - m, top: H - h - m, shape: 'round' },
      { name: 'top-right', left: W - w - m, top: m, shape: 'round' },
      { name: 'bottom-center', left: Math.round((W - w) / 2), top: H - h - m, shape: 'round' },
      { name: 'top-center', left: Math.round((W - w) / 2), top: m, shape: 'round' }
    ];
    var boxes = interactiveBoxes();
    var chosen = candidates[0];
    for (var i = 0; i < candidates.length; i += 1) {
      var c = candidates[i];
      var box = { left: c.left, top: c.top, right: c.left + w, bottom: c.top + h };
      var hit = false;
      for (var j = 0; j < boxes.length; j += 1) {
        if (overlap(box, boxes[j])) { hit = true; break; }
      }
      if (!hit) { chosen = c; break; }
    }
    link.style.setProperty('left', chosen.left + 'px', 'important');
    link.style.setProperty('top', chosen.top + 'px', 'important');
    link.classList.toggle('catalog-back-round', chosen.shape === 'round');
    link.dataset.place = chosen.name;
  }

  var timer = 0;
  function schedule() {
    window.clearTimeout(timer);
    timer = window.setTimeout(place, 120);
  }

  place();
  window.setTimeout(place, 350);
  window.setTimeout(place, 1200);
  window.addEventListener('resize', schedule, { passive: true });
  window.addEventListener('orientationchange', schedule, { passive: true });
  document.addEventListener('fullscreenchange', schedule);
})();
</script>

<meta name="description" content="СОСЕДИ — оригинальная игра студии «Гефест»: весёлый экшен с видом сверху на 1–2 игроков. Из мастерской «Гефест» сбежал Заводной Цирк — жестяные клоуны, пружинные гуси, медведи-барабанщики и марионетки гоняются за соседями. Ася и Тимоша спасают бабушку с котом, почтальона, близнецов на батуте и всех остальных водяным пистолетом, шариками с краской, пирожками-приманками, мыльными пузырями и фейерверком. 20 уровней в 5 районах, боссы, ключи и тайные комнаты, бонус-уровни. Темы retro/modern, RU/EN, офлайн.">

<div class="pad">

    <button data-pause="1" type="button" class="pause" aria-label="Пауза">II</button>

  </div>

<div class="foot" id="foot"><b>СОСЕДИ</b> · И1: стрелки — ход, Пробел или / — бросок по взгляду (держать — очередь), «,» или «.» — сменить оружие · И2: W A S D — ход, F — бросок, G или Q — сменить · 1/2 на заставке — игроки · P / Esc — пауза · L язык, T тема, M звук. Тач — 1 игрок.</div>

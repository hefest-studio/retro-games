<meta name="description" content="ЧАЙНИК — оригинальная игра студии «Гефест»: юмористический экшен-платформер в духе 16-бит. Заводной латунный чайник из мастерской «Гефест» ожил и отправился вернуть украденную Крышку: струя пара с перегревом, мощный выстрел кипятком, ручка-хват для раскачки на вилках-лианах, смешные сценки и смерти, 6 уровней-гэгов — кухонные джунгли, гонка по скатерти, погружение в чашку чая, головоломка со спящим сахарком, полёт на чайном пакетике и битва с Сервизом. Темы retro/modern, RU/EN, офлайн.">

</head><body data-theme="modern">
<a class="back" id="backLink" href="../" data-catalog-back="1">&larr; Каталог</a>
<button id="bPause" type="button" aria-label="Пауза">II</button>
<div class="wrap"><canvas id="c" width="640" height="360" aria-label="ЧАЙНИК"></canvas></div>
<div class="pad">
  <div class="dpad">
    <button data-d="U" class="u" aria-label="Вверх / хват">▲</button>
    <button data-d="L" class="l" aria-label="Влево">◀</button>
    <button data-d="R" class="r" aria-label="Вправо">▶</button>
    <button data-d="D" class="d" aria-label="Вниз">▼</button>
  </div>
  <div class="acts">
    <button id="bReset" type="button" class="reset" aria-label="Заново головоломку">↺</button>
    <button id="bBoil" type="button" class="boil" aria-label="Кипяток">✹</button>
    <button id="bFire" type="button" class="fire" aria-label="Пар">≋</button>
    <button data-d="A" class="jump" aria-label="Прыжок">●</button>
  </div>
</div>
<div class="foot" id="foot"><b>ЧАЙНИК</b> · ← → / A D — ход · Пробел / Z — прыжок · X / J / F — пар (держать; с ↑ / ↓ — вверх / вниз, перегрев!) · C / K — кипяток (по заряду) · ↑ рядом с крюком — хват, Пробел — отпустить · R — заново головоломку · P / Esc — пауза · L язык, T тема, M звук.</div>

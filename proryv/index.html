<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>ПРОРЫВ · HTML5</title>
<meta name="description" content="ПРОРЫВ — оригинальный боевик студии «Гефест» на фреймворке Гефест Arcade: пять секторов по пять экранов, бластер, гранаты, экзоскелет. Темы retro (ZX) / modern (неон), RU/EN, офлайн." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23EA6A12'/%3E%3Cg transform='translate(9,9) scale(0.72)' fill='%2316181D'%3E%3Crect x='12' y='13' width='9' height='38' rx='4.5'/%3E%3Crect x='43' y='13' width='9' height='38' rx='4.5'/%3E%3Cpath d='M34 23 L24 35 H31 L28 45 L41 31 H34 Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<style>
/* Движок v2 поверх игры (js/host.js): рамка #hostbox повторяет прямоугольник кадра игры
   (EX_MAIN.stage(), игра сама центрирует/масштабирует кадр), canvas движка — внутри неё. */
#hostbox{position:fixed;left:0;top:0;width:256px;height:208px;z-index:5;pointer-events:none}
#hostbox canvas.arcade-host{position:absolute;inset:0;width:100%;height:100%;display:block}
a.back{position:fixed;left:10px;top:8px;z-index:12;color:#7c74a8;font:12px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-decoration:none}
a.back:hover{color:#f2f0ff}
html[data-arcade-scene="play"] a.back{display:none}
/* тач-пульт — только на сенсорных экранах; кнопки шлют настоящие клавиши (их читает игра) */
.pad{position:fixed;left:0;right:0;bottom:10px;z-index:10;display:none;justify-content:space-between;padding:0 10px;pointer-events:none}
.pad .grp{display:grid;gap:6px;pointer-events:auto}
.pad .dir{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px)}
.pad .act{grid-template-columns:repeat(2,60px);grid-template-rows:repeat(2,46px)}
.pad button{border:1px solid #2c2550;border-radius:12px;background:rgba(14,10,32,.66);color:#f2f0ff;font:800 18px system-ui,sans-serif;touch-action:none}
.pad button.on{background:rgba(57,246,255,.28)}
@media (pointer:coarse){.pad{display:flex}}
</style>
</head>
<body>
<a class="back" href="../">← Каталог</a>
<canvas id="stage" width="1280" height="800" aria-label="ПРОРЫВ — аркада"></canvas>
<div id="hostbox"></div>
<div class="pad" aria-label="Сенсорное управление">
  <div class="grp dir">
    <span></span><button data-code="ArrowUp" aria-label="Прыжок">▲</button><span></span>
    <button data-code="ArrowLeft" aria-label="Влево">◀</button><button data-code="ArrowDown" aria-label="Присесть / телепорт">▼</button><button data-code="ArrowRight" aria-label="Вправо">▶</button>
  </div>
  <div class="grp act">
    <button data-code="KeyP" aria-label="Пауза">Ⅱ</button><button data-code="Enter" aria-label="Ввод">⏎</button>
    <button data-code="Space" data-key=" " aria-label="Огонь (удержание — граната)" style="grid-column:span 2">●</button>
  </div>
</div>
<pre id="err"></pre>
<pre id="testout"></pre>
<noscript><p class="noscript">Для игры нужен JavaScript.</p></noscript>
<script src="./engine.js"></script>
<script src="./js/host.js"></script>
<script src="js/game.js"></script>
<script>
'use strict';
/* ПРОРЫВ на движке v2 — «оболочка» (js/host.js): родной js/game.js (логика, 25 экранов, баланс,
   рендеры ZX = retro и NEON = modern, своя чиптюн-музыка, брифинги, бонус сектора) работает без
   изменений; движок даёт меню/паузу/финалы/тему/язык/звук/рекорд. Связь — через публичные
   window.EX (состояние и функции игры), window.EX_MAIN (кадр/resize) и window.EX_AUDIO. */
(function () {
  var EX = window.EX, M = window.EX_MAIN, S = EX.state, H = EX.HASH || {};
  // игра стартует на DOMContentLoaded (boot() в main.js: графика RETRO по умолчанию, #gfx/#shot) —
  // оболочку поднимаем после неё, чтобы тема движка (modern по умолчанию) не была перебита
  if (M.booted()) init(); else document.addEventListener('DOMContentLoaded', init);
  function init() {
  // рамка движка = прямоугольник кадра игры (игра пересчитывает его на resize и смене графики)
  var box = document.getElementById('hostbox'), last = '';
  function place() {
    var r = M.stage(), k = r.x + ',' + r.y + ',' + r.w + ',' + r.h;
    if (k !== last) { last = k; box.style.left = r.x + 'px'; box.style.top = r.y + 'px'; box.style.width = r.w + 'px'; box.style.height = r.h + 'px'; }
    requestAnimationFrame(place);
  }
  place();
  var STR = {
    ru: { play: 'Играть', language: 'Язык', theme: 'Тема', sound: 'Звук', on: 'вкл', off: 'выкл', score: 'Счёт', level: 'Сектор', best: 'Рекорд',
          win: 'ПРОРЫВ СОВЕРШЁН!', gameover: 'ИГРА ОКОНЧЕНА', pause: 'ПАУЗА', resume: 'Продолжить', menu: 'В меню', tapstart: 'пробел / тап',
          title: 'ПРОРЫВ', subtitle: 'Пять секторов · бластер, гранаты, экзоскелет', help: 'Как играть' },
    en: { play: 'Play', language: 'Language', theme: 'Theme', sound: 'Sound', on: 'on', off: 'off', score: 'Score', level: 'Sector', best: 'Best',
          win: 'BREAKTHROUGH!', gameover: 'GAME OVER', pause: 'PAUSE', resume: 'Resume', menu: 'Menu', tapstart: 'space / tap',
          title: 'PRORYV', subtitle: 'Five sectors · blaster, grenades, exoskeleton', help: 'How to play' }
  };
  // режимы игры → режимы оболочки: «Как играть» / «Об игре» / настройки — доп. экраны (Esc → меню);
  // брифинг, гибель, «сектор очищен» и бонус — часть забега (родные экраны игры)
  var MODE = { boot: 'title', title: 'title', help: 'sub', about: 'sub', settings: 'sub',
               briefing: 'play', play: 'play', dead: 'play', levelclear: 'play', bonus: 'play',
               paused: 'paused', gameover: 'gameover', win: 'win' };
  var adapter = {
    mode: function () { return MODE[S.mode] || 'play'; },
    start: function () { EX.newGame(); },                       // новый забег → брифинг сектора 1 (Enter — в бой)
    toTitle: function () { EX.setMode('title'); },
    pause: function () { if (S.mode === 'play') EX.setMode('paused'); },
    resume: function () {                                         // как «Продолжить» в родной паузе игры
      if (S.mode !== 'paused') return;
      EX.setMode('play');
      var A = window.EX_AUDIO;
      if (A && A.playMusic) A.playMusic(S.level >= 4 ? 'final' : (S.player && S.player.exo ? 'exo' : 'game'));
    },
    openSub: function () { S.helpReturn = 'title'; EX.setMode('help'); },
    score: function () { return S.score; },
    best: function () { return EX.loadRecord(); },
    gfx: function () { return EX.settings.gfx; },
    setGfx: function (v) { EX.setGfx(v); M.resize(); },
    lang: function () { return EX.settings.lang; },
    setLang: function (v) { EX.setLang(v); },
    setSound: function (on) {                                     // звук движка = музыка + эффекты игры
      if (!!EX.settings.music !== on) EX.toggleMusic();
      if (!!EX.settings.sfx !== on) EX.toggleSfx();
    }
  };
  var g = ArcadeHost.mount({ gameId: 'proryv', mount: '#hostbox', width: 512, height: 416, strings: STR, extra: 'help', adapter: adapter });
  // Пауза движка — на непрозрачном фоне: родная пауза игры рисуется на её же canvas (меню
  // «Продолжить / Заново / …»), и под полупрозрачным оверлеем движка было бы два меню паузы.
  if (g) {
    var pd = g.scenes.pause.draw;
    g.scenes.pause.draw = function (ctx) {
      var pl = this.scenes.play.draw;
      this.scenes.play.draw = function () { this.clear(); };
      try { pd.call(this, ctx); } finally { this.scenes.play.draw = pl; }
    };
  }
  // звук движка — главный: выровнять музыку/эффекты игры сразу (кроме отладочных #nosound / #music=off)
  if (g && g.audio.enabled && !H.nosound && H.music !== 'off') adapter.setSound(true);
  ArcadeHost.bindKeyPad('.pad');
  }
})();
</script>
</body>
</html>

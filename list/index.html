<meta name="description" content="ЛИСТ — оригинальная игра студии «Гефест»: beat 'em up, где драка идёт по панелям страниц недопечатанной книги-лубка. Печатник-гравёр Литер переходит из кадра в кадр, бьёт комбо, ставит блок, хватает кляксы и бросает их в рамку панели — бумага рвётся. Здоровье — чернила: промахи и удары по стенам их тратят. Инвентарь из 3 ячеек (ножницы-бумеранг, склянка чернил, закладка-щит, карандаш), головоломки панелей, развилки и две концовки каждой из 3 глав. Темы retro/modern, RU/EN, офлайн.">

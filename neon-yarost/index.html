<!DOCTYPE html>
<html lang="ru" data-gfx="modern">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="color-scheme" content="dark" />
<title>НЕОН × ЯРОСТЬ · Neon Yarost — HTML5</title>
<meta name="description" content="НЕОН × ЯРОСТЬ — оригинальный beat 'em up студии «Гефест» на фреймворке Гефест Arcade: два героя, три квартала, пять волн и босс на крыше. Темы retro (8-бит) / modern (неон), RU/EN, офлайн." />
<meta name="theme-color" content="#07060f" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23EA6A12'/%3E%3Cg transform='translate(9,9) scale(0.72)' fill='%2316181D'%3E%3Crect x='12' y='13' width='9' height='38' rx='4.5'/%3E%3Crect x='43' y='13' width='9' height='38' rx='4.5'/%3E%3Cpath d='M34 23 L24 35 H31 L28 45 L41 31 H34 Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css" />
<style>
/* Движок v2 поверх игры: прозрачный canvas движка (меню/пауза/финалы) лежит ровно над кадром
   игры (#arcade-mount = прямоугольник сцены из NR_SHELL.stage()), над #stage и под тач-кнопками. */
#arcade-mount { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 3; pointer-events: none; }
canvas.arcade-host { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
a.back { position: fixed; left: 10px; top: 8px; z-index: 40; color: #8a86a8; font: 600 12px/1.2 ui-monospace, Menlo, Consolas, monospace; text-decoration: none; }
a.back:hover, a.back:focus-visible { color: #ffffff; }
html[data-arcade-scene="play"] a.back { display: none; } /* в бою не перекрывает HUD */
</style>
</head>
<body>
<a class="back" href="../">← Каталог</a>
<canvas id="stage" width="1280" height="720" aria-label="НЕОН × ЯРОСТЬ: NEON YAROST — игра"></canvas>
<div id="arcade-mount"></div>

<div id="touch" aria-hidden="true">
  <div class="dpad">
    <button class="tbtn dpad-up" data-hold="up" type="button" aria-label="Вверх">▲</button>
    <button class="tbtn dpad-left" data-hold="left" type="button" aria-label="Влево">◀</button>
    <button class="tbtn dpad-right" data-hold="right" type="button" aria-label="Вправо">▶</button>
    <button class="tbtn dpad-down" data-hold="down" type="button" aria-label="Вниз">▼</button>
  </div>
  <div class="tacts">
    <button class="tbtn act-special" data-press="special" type="button" aria-label="Ярость">★<span>V</span></button>
    <button class="tbtn act-punch" data-press="punch" type="button" aria-label="Удар">J</button>
    <button class="tbtn act-kick" data-press="kick" type="button" aria-label="Пинок">K</button>
    <button class="tbtn act-jump" data-press="jump" type="button" aria-label="Прыжок">SPACE</button>
  </div>
</div>

<button id="tpause" type="button" aria-label="Пауза">II</button>

<div id="hint" role="status" aria-live="polite"></div>
<pre id="err"></pre>
<pre id="testout"></pre>
<noscript><p class="noscript">Для игры нужен JavaScript.</p></noscript>

<script>
/* Миграция сохранений после смены адреса игры (13.11.2026): старый slug хранится в base64,
   чтобы имя не попадало в текст репо. Переносим рекорд, настройки и выбор игроков, старое удаляем. */
(function () {
  try {
    var o = atob('bmVvbi1yYWdl'), n = 'neon-yarost';
    [['arcade.best.' + o, 'arcade.best.' + n], [o + '.settings', n + '.settings'], ['arcade.players.' + o, 'arcade.players.' + n]].forEach(function (p) {
      var v = localStorage.getItem(p[0]);
      if (v !== null) { if (localStorage.getItem(p[1]) === null) localStorage.setItem(p[1], v); localStorage.removeItem(p[0]); }
    });
  } catch (e) {}
})();
</script>
<script src="./engine.js"></script>
<script src="./js/host.js"></script>
<script src="./js/game.js"></script>
<script>
'use strict';
/* НЕОН × ЯРОСТЬ на движке v2 — «хост поверх игры» (js/host.js). Родной js/game.js (собран
   tools/build.mjs из src/: логика, волны, баланс, рендеры 8-БИТ = retro и НЕОН = modern, своя
   музыка, сюжет, выбор героя) работает своим циклом; движок даёт меню/паузу/финалы/тему/язык/
   звук/рекорд arcade.best.neon-yarost. Связь — только через публичный window.NR. */
(function () {
  var NR = window.NR, SHELL = window.NR_SHELL;
  if (!NR || !SHELL || !window.ArcadeHost) return;
  function S() { return NR.state; }

  // Пауза движка = заморозка боя (NR.debug.freeze) + приглушение музыки: родное меню паузы игры
  // не рисуется под экраном паузы движка. Родные экраны игры (выбор героя, сюжет, справка,
  // настройки) — режим 'sub': движок прозрачен, ввод идёт игре (Esc — «пропустить»/«назад»).
  var frozen = false;
  var SUB = { select: 1, intro: 1, help: 1, settings: 1, about: 1, paused: 1 };
  function duck(on) { try { if (window.NR_AUDIO && window.NR_AUDIO.duck) window.NR_AUDIO.duck(on); } catch (e) { /* тихо */ } }
  function unfreeze() { if (frozen) { frozen = false; NR.debug.freeze(false); duck(false); } }
  var press0 = NR.press;
  function titleItem(i) {                         // пункт родного титула игры: 0 играть, 1 справка, 2 настройки
    unfreeze();
    if (S().mode !== 'title') NR.debug.scene('title');
    S().menuIndex = i;
    press0.call(NR, 'confirm');
  }

  var A = {
    mode: function () {
      var m = S().mode;
      if (m === 'title') return 'title';
      if (SUB[m]) return 'sub';
      if (m === 'gameover') return 'gameover';
      if (m === 'victory') return 'win';
      return m === 'play' && frozen ? 'paused' : 'play';   // play / dead
    },
    start: function () { titleItem(0); },                  // → выбор героя и сложности → сюжет → бой
    toTitle: function () { unfreeze(); NR.debug.scene('title'); },
    pause: function () { if (S().mode !== 'play' || frozen) return; frozen = true; NR.debug.freeze(true); duck(true); },
    resume: function () { unfreeze(); },
    openSub: function (key) { titleItem(key === 'help' ? 1 : 2); },
    score: function () { return S().run ? S().run.score : 0; },
    best: function () { return NR.settings.best; },
    gfx: function () { return NR.settings.gfx === 'retro' ? 'retro' : 'modern'; },
    setGfx: function (v) { if (NR.settings.gfx !== v) NR.toggleGfx(); },
    lang: function () { return NR.settings.lang === 'en' ? 'en' : 'ru'; },
    setLang: function (v) { if (NR.settings.lang !== v) NR.toggleLang(); },
    setSound: function (on) {                              // звук движка = музыка + эффекты игры
      if (!!NR.settings.music !== on) NR.toggleMusic();
      if (!!NR.settings.sfx !== on) NR.toggleSfx();
    }
  };

  var STR = {
    ru: { play: 'Играть', language: 'Язык', theme: 'Тема', sound: 'Звук', on: 'вкл', off: 'выкл', score: 'Счёт', level: 'Ур.', best: 'Рекорд',
          win: 'ГОРОД СВОБОДЕН!', gameover: 'НОКАУТ', pause: 'ПАУЗА', resume: 'Продолжить', menu: 'В меню', tapstart: 'пробел / тап',
          title: 'НЕОН × ЯРОСТЬ', subtitle: 'Neon Yarost · beat \'em up · 3 квартала, 5 волн', help: 'Управление', settings: 'Настройки' },
    en: { play: 'Play', language: 'Language', theme: 'Theme', sound: 'Sound', on: 'on', off: 'off', score: 'Score', level: 'Lvl', best: 'Best',
          win: 'THE CITY IS FREE!', gameover: 'KNOCKOUT', pause: 'PAUSE', resume: 'Resume', menu: 'Menu', tapstart: 'space / tap',
          title: 'НЕОН × ЯРОСТЬ', subtitle: 'Neon Yarost · beat \'em up · 3 blocks, 5 waves', help: 'Controls', settings: 'Settings' }
  };

  var g = ArcadeHost.mount({
    gameId: 'neon-yarost', mount: '#arcade-mount', width: 704, height: 396, scale: 2, strings: STR,
    extra: ['help', 'settings'], subKeys: { Escape: 1, KeyP: 1 }, bootAdopt: true, adapter: A // bootAdopt: #demo=/#scene=/#wave= — сразу в бой
  });
  if (!g) return;

  // Рекорд: старый (best из прежнего ключа настроек) уже перенесён host'ом; обратно — чтобы HUD игры видел тот же
  var eb = Arcade.Store.getNum('arcade.best.neon-yarost', 0);
  if (eb > NR.settings.best) { NR.settings.best = eb; if (S().run) S().run.best = eb; }

  // Пауза из самой игры (тач-кнопка II, скрытие вкладки) — через движок
  NR.press = function (a) {
    if ((a === 'pause' || a === 'back') && S().mode === 'play') { if (frozen) A.resume(); else A.pause(); return; }
    return press0.apply(NR, arguments);
  };

  // Canvas движка — точно над кадром игры (кадр меняется при resize и смене графики)
  var mountEl = document.getElementById('arcade-mount'), lastBox = '';
  (function place() {
    var s = SHELL.stage(), box = s.x + ',' + s.y + ',' + s.w + ',' + s.h;
    if (box !== lastBox) {
      lastBox = box;
      mountEl.style.left = s.x + 'px'; mountEl.style.top = s.y + 'px';
      mountEl.style.width = s.w + 'px'; mountEl.style.height = s.h + 'px';
    }
    window.requestAnimationFrame(place);
  })();
})();
</script>
</body>
</html>

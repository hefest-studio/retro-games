<!DOCTYPE html>
<html lang="ru" data-gfx="retro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="color-scheme" content="dark" />
<title>DOUBLE DRAGON × BATTLE TOADS: NEON RAGE</title>
<meta name="description" content="Фанатский браузерный beat'em-up: Double Dragon × Battletoads, неоновый ремастер. 8-битная и современная графика, оригинальная чиптюн-музыка, русский и английский языки. Один HTML-файл." />
<meta name="theme-color" content="#07060f" />
<style>
<!--__STYLE__-->
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720" aria-label="DOUBLE DRAGON × BATTLE TOADS: NEON RAGE — игра"></canvas>

<div id="touch" aria-hidden="true">
  <div class="dpad">
    <button class="tbtn dpad-up" data-hold="up" type="button" aria-label="Вверх">▲</button>
    <button class="tbtn dpad-left" data-hold="left" type="button" aria-label="Влево">◀</button>
    <button class="tbtn dpad-right" data-hold="right" type="button" aria-label="Вправо">▶</button>
    <button class="tbtn dpad-down" data-hold="down" type="button" aria-label="Вниз">▼</button>
  </div>
  <div class="tacts">
    <button class="tbtn act-special" data-press="special" type="button" aria-label="Ярость">★<span>L</span></button>
    <button class="tbtn act-punch" data-press="punch" type="button" aria-label="Удар">J</button>
    <button class="tbtn act-kick" data-press="kick" type="button" aria-label="Пинок">K</button>
    <button class="tbtn act-jump" data-press="jump" type="button" aria-label="Прыжок">SPACE</button>
  </div>
</div>

<button id="tpause" type="button" aria-label="Пауза">II</button>

<div id="hint" role="status" aria-live="polite"></div>
<pre id="err"></pre>
<pre id="testout"></pre>
<noscript><p class="noscript">Для игры нужен JavaScript.</p></noscript>
<script>
<!--__SCRIPT__-->
</script>
</body>
</html>

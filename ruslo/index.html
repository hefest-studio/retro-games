<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>РУСЛО · Над рекой — HTML5</title>
<meta name="description" content="РУСЛО — оригинальная аркада-скролл-шутер студии «Гефест» на фреймворке Гефест Arcade: река, мосты, заправки, топливо. Темы retro/modern, RU/EN, офлайн.">
<meta name="theme-color" content="#04070c">
<link rel="canonical" href="https://arcade.hefest.ru/ruslo/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23EA6A12'/%3E%3Cg transform='translate(9,9) scale(0.72)' fill='%2316181D'%3E%3Crect x='12' y='13' width='9' height='38' rx='4.5'/%3E%3Crect x='43' y='13' width='9' height='38' rx='4.5'/%3E%3Cpath d='M34 23 L24 35 H31 L28 45 L41 31 H34 Z'/%3E%3C/g%3E%3C/svg%3E">
<meta property="og:type" content="website"><meta property="og:site_name" content="Гефест · Зал ретро-игр">
<meta property="og:title" content="РУСЛО · Над рекой"><meta property="og:url" content="https://arcade.hefest.ru/ruslo/">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#04070c;color:#eaf6ff;font-family:Inter,system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;min-height:100dvh;user-select:none;overflow:hidden}
.wrap{position:relative;width:min(96vw,420px);margin-top:10px;display:flex;justify-content:center}
canvas{display:block;border:1px solid #1d2c42;border-radius:10px;background:#05070d;touch-action:none}
.pad{width:min(96vw,420px);margin:10px 0;display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;grid-template-rows:repeat(2,48px);gap:8px}
.pad button{background:#0d1622;border:1px solid #1d2c42;border-radius:12px;color:#eaf6ff;font-size:20px;font-weight:800}
.pad button:active{background:#18263a}
.pad .l{grid-column:1;grid-row:1/3}.pad .r{grid-column:2;grid-row:1/3}.pad .u{grid-column:3;grid-row:1}.pad .d{grid-column:3;grid-row:2}
.pad .p{grid-column:4;grid-row:1/3;font-size:16px;color:#7f9cc4}.pad .f{grid-column:5;grid-row:1/3;font-size:26px;color:#ff4f9a}
.foot{color:#4f6378;font-size:11px;margin:2px 12px 16px;text-align:center;max-width:460px}
a.back{position:fixed;left:10px;top:8px;color:#4f6378;font-size:12px;text-decoration:none}
@media(min-width:760px){.pad{display:none}}
</style></head><body>
<a class="back" href="../">← Каталог</a>
<div class="wrap"><canvas id="c" width="360" height="540" aria-label="РУСЛО"></canvas></div>
<div class="pad">
  <button class="l" data-d="L">◀</button><button class="r" data-d="R">▶</button>
  <button class="u" data-d="U">▲</button><button class="d" data-d="D">▼</button>
  <button class="p" id="bPause" aria-label="Пауза">❚❚</button>
  <button class="f" data-d="A" aria-label="Огонь">●</button>
</div>
<div class="foot" id="foot"></div>
<script src="./engine.js"></script>
<script src="./js/music.js"></script>
<script src="./js/core.js"></script>
<script src="./js/lang.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/render.js"></script>
<script src="./js/game.js"></script>
<script>
'use strict';
/* Оболочка v2: меню/пауза/темы/язык/счёт/рекорд/музыка — движок Arcade; полёт, река, враги, топливо —
   родной js/game.js (без своего canvas#game он не запускает свой цикл и DOM-меню, управляется через RUSLO.test),
   отрисовка — родной js/render.js (retro = 8-бит, modern = неон). */
// Перенос старого рекорда (ruslo.hi; ключи прежнего имени переносит RUSLO.store.migrate в core.js)
// в общий ключ движка — один раз.
(function(){ try{ var S=Arcade.Store, k='arcade.best.ruslo';
  if(S.get('arcade.migrated.ruslo',null)) return;
  var old=parseInt(JSON.parse(S.get('ruslo.hi','0')),10)||0;
  if(old>S.getNum(k,0)) S.set(k,String(old)); S.set('arcade.migrated.ruslo','1');
}catch(e){} })();
// Родной чиптюн РУСЛА — только SFX; музыку ведёт движок (js/music.js).
(function(){ var C=window.Chiptune; if(!C) return; var noop=function(){};
  window.Chiptune=Object.assign({},C,{startMusic:noop,stopMusic:noop,setPaused:noop}); })();
var STR={
 ru:{play:'Играть',language:'Язык',theme:'Тема',sound:'Звук',on:'вкл',off:'выкл',score:'Счёт',level:'Ур.',best:'Рекорд',win:'ПОБЕДА!',gameover:'КОНЕЦ ПОЛЁТА',pause:'ПАУЗА',resume:'Продолжить',menu:'В меню',tapstart:'пробел / тап',title:'РУСЛО',subtitle:'Над рекой · мосты, заправки, топливо',
   foot:'<b>РУСЛО</b> · ←→ манёвр, ↑↓ скорость, пробел/● — огонь, P/Esc — пауза · L язык, T тема, M звук.'},
 en:{play:'Play',language:'Language',theme:'Theme',sound:'Sound',on:'on',off:'off',score:'Score',level:'Lvl',best:'Best',win:'VICTORY!',gameover:'FLIGHT OVER',pause:'PAUSE',resume:'Resume',menu:'Menu',tapstart:'space / tap',title:'RUSLO',subtitle:'Over the river · bridges, depots, fuel',
   foot:'<b>RUSLO</b> · ←→ steer, ↑↓ speed, space/● — fire, P/Esc — pause · L language, T theme, M sound.'}
};
var g=Arcade.createGame({canvas:'#c',width:360,height:540,gameId:'ruslo',strings:STR,theme:'modern'});
// Чёткость: буфер холста 2× (720×1080), вся отрисовка (и движка, и игры) — в логических 360×540.
(function(){ var cv=g.canvas; cv.width=720; cv.height=1080; g.ctx.setTransform(2,0,0,2,0,0); g._applyPixel(); })();
g.input.bindDpad(document.querySelector('.pad'));
function fit(){ g.fit(Math.min(420,Math.max(240,(innerHeight-70)*360/540))); }
fit(); addEventListener('resize',fit);
var started=false, lang=null, S=RUSLO.S, T=RUSLO.test;
function syncLang(){ if(lang!==g.i18n.lang){ lang=g.i18n.lang; if(RUSLO.getLang()!==lang) RUSLO.setLang(lang);
  document.title=g.t('title')+(lang==='ru'?' · Над рекой — HTML5':' · Over the river — HTML5'); document.documentElement.lang=lang;
  document.getElementById('foot').innerHTML=g.t('foot',''); } }
function syncCfg(){ S.gfx=g.themeName==='retro'?'retro':'modern'; RUSLO.cfg.sound=g.audio.enabled;
  try{ if(RUSLO.cfg.audioReady) Chiptune.setMuted(!g.audio.enabled); }catch(e){} }
(function poll(){ syncLang(); syncCfg(); requestAnimationFrame(poll); })();
// G — графика (старая клавиша) = смена темы движка.
addEventListener('keydown',function(e){ if(e.code==='KeyG'&&!e.repeat) g.toggleTheme(); });
addEventListener('blur',function(){ ['left','right','up','down','fire'].forEach(function(k){ T.hold(k,false); }); });
document.addEventListener('visibilitychange',function(){ if(document.hidden&&g._sceneName==='play') g.pause(); });
(function(){ var b=document.getElementById('bPause'); var f=function(e){ e.preventDefault(); if(g._sceneName==='play') g.pause(); else if(g._sceneName==='pause') g.goto('play',{resume:true}); };
  b.addEventListener('touchstart',f,{passive:false}); b.addEventListener('mousedown',f); })();

g.useStandardScreens({get subtitle(){ return g.t('subtitle',''); },lives:3});
g.scene('play',{realtime:true,
  enter:function(d){ if(!(d&&d.resume)){ syncCfg(); S.hi=Math.max(S.hi,this.state.best); T.startGame(); started=true; } },
  // Раскладка v2: пробел = огонь (action), P/Esc = пауза; Enter в полёте ничего не делает.
  press:function(a){ if(a==='pause') this.pause(); },
  update:function(dt){ if(!started) return; var k=this.input.keys, d=this.input.dir;
    T.hold('left',d.x<0); T.hold('right',d.x>0); T.hold('up',d.y<0); T.hold('down',d.y>0); T.hold('fire',!!k.action);
    T.update(Math.min(0.05,dt));
    this.state.score=S.score; this.state.level=S.level; this.state.lives=S.lives;
    if(S.mode==='over'){ started=false; T.hold('fire',false); this.gameover(); } },
  draw:function(ctx){ syncCfg(); RUSLO.Render.draw(ctx,S); }
});
g.start('title');
</script></body></html>

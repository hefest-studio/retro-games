<style>

  <button data-d="L">◀</button><button data-d="R">▶</button><button data-d="U">⤒</button><button data-d="A">●</button><button data-pause="1">II</button>
</div>

<script>
'use strict';
var Z=window.ZVERO2;
var STR={
 ru:{play:'Играть',players:'Игроки',touch1p:'тач — 1 игрок',language:'Язык',theme:'Тема',sound:'Звук',on:'вкл',off:'выкл',score:'Счёт',level:'Цех',best:'Рекорд',win:'ПОГРЕБА ОЧИЩЕНЫ!',gameover:'ОТРЯД ЗАМЁРЗ',pause:'ПАУЗА',resume:'Продолжить',menu:'В меню',tapstart:'пробел / тап',title:'ЗВЕРО-ОТРЯД 2',subtitle:'Ледяные Погреба · ко-оп платформер · 1–2 игрока'},
 en:{play:'Play',players:'Players',touch1p:'touch — 1 player',language:'Language',theme:'Theme',sound:'Sound',on:'on',off:'off',score:'Score',level:'Stage',best:'Best',win:'CELLARS CLEARED!',gameover:'SQUAD FROZEN',pause:'PAUSE',resume:'Resume',menu:'Menu',tapstart:'space / tap',title:'ZVERO-OTRYAD 2',subtitle:'Ice Cellars · co-op platformer · 1–2 players'}
};
var g=Arcade.createGame({canvas:'#c',width:960,height:600,gameId:'zvero-otryad-2',strings:STR,theme:'modern'});
var pad=document.querySelector('.pad');
g.input.bindDpad(pad);
g.fit(620); addEventListener('resize',function(){g.fit(620);});
g.useStandardScreens({title:'ЗВЕРО-ОТРЯД 2',subtitle:STR.ru.subtitle,lives:0});
var co=Arcade.coop(g,{
  bind:{ p1:{left:['ArrowLeft'],right:['ArrowRight'],jump:['ArrowUp'],grab:['Slash','NumpadDivide','Period','Space']},
         p2:{left:['KeyA'],right:['KeyD'],jump:['KeyW'],grab:['KeyF','ShiftLeft']} },
  actions:['jump','grab'], pad:pad, touch:{L:'left',R:'right',U:'jump',A:'grab'},
  hint:{ ru:['Пыж (И1): ← → бег, ↑ прыжок, / или пробел — схватить/бросить','Тяпа (И2): A D бег, W прыжок, F — схватить/бросить · 1/2 — игроки'],
         en:['Pyzh (P1): ← → run, ↑ jump, / or space — grab/throw','Tyapa (P2): A D run, W jump, F — grab/throw · 1/2 — players'] }
});
var game=null;
function bp(f,d,t,v){ g.audio.beep(f,d,t,v); }
function mkGame(){ return Z.Game({hi:g.state.best,twoP:co.players()===2,onEvent:function(type){
  if(type==='jump') bp(560,.05,'square',.05);
  else if(type==='grab') bp(420,.05,'triangle',.06);
  else if(type==='throw') bp(760,.06,'square',.05);
  else if(type==='smash') bp(130,.14,'sawtooth',.07);
  else if(type==='pickup') bp(1180,.07,'triangle');
  else if(type==='bosshit') bp(180,.12,'sawtooth',.08);
  else if(type==='door') bp(1300,.14,'triangle');
  else if(type==='hurt') bp(210,.14,'sawtooth',.07);
  else if(type==='gameover'){ if(game) g.state.score=game.state().score; g.gameover(); }
  else if(type==='win'){ if(game) g.state.score=game.state().score; g.win(); }
}}); }
co.onAction(function(pi,name){ if(!game) return; if(name==='jump') game.jump(pi); else if(name==='grab') game.action(pi); });
function render(ctx){ var st=game?game.state():null; if(!st){ g.clear(); return; }
  if(Z.i18n) Z.i18n.lang=g.i18n.lang;
  (g.themeName==='retro'?Z.classic:Z.modern).draw(ctx,st);
  if(st.players&&st.players.length>1) offscreen(ctx,st); }
// Кооп: камера движка держит середину между героями, и при большом разносе (уже на старте цеха —
// точки P и Q дальше ширины экрана) герой уходит за край. Не меняя логики игры, рисуем у края
// маркер «◀ ПЫЖ» / «ТЯПА ▶» на высоте героя — видно, куда идти навстречу.
var MARK=[{c:'#e07a2c',ru:'ПЫЖ',en:'PYZH'},{c:'#9fb0c0',ru:'ТЯПА',en:'TYAPA'}];
function offscreen(ctx,st){ var W=st.viewW||960, cam=st.camX||0;
  for(var i=0;i<st.players.length;i++){ var p=st.players[i]; if(!p.alive) continue; var sx=p.x-cam, left=sx+p.w<0, right=sx>W; if(!left&&!right) continue;
    var m=MARK[i]||MARK[0], y=Math.max(70,Math.min((st.viewH||600)-20,p.y+p.h/2)), lab=(left?'◀ ':'')+m[g.i18n.lang]+(right?' ▶':'');
    ctx.save(); ctx.font='800 14px '+g.th().font; ctx.textBaseline='middle'; var tw=ctx.measureText(lab).width+14, x=left?6:W-6-tw;
    ctx.globalAlpha=.85+.15*Math.sin(g.time*6); ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(x,y-12,tw,24);
    ctx.strokeStyle=m.c; ctx.lineWidth=2; ctx.strokeRect(x+1,y-11,tw-2,22); ctx.fillStyle=m.c; ctx.textAlign='left'; ctx.fillText(lab,x+7,y+1); ctx.restore(); } }
g.scene('play',{realtime:true,
  enter:function(d){ co.arm(); if(!(d&&d.resume)){ game=mkGame(); game.start(); } },
  press:function(a){ if(a==='pause') this.pause(); },
  update:function(dt){ if(!game) return;
    for(var pi=0;pi<co.players();pi++){ game.setHeld(pi,'left',co.held(pi,'left')); game.setHeld(pi,'right',co.held(pi,'right')); }
    game.update(Math.min(dt,0.05)); if(game) g.state.score=game.state().score; },
  draw:function(ctx){ render(ctx); }
});
window.__ZVERO_V2={g:g,co:co,game:function(){return game;}};
g.start('title');
</script></body></html>

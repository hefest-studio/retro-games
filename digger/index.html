<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060a">
<title>DIGGER · HTML5</title>
<meta name="description" content="DIGGER — браузерный порт классической аркады 1983 года: копайте туннели, собирайте алмазы, роняйте мешки золота на монстров. 8-битная музыка, русский язык, переключение на современную графику.">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ── СТРУКТУРНЫЙ КАРКАС (Lead): сцена 960×600, оверлей UI, слой эффектов ── */
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #05060a;
    color: #e8edf7;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #stage {
    position: relative;
    line-height: 0;
    width: min(96vw, 160vh, 1440px);
    width: min(96vw, 160dvh, 1440px);
    aspect-ratio: 8 / 5;
    border-radius: 14px;
    overflow: hidden;
    background: #05060a;
    box-shadow: 0 0 0 1px rgba(120, 170, 255, .14), 0 24px 70px rgba(0, 0, 0, .65);
    isolation: isolate;
  }
  canvas#game {
    display: block;
    width: 100%;
    height: 100%;
    background: #05060a;
    image-rendering: auto;
    touch-action: none;
  }
  body.gfx-classic canvas#game { image-rendering: pixelated; image-rendering: crisp-edges; }
  #ui, #fx { position: absolute; inset: 0; }
  #ui { z-index: 3; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  #fx { z-index: 2; pointer-events: none; }
  #err, #testout {
    position: fixed; z-index: 99; left: 0; top: 0; margin: 0; padding: 10px 12px;
    display: none; max-width: 100vw; max-height: 100vh; overflow: auto;
    background: #000; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap; text-align: left;
  }
  #err { color: #ff8a8a; }
  #testout { color: #7dffa8; }
  /* скриншот-режим: гасим анимации для стабильных кадров */
  body.shot *, body.shot *::before, body.shot *::after {
    animation-duration: 0s !important; animation-delay: 0s !important;
    transition: none !important;
  }
  @media (max-width: 720px) {
    #stage { width: 100vw; width: 100dvw; border-radius: 0; }
  }
  /* Портрет: сцена занимает весь экран, мир — letterbox по центру,
     UI получает полный экран для адаптивных экранов. */
  @media (max-width: 720px) and (orientation: portrait) {
    #stage {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      aspect-ratio: auto;
      border-radius: 0;
      display: flex; align-items: center; justify-content: center;
    }
    canvas#game { width: 100%; height: auto; }
  }
  @media (max-height: 520px) {
    #stage { width: min(100vw, 160dvh); border-radius: 0; }
  }
</style>
</head>
<body class="gfx-classic crt-on" data-gfx="classic">
<div id="stage">
  <canvas id="game" width="960" height="600" aria-label="Игровое поле Digger"></canvas>
  <div id="ui"></div>
  <div id="fx" aria-hidden="true"></div>
</div>
<pre id="err" aria-hidden="true"></pre>
<pre id="testout" aria-hidden="true"></pre>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;font:16px sans-serif;color:#fff;background:#000">Для игры нужен JavaScript.</p></noscript>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/classic.js"></script>
<script src="js/modern.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>

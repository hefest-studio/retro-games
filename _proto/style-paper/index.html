<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КВЕСТ — прототип «Бумага»</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23EA6A12'/%3E%3Cg transform='translate(9,9) scale(0.72)' fill='%2316181D'%3E%3Crect x='12' y='13' width='9' height='38' rx='4.5'/%3E%3Crect x='43' y='13' width='9' height='38' rx='4.5'/%3E%3Cpath d='M34 23 L24 35 H31 L28 45 L41 31 H34 Z'/%3E%3C/g%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #2a1c14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font: 13px/1.3 system-ui, sans-serif; }
  #stage { display: block; cursor: none; touch-action: none; }
  .bar { position: fixed; left: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center; opacity: 0.85; }
  .bar button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #c49a64; background: #3a2a1f; color: #f2e5c7; cursor: pointer; }
  .bar button.on { background: #c49a64; color: #2a1c14; }
  .bar span { color: #c9b28c; margin-left: 6px; }
  .shot .bar { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="960" height="540"></canvas>
<div class="bar">
  <button data-scene="1" title="Клавиша 1">Сцена 1 · двор</button>
  <button data-scene="2" title="Клавиша 2">Сцена 2 · мастерская</button>
  <span id="fps"></span>
</div>
<script src="../shared/demo-scene.js"></script>
<script src="theme.js"></script>
<script src="../shared/proto-runner.js"></script>
</body>
</html>

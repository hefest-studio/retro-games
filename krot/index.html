<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>КРОТ · Подземные туннели — HTML5</title>
<meta name="description" content="КРОТ — оригинальная аркада студии «Гефест» о подземном буре на фреймворке Гефест Arcade: копай туннели, собирай алмазы, роняй мешки золота на монстров. Темы retro/modern, RU/EN, офлайн.">
<meta name="theme-color" content="#05060a">
<link rel="canonical" href="https://arcade.hefest.ru/krot/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23EA6A12'/%3E%3Cg transform='translate(9,9) scale(0.72)' fill='%2316181D'%3E%3Crect x='12' y='13' width='9' height='38' rx='4.5'/%3E%3Crect x='43' y='13' width='9' height='38' rx='4.5'/%3E%3Cpath d='M34 23 L24 35 H31 L28 45 L41 31 H34 Z'/%3E%3C/g%3E%3C/svg%3E">
<meta property="og:type" content="website"><meta property="og:site_name" content="Гефест · Зал ретро-игр">
<meta property="og:title" content="КРОТ · Подземные туннели"><meta property="og:url" content="https://arcade.hefest.ru/krot/">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#05060a;color:#e8edf7;font-family:Inter,system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;min-height:100dvh;user-select:none;overflow:hidden}
.wrap{position:relative;width:min(96vw,620px);margin-top:10px}
canvas{width:100%;display:block;border:1px solid #222838;border-radius:10px;background:#05060a;touch-action:none}
.pad{width:min(96vw,620px);margin:10px 0;display:grid;grid-template-columns:repeat(3,1fr) 1.2fr;grid-template-rows:repeat(2,50px);gap:8px;max-width:360px}
.pad button{background:#161a24;border:1px solid #222838;border-radius:12px;color:#eef2f8;font-size:20px;font-weight:800}
.pad button:active{background:#232a38}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.pad .f{grid-column:4;grid-row:1/3;font-size:26px;color:#ffb020}
.foot{color:#5a6273;font-size:11px;margin:2px 12px 16px;text-align:center;max-width:620px}
a.back{position:fixed;left:10px;top:8px;color:#5a6273;font-size:12px;text-decoration:none}
@media(min-width:760px){.pad{display:none}}
</style></head><body>
<a class="back" href="../">← Каталог</a>
<div class="wrap"><canvas id="c" width="960" height="600" aria-label="КРОТ"></canvas></div>
<div class="pad">
  <button class="u" data-d="U">▲</button><button class="l" data-d="L">◀</button>
  <button class="d" data-d="D">▼</button><button class="r" data-d="R">▶</button>
  <button class="f" data-d="A" aria-label="Огонь">●</button>
</div>
<div class="foot" id="foot"></div>
<script src="./engine.js"></script>
<script src="./js/music.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/game.js"></script>
<script src="./js/classic.js"></script>
<script src="./js/modern.js"></script>
<script>
'use strict';
// Ключи прежнего имени → krot.* (KROT.migrateStorage), затем перенос старого рекорда (krot.hi.v1)
// в общий ключ движка — один раз.
(function(){ try{ KROT.migrateStorage(localStorage); }catch(e){} })();
(function(){ try{ var S=Arcade.Store, k='arcade.best.krot';
  if(S.get('arcade.migrated.krot',null)) return;
  var old=parseInt(JSON.parse(S.get(KROT.STORE_KEYS.hi,'0')),10)||0;
  if(old>S.getNum(k,0)) S.set(k,String(old)); S.set('arcade.migrated.krot','1');
}catch(e){} })();
var STR={
 ru:{play:'Играть',language:'Язык',theme:'Тема',sound:'Звук',on:'вкл',off:'выкл',score:'Счёт',level:'Ур.',best:'Рекорд',win:'ПОБЕДА!',gameover:'КОНЕЦ ИГРЫ',pause:'ПАУЗА',resume:'Продолжить',menu:'В меню',tapstart:'пробел / тап',title:'КРОТ',subtitle:'Подземные туннели · алмазы и мешки золота',
   foot:'<b>КРОТ</b> · стрелки/WASD — копать, пробел/● — выстрел, P/Esc — пауза · L язык, T тема, M звук.'},
 en:{play:'Play',language:'Language',theme:'Theme',sound:'Sound',on:'on',off:'off',score:'Score',level:'Lvl',best:'Best',win:'VICTORY!',gameover:'GAME OVER',pause:'PAUSE',resume:'Resume',menu:'Menu',tapstart:'space / tap',title:'KROT',subtitle:'Underground tunnels · gems and gold bags',
   foot:'<b>KROT</b> · arrows/WASD — dig, space/● — fire, P/Esc — pause · L language, T theme, M sound.'}
};
var g=Arcade.createGame({canvas:'#c',width:960,height:600,gameId:'krot',strings:STR,theme:'modern'});
g.input.bindDpad(document.querySelector('.pad'));
g.fit(620); addEventListener('resize',function(){g.fit(620);});
var game=null, lang=null;

// Родной звук КРОТА (SFX) — только эффекты; музыку ведёт движок (js/music.js).
var DA=window.KROT&&KROT.audio;
if(DA){ try{ DA.setMusicEnabled(false); DA.setVolume(0.6); }catch(e){} }
function unlockSfx(){ if(DA){ try{ DA.unlock(); DA.setMusicEnabled(false); }catch(e){} } }
['keydown','pointerdown','touchstart'].forEach(function(ev){ addEventListener(ev,unlockSfx,{passive:true}); });
var lastDig=0;
function sfx(n){ if(!DA||!g.audio.enabled) return; try{ DA.sfx(n); }catch(e){} }
var SFX={dig:'dig',gem:'gem',gold:'gold',bagPush:'bag_push',bagWobble:'bag_wobble',bagFall:'bag_fall',bagBreak:'bag_break',
  shoot:'shoot',monsterDie:'monster_die',squash:'squash',cherry:'cherry',bonusStart:'bonus',eat:'eat',playerDie:'player_die',
  extraLife:'extra_life',levelClear:'level_clear'};
function syncLang(){ if(lang!==g.i18n.lang){ lang=g.i18n.lang; KROT.i18n.setLang(lang); document.documentElement.lang=lang;
  document.getElementById('foot').innerHTML=g.t('foot',''); } }

function mkGame(){ return KROT.Game({ seed:(Date.now()^((Math.random()*0x7fffffff)|0))>>>0, hiscore:g.state.best,
  onEvent:function(type){
    if(type==='dig'){ var now=performance.now(); if(now-lastDig<60) return; lastDig=now; }
    if(SFX[type]) sfx(SFX[type]);
    if(type==='gameOver'&&game){ g.state.score=game.state.score; g.gameover(); }
  }}); }
function render(ctx){ if(!game){ g.clear(); return; }
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  (g.themeName==='retro'?KROT.render.classic:KROT.render.modern).draw(ctx,game.state); }

// Направление: последняя нажатая клавиша (как в оригинале), тач-крестовина — через движок.
var DIRK={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
var stack=[], lastSent=-2;
addEventListener('keydown',function(e){ if(!(e.code in DIRK)) return; for(var i=0;i<stack.length;i++) if(stack[i].c===e.code) return; stack.push({c:e.code,d:DIRK[e.code]}); });
addEventListener('keyup',function(e){ for(var i=stack.length-1;i>=0;i--) if(stack[i].c===e.code){ stack.splice(i,1); return; } });
addEventListener('blur',function(){ stack=[]; });
function curDir(){ if(stack.length) return stack[stack.length-1].d; var d=g.input.dir;
  return d.y<0?0:d.x>0?1:d.y>0?2:d.x<0?3:-1; }
// G — графика (старая клавиша) = смена темы движка.
addEventListener('keydown',function(e){ if(e.code==='KeyG'&&!e.repeat) g.toggleTheme(); });
document.addEventListener('visibilitychange',function(){ if(document.hidden&&g._sceneName==='play') g.pause(); });

// заголовок и подзаголовок меню — по текущему языку движка
g.useStandardScreens({get subtitle(){ return g.t('subtitle',''); },lives:3});
(function poll(){ syncLang(); requestAnimationFrame(poll); })();
g.scene('play',{realtime:true,
  enter:function(d){ if(!(d&&d.resume)){ game=mkGame(); game.start(); lastSent=-2; } },
  press:function(a){ if(a==='pause') this.pause(); },
  update:function(dt){ if(!game) return; var S=game.state;
    var dir=curDir(); if(dir!==lastSent){ game.setDir(dir); lastSent=dir; }
    if(this.input.keys.action&&(S.mode==='play'||S.mode==='bonus')) game.shoot();
    game.update(dt); this.state.score=S.score; this.state.level=S.level; this.state.lives=S.lives; },
  draw:function(ctx){ render(ctx); }
});
g.start('title');
</script></body></html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070f">
  <meta name="description" content="СЕВЕРНАЯ САГА 2 «Северное сияние» — оригинальная платформер-головоломка с тремя героями студии «Гефест» на фреймворке Гефест Arcade: шесть саг, два стиля графики (retro / modern), RU/EN, офлайн.">
  <title>СЕВЕРНАЯ САГА 2 · Северное сияние</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23EA6A12'/%3E%3Cg transform='translate(9,9) scale(0.72)' fill='%2316181D'%3E%3Crect x='12' y='13' width='9' height='38' rx='4.5'/%3E%3Crect x='43' y='13' width='9' height='38' rx='4.5'/%3E%3Cpath d='M34 23 L24 35 H31 L28 45 L41 31 H34 Z'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <style>
  /* Движок v2 поверх игры (js/host.js): canvas движка (меню/пауза/финал) — в рамке 16:9 по центру экрана,
     над родными экранами и тач-кнопками, под тостами. Родные титул, пауза и финал скрыты — их заменяют
     экраны движка; брифинг саги, выбор саги, «Сага пройдена», помощь — родные. */
  #arcade-frame { position: fixed; inset: 0; margin: auto; z-index: 45; pointer-events: none;
    width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); }
  canvas.arcade-host { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: auto; }
  html:not([data-arcade-scene="off"]) .screen-root > section[data-screen="title"],
  html:not([data-arcade-scene="off"]) .screen-root > section[data-screen="pause"],
  html:not([data-arcade-scene="off"]) .screen-root > section[data-screen="ending"] { display: none !important; }
  a.back { position: fixed; left: 10px; top: 8px; z-index: 70; color: #8a93a8; font: 12px Inter, system-ui, sans-serif; text-decoration: none; }
  a.back:hover { color: #eaf6ff; }
  body[data-screen="play"] a.back { display: none; } /* в игре не перекрывает HUD; в меню/паузе — видна */
  </style>
</head>
<body data-screen="boot" class="mode-retro" data-lang="ru">
  <a class="back" href="../">← Каталог</a>

  <div id="stage">
    <canvas id="game" width="1024" height="576" role="img"
      aria-label="Игровое поле: платформенные головоломки с тремя викингами"></canvas>
    <div id="ui" class="ui"></div>
  </div>
  <div id="arcade-frame"></div>

  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="touch" class="touch-layer"></div>

  <noscript>
    <p class="noscript">Для игры нужен JavaScript. Включите его и перезагрузите страницу.</p>
  </noscript>

  <script src="./engine.js"></script>
  <script src="./js/host.js"></script>
  <!-- Порядок скриптов игры строго по CONTRACT.md §0 -->
  <script src="js/i18n.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/vikings-retro.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
  'use strict';
  /* СЕВЕРНАЯ САГА 2 на движке v2 — «оболочка» (js/host.js): родные js/*.js (логика, уровни, баланс,
     рендеры AURORA = modern и 8-BIT = retro, своя музыка, HUD, брифинги) работают без изменений,
     движок даёт меню/паузу/финал/тему/язык/звук/рекорд. Связь — через публичные window.SAGA2.main / SAGA2.ui.
     Прогресс игры (saga2.progress; старые ключи lv2.* мигрирует js/main.js) не трогается. */
  document.addEventListener('DOMContentLoaded', function () { // после boot() игры (его слушатель раньше)
    var SAGA2 = window.SAGA2, M = SAGA2.main;
    if (!M) return; // уровни не загрузились — игра показала свою заглушку
    var STR = {
      ru: { play: 'Играть', language: 'Язык', theme: 'Тема', sound: 'Звук', on: 'вкл', off: 'выкл', score: 'Очки', level: 'Ур.', best: 'Рекорд',
            win: 'РУНЫ СОБРАНЫ!', gameover: 'ВИКИНГИ ПАЛИ', pause: 'ПАУЗА', resume: 'Продолжить', menu: 'В меню', tapstart: 'Enter / тап',
            title: 'СЕВЕРНАЯ САГА 2', subtitle: 'Северное сияние · платформер-головоломка с тремя героями', 'continue': 'Продолжить', levels: 'Саги' },
      en: { play: 'Play', language: 'Language', theme: 'Theme', sound: 'Sound', on: 'on', off: 'off', score: 'Score', level: 'Lvl', best: 'Best',
            win: 'ALL RUNES FOUND!', gameover: 'THE VIKINGS FELL', pause: 'PAUSE', resume: 'Resume', menu: 'Menu', tapstart: 'Enter / tap',
            title: 'NORTHERN SAGA 2', subtitle: 'Nordic Aurora · a puzzle platformer with three heroes', 'continue': 'Continue', levels: 'Sagas' }
    };
    // экраны игры (body[data-screen]) → режимы оболочки; родные экраны между уровнями — 'sub'
    var MODE = { title: 'title', levels: 'sub', brief: 'sub', complete: 'sub', play: 'play', pause: 'paused', ending: 'win' };
    function screen() { return document.body.getAttribute('data-screen'); }
    function progress() { // saga2.progress — только чтение (старый рекорд = сумма лучших очков по сагам)
      try { var p = JSON.parse(localStorage.getItem('saga2.progress') || '{}'), s = 0, k; for (k in (p.levels || {})) s += +(p.levels[k].score || 0); return s; } catch (e) { return 0; }
    }
    ArcadeHost.mount({
      gameId: 'saga-2', mount: '#arcade-frame', width: 704, height: 396, strings: STR, extra: ['continue', 'levels'],
      gameKeys: { KeyL: 1 },                                   // L в игре — крюк Гуннара; язык в игре — Y (как раньше)
      urlQuery: true, rawGameKeys: true, soundFromEngine: true, bootKeep: true, // адаптации общего _shared/host.js (как у saga)
      urlTheme: function (P) { var m = P.get('mode') || P.get('gfx'); return m === 'retro' ? 'retro' : (m === 'aurora' || m === 'modern') ? 'modern' : null; },
      adapter: {
        mode: function () {
          var s = screen();
          if (SAGA2.ui.isHelpOpen() && (s === 'title' || s === 'levels')) return 'sub'; // помощь поверх меню — родная
          return MODE[s] || 'sub';
        },
        start: function () { M.newGame(); },                 // «Играть» — новая сага с первой земли (прогресс не сбрасывается)
        toTitle: function () { M.showTitle(); },
        pause: function () { M.pause(); },
        resume: function () { M.resume(); },
        openSub: function (key) { if (key === 'levels') SAGA2.ui.screen('levels'); else M.continueGame(); },
        extraHint: function (key) { return key === 'continue' ? ' · ' + M.state.progress.unlocked : ''; },
        score: function () { var g = M.game(); return (g && g.runScore) || 0; },
        best: progress,
        gfx: function () { return M.state.mode === 'retro' ? 'retro' : 'modern'; },
        setGfx: function (v) { if ((M.state.mode === 'retro') !== (v === 'retro')) M.toggleGraphics(); },
        lang: function () { return M.state.lang === 'en' ? 'en' : 'ru'; },
        setLang: function (v) { if (M.state.lang !== v) M.toggleLang(); },
        setSound: function (on) { if (M.state.muted === on) M.toggleMute(); }
      }
    });
  });
  </script>
</body>
</html>

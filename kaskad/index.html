<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>КАСКАД · Головоломка — HTML5</title>
<meta name="description" content="Оригинальная головоломка с падающими фигурами студии «Гефест» на фреймворке Гефест Arcade: темы retro/modern, RU/EN, офлайн.">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0e1016;color:#eef2f8;font-family:Inter,system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;min-height:100dvh;user-select:none;overflow:hidden}
.wrap{position:relative;width:min(94vw,440px);margin-top:4px}
canvas{width:100%;display:block;border:1px solid #222838;border-radius:10px;background:#0e1016}
.pad{width:min(94vw,440px);margin:10px 0;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:400px}
.pad button{height:52px;background:#161a24;border:1px solid #222838;border-radius:12px;color:#eef2f8;font-size:20px;font-weight:800}
.pad button:active{background:#232a38}
.foot{color:#5a6273;font-size:11px;margin:2px 12px 16px;text-align:center}
@media(min-width:760px){.pad{display:none}}
a.back{position:relative;align-self:flex-start;margin:6px 0 0 10px;z-index:60;color:#5a6273;font-size:12px;line-height:16px;text-decoration:none} /* в потоке над полем — не налезает на canvas */
/* Телефон лёжа: поле по высоте экрана (fitField), кнопки 3×2 — справа от поля, ссылка — слева сверху */
@media (orientation:landscape) and (max-height:520px) and (pointer:coarse){
  body{justify-content:center}
  a.back{position:fixed;left:max(10px,env(safe-area-inset-left));top:8px;margin:0}
  .wrap{margin:0}
  .foot{display:none}
  .pad{display:grid;position:fixed;right:max(8px,env(safe-area-inset-right));bottom:10px;margin:0;width:184px;grid-template-columns:repeat(3,1fr)}
}
</style></head><body>
<a class="back" href="../" data-catalog-back="1" data-en="&larr; Catalog" data-tr="&larr; Katalog" data-es="&larr; Catálogo" data-pt="&larr; Catálogo">&larr; Каталог</a>
<div class="wrap"><canvas id="c" width="420" height="640"></canvas></div>
<div class="pad">
  <button data-d="L">◀</button><button data-d="D">▼</button><button data-d="R">▶</button>
  <button data-d="U">⟳</button><button data-d="A">⬇</button><button data-pause="1" aria-label="Пауза">II</button>
</div>
<div class="foot" data-en="&lt;b&gt;CASCADE&lt;/b&gt; on the Hefest Arcade framework · ◀▶ move, ▼ soft drop, ⟳ rotate, ⬇ hard drop, C — hold, P — pause · L language, T theme, M sound." data-tr="&lt;b&gt;CASCADE&lt;/b&gt; · ◀▶ hareket, ▼ yavaş indir, ⟳ döndür, ⬇ hızlı bırak, C — yedek, P — duraklat · L dil, T tema, M ses." data-es="&lt;b&gt;CASCADE&lt;/b&gt; · ◀▶ mover, ▼ bajar, ⟳ girar, ⬇ soltar, C — reserva, P — pausa · L idioma, T tema, M sonido." data-pt="&lt;b&gt;CASCADE&lt;/b&gt; · ◀▶ mover, ▼ descer, ⟳ girar, ⬇ soltar, C — reserva, P — pausa · L idioma, T tema, M som."><b>КАСКАД</b> на фреймворке Гефест Arcade · ◀▶ ход, ▼ мягкий сброс, ⟳ поворот, ⬇ жёсткий сброс, C — холд, P — пауза · L язык, T тема, M звук.</div>
<script src="./engine.js"></script>
<script src="./js/music.js"></script>
<script src="./js/game.js"></script>
<script src="./js/daily.js"></script>
<script>
const STR = {
  ru:{ play:'Играть', language:'Язык', theme:'Тема', sound:'Звук', on:'вкл', off:'выкл', score:'Счёт', level:'Ур.', lines:'Линии', best:'Рекорд', next:'След', hold:'Холд', win:'ПОБЕДА!', gameover:'ИГРА ОКОНЧЕНА', pause:'ПАУЗА', resume:'Продолжить', menu:'В меню', tapstart:'пробел / тап', title:'КАСКАД', subtitle:'Складывай линии · цель — 40',
    daily:'Испытание дня', dailyBest:'Рекорд дня', dailyNew:'Новый рекорд дня!', streak:'Серия дней', dayTag:'ДЕНЬ', lb:'Лидеры', lbAll:'Рекорды', rwRows:'Реклама: −2 нижних ряда' },
  en:{ play:'Play', language:'Language', theme:'Theme', sound:'Sound', on:'on', off:'off', score:'Score', level:'Lvl', lines:'Lines', best:'Best', next:'Next', hold:'Hold', win:'YOU WIN!', gameover:'GAME OVER', pause:'PAUSE', resume:'Resume', menu:'Menu', tapstart:'space / tap', title:'CASCADE', subtitle:'Clear lines · goal 40',
    daily:'Daily challenge', dailyBest:'Daily best', dailyNew:'New daily best!', streak:'Day streak', dayTag:'DAY', lb:'Leaderboard', lbAll:'All-time best', rwRows:'Watch ad: clear 2 bottom rows' },
  // TR / ES / PT-BR: перевод — ИИ, вычитан обратным переводом и вторым проходом; носитель языка НЕ проверял. Название внутри языка
  // одно (Яндекс 5.1.3): в TR/ES/PT — EN-название CASCADE (README, «Языки»). Строки движка (реклама за награду, загрузка) — в движке.
  tr:{ play:'Oyna', language:'Dil', theme:'Tema', sound:'Ses', on:'açık', off:'kapalı', score:'Puan', level:'Sv.', lines:'Satır', best:'Rekor', next:'Sıradaki', hold:'Yedek', win:'KAZANDIN!', gameover:'OYUN BİTTİ', pause:'DURAKLATILDI', resume:'Devam et', menu:'Ana menü', tapstart:'boşluk / dokun', title:'CASCADE', subtitle:'Satırları tamamla · hedef: 40',
    daily:'Günlük mücadele', dailyBest:'Günün rekoru', dailyNew:'Yeni günlük rekor!', streak:'Gün serisi', dayTag:'GÜN', lb:'Liderler', lbAll:'Tüm zamanlar', rwRows:'Reklam: alttaki 2 sırayı sil' },
  es:{ play:'Jugar', language:'Idioma', theme:'Tema', sound:'Sonido', on:'sí', off:'no', score:'Puntos', level:'Niv.', lines:'Líneas', best:'Récord', next:'Siguiente', hold:'Reserva', win:'¡VICTORIA!', gameover:'FIN DEL JUEGO', pause:'PAUSA', resume:'Continuar', menu:'Menú principal', tapstart:'espacio / toca', title:'CASCADE', subtitle:'Completa líneas · meta: 40',
    daily:'Reto diario', dailyBest:'Récord del día', dailyNew:'¡Nuevo récord del día!', streak:'Días seguidos', dayTag:'DÍA', lb:'Clasificación', lbAll:'Récord histórico', rwRows:'Anuncio: borra 2 filas de abajo' },
  pt:{ play:'Jogar', language:'Idioma', theme:'Tema', sound:'Som', on:'ligado', off:'desligado', score:'Pontos', level:'Nív.', lines:'Linhas', best:'Recorde', next:'Próxima', hold:'Reserva', win:'VITÓRIA!', gameover:'FIM DE JOGO', pause:'PAUSA', resume:'Continuar', menu:'Menu principal', tapstart:'espaço / toque', title:'CASCADE', subtitle:'Complete linhas · meta: 40',
    daily:'Desafio diário', dailyBest:'Recorde do dia', dailyNew:'Novo recorde do dia!', streak:'Dias seguidos', dayTag:'DIA', lb:'Ranking', lbAll:'Recorde geral', rwRows:'Anúncio: limpar 2 linhas de baixo' },
};
// Палитра фигур по теме (I O T S Z J L -> id 1..7)
const PAL = {
  modern: [null,'#4cc9f0','#ffd60a','#c77dff','#4ade80','#ef4444','#4361ee','#f3722c'],
  retro:  [null,'#55ffff','#ffff55','#ff55ff','#55ff55','#ff5555','#5577ff','#ffaa00'],
  neon:   [null,'#39e7ff','#ffe14d','#ff2f9c','#49ffb0','#ff5d6c','#6a8cff','#ff9f1c'],
};
const g = Arcade.createGame({ canvas:'#c', width:420, height:640, gameId:'kaskad', strings:STR, theme:'modern' });
g.input.bindDpad(document.querySelector('.pad'));
// Поле вписывается и по ширине, и по высоте окна (масштаб по min): без обрезки и прокрутки.
// Телефон лёжа (LAND): поле по высоте экрана, тач-кнопки — в боковых полях, «← Каталог» — в левом верхнем углу.
var LAND='(orientation:landscape) and (max-height:520px) and (pointer:coarse)';
function fitField(maxW, vwPart, side){ var c=document.getElementById('c'), wrap=c.parentNode, pad=document.querySelector('.pad');
  var vw=document.documentElement.clientWidth, vh=window.innerHeight, aw, ah;
  if(matchMedia(LAND).matches){ aw=vw-2*side; ah=vh-12; }
  else { aw=Math.min(maxW, vw*vwPart); ah=vh-wrap.getBoundingClientRect().top-(getComputedStyle(pad).display!=='none'?pad.offsetHeight+20:0)-6; }
  var w=Math.floor(Math.max(160, Math.min(aw, ah*g.W/g.H)));
  wrap.style.width=w+'px'; c.style.width=w+'px'; c.style.height=(w*g.H/g.W)+'px'; }
fitField(440,0.94,200); addEventListener('resize', ()=>fitField(440,0.94,200));
function pcol(id){ return (PAL[g.themeName]||PAL.modern)[id] || g.th().accent; }

const CELL=28, BX=14, BY=28, BW=10, BH=20;
let stack=null;
let daily=null, lastDaily=null;   // daily — испытание дня текущей партии (null — обычная партия); lastDaily — итог для экрана финала
function newStack(){
  return TT.Game({ hi: g.state.best, rng: daily ? daily.rng() : undefined, onEvent:(type)=>{
    if(type==='move'||type==='rotate') g.audio.beep(420,0.03,'square',0.05);
    else if(type==='lock') g.audio.beep(180,0.05,'square',0.06);
    else if(type==='clear') g.audio.beep(900,0.12,'triangle');
    else if(type==='levelup') g.audio.beep(1200,0.18,'sawtooth');
    else if(type==='harddrop') g.audio.beep(140,0.05,'square',0.07);
    else if(type==='win'){ syncScore(); g.win(); }
    else if(type==='gameover'){ syncScore(); g.gameover(); }
  }});
}
function syncScore(){ if(!stack) return; const s=stack.state(); g.state.score=s.score; g.state.level=s.level; }

function drawCell(ctx,x,y,id,ghost){
  const px=BX+x*CELL, py=BY+y*CELL;
  if(ghost){ ctx.strokeStyle=pcol(id); ctx.lineWidth=2; ctx.strokeRect(px+2.5,py+2.5,CELL-5,CELL-5); return; }
  if(g.th().pixel){ // retro: 8-битный кирпич — фаска (светлый верх-лево, тёмный низ-право) и «заклёпка» в центре
    ctx.fillStyle=pcol(id); ctx.fillRect(px,py,CELL,CELL);
    ctx.fillStyle='#ffffff'; ctx.fillRect(px,py,CELL,4); ctx.fillRect(px,py,4,CELL);
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(px,py+CELL-4,CELL,4); ctx.fillRect(px+CELL-4,py,4,CELL);
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(px+10,py+10,CELL-20,CELL-20);
    return;
  }
  ctx.fillStyle=pcol(id); ctx.fillRect(px+1,py+1,CELL-2,CELL-2);
  ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(px+1,py+1,CELL-2,3);
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(px+1,py+CELL-4,CELL-2,3);
}
function drawMini(ctx,type,ox,oy){
  if(!type) return; const m=TT.consts.SHAPES[type], id=TT.consts.COLOR[type], s=14;
  for(let y=0;y<m.length;y++)for(let x=0;x<m.length;x++) if(m[y][x]){ ctx.fillStyle=pcol(id); ctx.fillRect(ox+x*s, oy+y*s, s-1, s-1); }
}

g.useStandardScreens({ title:'КАСКАД', subtitle:STR.ru.subtitle, lives:0 });
// ---------- Испытание дня (мета-прогрессия: возвраты) ----------
// Одинаковая последовательность фигур на день (сид = дата), рекорд дня и серия дней — в облако площадки (g.persist 'max').
// День — по серверному времени площадки (Platform.serverTime(), адаптер 1.2): UTC+3, один день для всех; без него — местная дата.
const STORE={ get:k=>Arcade.Store.get(k,null), set:(k,v)=>g.storeSet(k,v) };
g.persist(TT.daily.KEY_BEST,'max'); g.persist(TT.daily.KEY_STREAK,'max');
function srvTime(){ try{ const P=g.platform, t=P && typeof P.serverTime==='function' ? P.serverTime() : null; return (typeof t==='number' && isFinite(t) && t>1e12) ? t : null; } catch(e){ return null; } }
// испытание текущего дня: объект на день кешируется (меню рисует подпись каждый кадр); сброс — при смене дня и после слияния облака
let dayCache=null;
function today(){ const t=srvTime(), key=t ? TT.daily.dateKey(t,3) : TT.daily.dateKey(Date.now()); if(!dayCache || dayCache.key!==key) dayCache=TT.daily.Daily(STORE,key); return dayCache; }
// Лидерборды площадки (движок v2.8: именованные таблицы): kaskad — рекорд, kaskadDaily — очки испытаний дня. Таблицы с этими техническими
// именами — в консоли площадки (Яндекс: «Лидерборды»; GamePush: числовые поля игрока). Без площадки — пункта нет, отправка — тихо false.
function lbSubmit(board,score){ if(score>0) g.leaderboard.submit(score|0,{ board }); }
function startRun(isDaily){ daily=isDaily ? today() : null; g.state.score=0; g.state.level=1; g.resetRun(); g.goto('play'); }
g.menu.addItem({ key:'daily', scene:'title', after:'play', label:()=>g.t('daily')+' · '+today().label, onSelect:()=>startRun(true) });
{ const tm=g.menu.get('title'); tm.items[tm.indexOf('play')].onSelect=()=>startRun(false); }   // «Играть» — обычная партия
g.useLeaderboard({ after:'daily', label:()=>g.t('lb'), boards:[ { id:'kaskad', label:()=>g.t('lbAll') }, { id:'kaskadDaily', label:()=>g.t('daily') } ] });
// облако слито (рекорд, испытание дня и серия с другого устройства) — сбросить кеш дня и дослать рекорды в таблицы
g.onCloud(keys=>{ dayCache=null; if(keys.length){ lbSubmit('kaskad', g.state.best); const d=today(), b=d.best(); if(b) lbSubmit('kaskadDaily', b); } });
// Площадка: «Без рекламы» (меню и пауза, цена из каталога), «Наши игры» (через SDK), ярлык, просьба об оценке после успеха
g.useNoAds({ scene:['title','pause'], after:'end' }); g.useOwnGames(); g.useShortcut(); g.useReview({ minSessions:3, gap:3 });
g.menu.setHint(()=>{ const d=today(), b=d.best(), s=d.streak();
  return [ g.t('dailyBest')+' '+d.label+': '+(b||'—'), { text: s ? g.t('streak')+': '+s : '', dim:true } ]; }, 'title');
// финал партии (после экрана «ещё шанс», если он был): рекорд дня, серия, лидерборды
function finishRun(){ lastDaily=null;
  if(daily){ const r=daily.submit(g.state.score); lastDaily={ label:daily.label, best:r.best, isNew:r.isNew, streak:r.streak }; lbSubmit('kaskadDaily', g.state.score); }
  lbSubmit('kaskad', g.state.best); daily=null; }
['win','gameover'].forEach(n=>{ const sc=g.scenes[n], en=sc.enter, dr=sc.draw;
  sc.enter=function(d){ en.call(this,d); finishRun(); };
  sc.draw=function(ctx){ dr.call(this,ctx); if(!lastDaily) return; const th=this.th();
    this.text(lastDaily.isNew ? g.t('dailyNew') : g.t('dailyBest')+' '+lastDaily.label+': '+lastDaily.best, this.W/2, this.H/2+48, { size:15, align:'center', color:lastDaily.isNew ? th.good : th.ink, weight:800 });
    if(lastDaily.streak) this.text(g.t('streak')+': '+lastDaily.streak, this.W/2, this.H/2+72, { size:13, align:'center', color:th.muted, weight:600 }); };
});
g.scene('play', { realtime:true,
  enter(d){ if(!(d&&d.resume)){ stack=newStack(); stack.start(); } else if(stack){ stack.pause(false); } },
  press(a){ if(!stack) return;
    if(a==='pause'){ this.pause(); return; }
    if(a==='up'){ stack.rotateCW(); return; }
    if(a==='action'){ stack.hardDrop(); return; }
    if(a==='left'){ stack.left(); this._mv=0.12; return; }
    if(a==='right'){ stack.right(); this._mv=0.12; return; }
  },
  update(dt){ if(!stack) return; stack.step(dt);
    const d=this.input.dir;
    this._mv=(this._mv||0)-dt;
    if(d.x && this._mv<=0){ d.x<0?stack.left():stack.right(); this._mv=0.10; }
    if(!d.x) this._mv=0;
    if(d.y>0){ this._sd=(this._sd||0)-dt; if(this._sd<=0){ stack.softDrop(); this._sd=0.045; } }
    syncScore();
  },
  draw(ctx){ const th=this.th(); this.clear();
    const s=stack?stack.state():null;
    // стакан
    if(th.pixel){ // retro: стакан в кирпичной рамке, чёрное поле, точечная сетка
      ctx.fillStyle='#2a1a3a'; ctx.fillRect(0,0,this.W,this.H);
      ctx.save(); ctx.beginPath(); ctx.rect(0,0,BX+BW*CELL+8,this.H); ctx.clip(); // кирпич — только вокруг стакана, панель справа чистая
      for(let y=0;y<this.H;y+=14)for(let x=(y/14)%2?-14:0;x<BX+BW*CELL+8;x+=28){ ctx.fillStyle=th.accent; ctx.fillRect(x+1,y+1,26,12); ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(x+1,y+11,26,2); }
      ctx.restore();
      ctx.fillStyle='#000'; ctx.fillRect(BX,BY,BW*CELL,BH*CELL);
      ctx.fillStyle=th.grid; for(let y=1;y<BH;y++)for(let x=1;x<BW;x++) ctx.fillRect(BX+x*CELL-1,BY+y*CELL-1,2,2);
    } else {
      ctx.fillStyle=th.panel; ctx.fillRect(BX-3,BY-3,BW*CELL+6,BH*CELL+6);
      ctx.fillStyle=th.bg; ctx.fillRect(BX,BY,BW*CELL,BH*CELL);
      ctx.strokeStyle=th.grid; ctx.lineWidth=1;
      for(let x=1;x<BW;x++){ ctx.beginPath(); ctx.moveTo(BX+x*CELL,BY); ctx.lineTo(BX+x*CELL,BY+BH*CELL); ctx.stroke(); }
      for(let y=1;y<BH;y++){ ctx.beginPath(); ctx.moveTo(BX,BY+y*CELL); ctx.lineTo(BX+BW*CELL,BY+y*CELL); ctx.stroke(); }
    }
    if(s){
      for(let y=0;y<BH;y++)for(let x=0;x<BW;x++) if(s.board[y][x]) drawCell(ctx,x,y,s.board[y][x]);
      if(s.cur){ const m=s.cur.m, id=TT.consts.COLOR[s.cur.type];
        for(let y=0;y<m.length;y++)for(let x=0;x<m.length;x++) if(m[y][x] && s.ghostY+y>=0) drawCell(ctx,s.cur.x+x,s.ghostY+y,id,true);
        for(let y=0;y<m.length;y++)for(let x=0;x<m.length;x++) if(m[y][x] && s.cur.y+y>=0) drawCell(ctx,s.cur.x+x,s.cur.y+y,id);
      }
    }
    // правая панель
    const PX=BX+BW*CELL+16;
    this.text(this.t('next','След'), PX, BY+6, {size:12, color:th.muted, weight:700});
    if(s) drawMini(ctx, s.next&&s.next[0], PX, BY+14);
    this.text(this.t('hold','Холд'), PX, BY+96, {size:12, color:th.muted, weight:700});
    if(s) drawMini(ctx, s.hold, PX, BY+104);
    this.text(this.t('score','Счёт'), PX, BY+190, {size:12, color:th.muted, weight:700});
    this.text(String(s?s.score:0), PX, BY+210, {size:20});
    this.text(this.t('lines','Линии'), PX, BY+244, {size:12, color:th.muted, weight:700});
    this.text((s?s.lines:0)+' / 40', PX, BY+264, {size:16});
    this.text(this.t('level','Ур.'), PX, BY+298, {size:12, color:th.muted, weight:700});
    this.text(String(s?s.level:0), PX, BY+318, {size:16});
    if(g.state.best){ this.text(this.t('best','Рекорд'), PX, BY+352, {size:12, color:th.muted, weight:700}); this.text(String(g.state.best), PX, BY+372, {size:14, color:th.accent}); }
    if(daily){ this.text(this.t('dayTag'), PX, BY+406, {size:12, color:th.warn, weight:800}); this.text(daily.label, PX, BY+426, {size:16, color:th.warn}); }
  },
});
// холд — отдельной клавишей/кнопкой (движок не маппит C)
// Реклама за награду (только на площадках с рекламой; на сайте пунктов нет): «ещё один шанс» раз за партию
// и бонус в меню паузы — убрать 2 нижних ряда (если стакан не пуст). Награда — только по досмотру ролика.
g.useRewardedContinue({ revive(){ if(stack) stack.revive(); } });
g.useRewardedBonus({ key:'rwRows', scene:'pause', label:()=>g.t('rwRows'),
  available(){ return !!stack && stack.filledRows()>=3; }, grant(){ if(stack) stack.clearBottom(2); } });
// P / Esc на паузе — назад в игру
g.scenes.pause.press=function(a){ if(a==='pause') this.goto('play',{resume:true}); };
// пауза с тач-кнопки
(function(){ const pb=document.querySelector('[data-pause]'); if(!pb) return; const h=e=>{ if (!Arcade.touchOk(e)) return; if(g._sceneName==='play') g.pause(); else if(g._sceneName==='pause') g.goto('play',{resume:true}); };
  pb.addEventListener('touchstart',h,{passive:false}); pb.addEventListener('mousedown',h); })();
addEventListener('keydown', e=>{ if((e.code==='KeyC'||e.code==='ShiftLeft'||e.code==='ShiftRight') && g._sceneName==='play' && stack){ stack.hold(); e.preventDefault(); } });

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#16281a;color:#eef2f8;font-family:Inter,system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;min-height:100dvh;user-select:none;overflow:hidden}
.wrap{position:relative;width:min(96vw,620px);margin-top:10px}
canvas{width:100%;display:block;border:1px solid #243824;border-radius:10px;background:#16281a}
.pad{width:min(96vw,620px);margin:10px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px}
.pad button{height:54px;background:#1a2a1c;border:1px solid #2c422c;border-radius:12px;color:#eef2f8;font-size:20px;font-weight:800}
.pad button:active{background:#243824}
.foot{color:#5a7a5a;font-size:11px;margin:2px 12px 16px;text-align:center;max-width:620px}
a.back{position:fixed;left:10px;top:8px;color:#5a7a5a;font-size:12px;text-decoration:none}
@media(min-width:760px){.pad{display:none}}
</style></head><body>
<a class="back" href="../">← Каталог</a>
<div class="wrap"><canvas id="c" width="960" height="600" aria-label="КОЛОБОК"></canvas></div>
<div class="pad">
  <button data-d="L">◀</button><button data-d="R">▶</button>
  <button data-d="U">⤒</button><button id="bUse">✦</button>
</div>
<div class="foot"><b>КОЛОБОК</b> · ◀▶ катись, ↑/W/пробел — прыжок, E/↓/✦ — применить, P — пауза · L язык, T тема, M звук.</div>
<script src="./engine.js"></script>
<script src="./js/music.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/game.js"></script>
<script src="./js/classic.js"></script>
<script src="./js/modern.js"></script>
<script>
'use strict';
var STR={
 ru:{play:'Играть',language:'Язык',theme:'Тема',sound:'Звук',on:'вкл',off:'выкл',score:'Счёт',level:'Ур.',best:'Рекорд',win:'ДОМА!',gameover:'КОНЕЦ',pause:'ПАУЗА',resume:'Продолжить',menu:'В меню',tapstart:'пробел / тап',title:'КОЛОБОК',subtitle:'Катись домой · собирай ягоды'},
 en:{play:'Play',language:'Language',theme:'Theme',sound:'Sound',on:'on',off:'off',score:'Score',level:'Lvl',best:'Best',win:'HOME!',gameover:'GAME OVER',pause:'PAUSE',resume:'Resume',menu:'Menu',tapstart:'space / tap',title:'KOLOBOK',subtitle:'Roll home · collect berries'}
};
var g=Arcade.createGame({canvas:'#c',width:960,height:600,gameId:'kolobok',strings:STR,theme:'modern'});
g.input.bindDpad(document.querySelector('.pad'));
g.fit(620); addEventListener('resize',function(){g.fit(620);});
var game=null;
function bp(f,d,t,v){ g.audio.beep(f,d,t,v); }
function mkGame(){ return KOLOBOK.Game({hi:g.state.best,onEvent:function(type){
  if(type==='jump') bp(520,.05,'square',.05);
  else if(type==='berry'||type==='pickup') bp(1100,.06,'triangle');
  else if(type==='plank'||type==='warp') bp(700,.08,'square',.05);
  else if(type==='splash') bp(300,.1,'sawtooth',.06);
  else if(type==='door') bp(1300,.12,'triangle');
  else if(type==='nope') bp(180,.06,'square',.05);
  else if(type==='hurt') bp(200,.12,'sawtooth',.07);
  else if(type==='gameover'){ if(game) g.state.score=game.state().score; g.gameover(); }
  else if(type==='win'){ if(game) g.state.score=game.state().score; g.win(); }
}}); }
function render(ctx){ var st=game?game.state():null; if(!st){ g.clear(); return; }
  (g.themeName==='modern'?KOLOBOK.modern:KOLOBOK.classic).draw(ctx,st); }
g.useStandardScreens({title:'КОЛОБОК',subtitle:STR.ru.subtitle,lives:0});
g.scene('play',{realtime:true,
  enter:function(d){ if(!(d&&d.resume)){ game=mkGame(); game.start(); } },
  press:function(a){ if(!game) return; if(a==='pause'){ this.pause(); return; } if(a==='up'){ game.jump(); return; } if(a==='down'){ game.use(); return; } },
  update:function(dt){ if(!game) return; var dx=this.input.dir.x; game.setHeld('left',dx<0); game.setHeld('right',dx>0); if(window.KOLOBOK&&KOLOBOK.i18n) KOLOBOK.i18n.lang=g.i18n.lang; game.update(dt); g.state.score=game.state().score; },
  draw:function(ctx){ render(ctx); }
});
addEventListener('keydown',function(e){ if(g._sceneName!=='play'||!game) return;
  if(e.code==='Space'||e.code==='KeyW'){ game.jump(); e.preventDefault(); }
  else if(e.code==='KeyE'||e.code==='KeyS'){ game.use(); e.preventDefault(); }
});
(function(){ var ub=document.getElementById('bUse'); if(!ub) return;
  var use=function(e){ e.preventDefault(); if(g._sceneName==='play'&&game) game.use(); };
  ub.addEventListener('touchstart',use,{passive:false}); ub.addEventListener('mousedown',use);
})();
g.start('title');
</script></body></html>

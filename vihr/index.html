<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#05060a" />
<meta name="color-scheme" content="dark" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23EA6A12'/%3E%3Cg transform='translate(9,9) scale(0.72)' fill='%2316181D'%3E%3Crect x='12' y='13' width='9' height='38' rx='4.5'/%3E%3Crect x='43' y='13' width='9' height='38' rx='4.5'/%3E%3Cpath d='M34 23 L24 35 H31 L28 45 L41 31 H34 Z'/%3E%3C/g%3E%3C/svg%3E">
<title>ВИХРЬ · Над полем боя — HTML5</title>
<meta name="description" content="ВИХРЬ — оригинальный вертолётный шутер студии «Гефест» на фреймворке Гефест Arcade: четыре зоны, боссы, бомбы. Темы retro (8-бит) / modern, RU/EN, офлайн." />
<link rel="stylesheet" href="css/style.css" />
<style>
  /* canvas движка (меню/пауза/финалы) — поверх игрового кадра */
  canvas.arcade-host{position:absolute; left:0; top:0; width:100%; height:100%; display:block; z-index:3; border-radius:inherit}
  a.back{color:var(--dim); font-size:12px; text-decoration:none; margin-right:14px; white-space:nowrap}
  a.back:hover{color:var(--ink)}
  header.bar{align-items:center}
</style>
</head>
<body class="retro">
<div id="app">
  <header class="bar">
    <a class="back" href="../">← Каталог</a>
    <div class="brand">
      <b>ВИХРЬ</b>
      <span data-ru="ВИХРЬ · ГЕФЕСТ 1988 · ВЕБ-ОРИГИНАЛ" data-en="ВИХРЬ · ГЕФЕСТ 1988 · WEB ORIGINAL">ВИХРЬ · ГЕФЕСТ 1988 · ВЕБ-ОРИГИНАЛ</span>
    </div>
    <div class="chips">
      <span class="chip optional" id="chip-mode"><span class="dot"></span><b>8-БИТ</b> ГРАФИКА</span>
      <span class="chip optional"><span class="dot"></span><b>RU</b> <span data-ru="ЯЗЫК" data-en="LANGUAGE">ЯЗЫК</span></span>
      <span class="chip warn optional" id="chip-audio"><span class="dot"></span><b>M</b> <span data-ru="ЗВУК" data-en="SOUND">ЗВУК</span></span>
    </div>
  </header>

  <div id="mobile-hero">
    <b>ВИХРЬ</b>
    <span data-ru="ВИХРЬ · АРКАДА 1988" data-en="ВИХРЬ · ARCADE 1988">ВИХРЬ · АРКАДА 1988</span>
  </div>

  <div id="stage">
    <div id="frame">
      <canvas id="game" width="320" height="224" aria-label="ВИХРЬ — игра"></canvas>
      <div id="crt"></div>
      <div id="scan"></div>
    </div>
  </div>

  <div id="mobile-hint" data-ru="ВЕДИТЕ ПАЛЬЦЕМ · ОГОНЬ АВТОМАТИЧЕСКИ · ПАУЗА — ПРАВЫЙ ВЕРХНИЙ УГОЛ" data-en="DRAG TO FLY · AUTO-FIRE · PAUSE — TOP-RIGHT CORNER">ВЕДИТЕ ПАЛЬЦЕМ · ОГОНЬ АВТОМАТИЧЕСКИ · ПАУЗА — ПРАВЫЙ ВЕРХНИЙ УГОЛ</div>

  <footer class="bar">
    <div class="wide">
      <span class="key"><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> / <kbd>WASD</kbd> <span data-ru="движение" data-en="move">движение</span></span>
      <span class="sep">·</span>
      <span class="key"><kbd>Space</kbd> <span data-ru="огонь" data-en="fire">огонь</span></span>
      <span class="sep">·</span>
      <span class="key"><kbd>B</kbd> <span data-ru="бомба" data-en="bomb">бомба</span></span>
      <span class="sep">·</span>
      <span class="key"><kbd>P</kbd> <span data-ru="пауза" data-en="pause">пауза</span></span>
    </div>
    <div>
      <span class="key"><kbd>G</kbd> <span data-ru="графика" data-en="graphics">графика</span></span>
      <span class="sep">·</span>
      <span class="key"><kbd>L</kbd> <span data-ru="язык" data-en="language">язык</span></span>
      <span class="sep">·</span>
      <span class="key"><kbd>M</kbd> <span data-ru="музыка" data-en="sound">музыка</span></span>
      <span class="sep">·</span>
      <span class="key"><kbd>Enter</kbd> <span data-ru="старт" data-en="start">старт</span></span>
    </div>
  </footer>
</div>
<div id="toast"></div>
<pre id="err"></pre>
<pre id="testout"></pre>
<script src="./engine.js"></script>
<script src="./js/host.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
<script>
'use strict';
/* ВИХРЬ на движке v2 — «оболочка» (js/host.js): родные src/audio.js + src/game.js (логика, зоны,
   баланс, рендеры 8-бит = retro и современный = modern, своя музыка SWAudio) работают без изменений,
   движок даёт меню/паузу/финалы/тему/язык/звук/рекорд. Связь — через window.__SW. */
(function () {
  var SW = window.__SW;
  var STR = {
    ru: { play: 'Играть', language: 'Язык', theme: 'Тема', sound: 'Звук', on: 'вкл', off: 'выкл', score: 'Счёт', level: 'Зона', best: 'Рекорд',
          win: 'МИССИЯ ВЫПОЛНЕНА', gameover: 'ВЕРТОЛЁТ ПОТЕРЯН', pause: 'ПАУЗА', resume: 'Продолжить', menu: 'В меню', tapstart: 'пробел / тап',
          title: 'ВИХРЬ', subtitle: 'Над полем боя · вертолётный шутер', controls: 'Управление' },
    en: { play: 'Play', language: 'Language', theme: 'Theme', sound: 'Sound', on: 'on', off: 'off', score: 'Score', level: 'Zone', best: 'Best',
          win: 'MISSION COMPLETE', gameover: 'HELICOPTER DOWN', pause: 'PAUSE', resume: 'Resume', menu: 'Menu', tapstart: 'space / tap',
          title: 'ВИХРЬ', subtitle: 'Above the battlefield · helicopter shooter', controls: 'Controls' }
  };
  var MODE = { title: 'title', controls: 'sub', play: 'play', clear: 'play', pause: 'paused', gameover: 'gameover', victory: 'win' };
  ArcadeHost.mount({
    gameId: 'vihr', mount: '#frame', width: 520, height: 364, strings: STR, extra: 'controls',
    adapter: {
      mode: function () { return MODE[SW.G.state] || 'play'; },
      start: function () { SW.Sound.unlock(); SW.newGame(); },
      toTitle: function () { SW.toTitle(); },
      pause: function () { SW.pauseGame(); },
      resume: function () { SW.resumeGame(); },
      openSub: function () { SW.G.state = 'controls'; },
      score: function () { return SW.G.score; },
      best: function () { return SW.G.hi; },
      gfx: function () { return SW.GFX(); },
      setGfx: function (v) { SW.setGfx(v, true); },
      lang: function () { return SW.LANG(); },
      setLang: function (v) { SW.CFG.lang = v; SW.setLang(v, true); },
      setSound: function (on) { if (SW.CFG.sound !== on) SW.toggleSound(); }
    }
  });
})();
</script>
</body>
</html>

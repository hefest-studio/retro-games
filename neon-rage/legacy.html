<!DOCTYPE html>
<html lang="ru" data-gfx="retro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="color-scheme" content="dark" />
<title>НЕОН × ЯРОСТЬ — HTML5 (legacy)</title>
<meta name="description" content="Оригинальный браузерный beat-em-up: оригинал «Гефест», неоновый ремастер. 8-битная и современная графика, оригинальная чиптюн-музыка, русский и английский языки. Один HTML-файл." />
<meta name="theme-color" content="#07060f" />
<style>
/* ============================================================
   НЕОН × ЯРОСТЬ: NEON RAGE — оболочка страницы
   ------------------------------------------------------------
   Один полноэкранный <canvas id="stage"> в «тёмном неоновом зале».
   Без внешних шрифтов, картинок и ассетов — только CSS.

   Что здесь есть:
   • сцена 100vw × 100vh, без прокрутки и выделения текста;
   • фон-«комната»: rich neon glow для data-gfx="modern",
     тёмный CRT с скан-линиями для data-gfx="retro";
   • лёгкая виньетка поверх сцены (не мешает кадру);
   • #err — красный monospace-оверлей (main включает style.display);
   • #testout — скрытый вывод автотестов;
   • #hint — стеклянный тост снизу по центру, виден только с .show;
   • тач-управление (#touch): крестовина слева + 2×2 экшена справа,
     только при body.touch, таргеты 52–64 px, safe-area iOS;
   • @media (prefers-reduced-motion: reduce) — без анимации фона.
   ============================================================ */

/* ---------- корень и фон ---------- */
:root {
  color-scheme: dark;
  --nr-bg: #07060f;
  --nr-ink: #f4f0ff;
  --nr-dim: #7d86c4;
  --nr-magenta: #ff2e88;
  --nr-cyan: #22e6ff;
  --nr-lime: #b6ff3a;
  --nr-amber: #ffb300;
  --nr-btn: 64px;
  --nr-safe-b: env(safe-area-inset-bottom, 0px);
  --nr-safe-l: env(safe-area-inset-left, 0px);
  --nr-safe-r: env(safe-area-inset-right, 0px);
  --nr-safe-t: env(safe-area-inset-top, 0px);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--nr-bg);
  overscroll-behavior: none;
}

body {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--nr-ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

::selection {
  background: rgba(34, 230, 255, 0.35);
  color: #ffffff;
}

/* «неоновая комната» лежит под canvas — видна в letterbox и до первого кадра */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-color: #07060f;
}

/* ---------- modern: объёмный неон, градиенты, медленная «аврора» ---------- */
html[data-gfx="modern"] body::before {
  background-image:
    radial-gradient(58% 46% at 16% 8%, rgba(255, 46, 136, 0.22), transparent 72%),
    radial-gradient(52% 44% at 84% 14%, rgba(34, 230, 255, 0.18), transparent 72%),
    radial-gradient(66% 56% at 50% 112%, rgba(182, 255, 58, 0.10), transparent 72%),
    linear-gradient(158deg, #0a0718 0%, #07060f 44%, #0b0820 100%);
  background-size: 160% 160%, 160% 160%, 160% 160%, 100% 100%;
  background-position: 0% 0%, 100% 0%, 50% 100%, 0 0;
  animation: nr-aurora 26s ease-in-out infinite alternate;
}

html[data-gfx="modern"] body {
  background:
    radial-gradient(1000px 640px at 50% -12%, rgba(255, 46, 136, 0.12), transparent 66%),
    #07060f;
}

@keyframes nr-aurora {
  from { background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; }
  to   { background-position: 22% 12%, 78% 16%, 44% 88%, 0 0; }
}

/* ---------- retro: тёмный CRT, скан-линии, глухие тени ---------- */
html[data-gfx="retro"] body {
  background-color: #05030d;
}

html[data-gfx="retro"] body::before {
  background-image:
    repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.26) 0,
      rgba(0, 0, 0, 0.26) 1px,
      rgba(255, 255, 255, 0.012) 1px,
      rgba(255, 255, 255, 0.012) 2px
    ),
    radial-gradient(70% 46% at 50% -8%, rgba(34, 230, 255, 0.07), transparent 70%),
    radial-gradient(80% 60% at 50% 116%, rgba(255, 46, 136, 0.06), transparent 70%),
    linear-gradient(180deg, #05030d 0%, #08040f 55%, #04020a 100%);
}

/* ---------- сцена ---------- */
#stage {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  padding: 0;
  border: 0;
  outline: none;
  background: transparent;
  touch-action: none;
  cursor: default;
  -webkit-user-select: none;
  user-select: none;
  -webkit-user-drag: none;
  -webkit-tap-highlight-color: transparent;
}


#stage:focus,
#stage:focus-visible {
  outline: none;
}

/* ---------- виньетка поверх кадра: премиальная глубина ---------- */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    radial-gradient(132% 96% at 50% 44%, transparent 62%, rgba(2, 1, 8, 0.24) 100%),
    linear-gradient(to bottom, rgba(2, 1, 8, 0.16) 0%, transparent 12%, transparent 88%, rgba(2, 1, 8, 0.20) 100%);
}

html[data-gfx="modern"] body::after {
  background:
    radial-gradient(132% 96% at 50% 44%, transparent 64%, rgba(2, 1, 8, 0.26) 100%),
    radial-gradient(80% 44% at 50% 0%, rgba(34, 230, 255, 0.045), transparent 70%),
    linear-gradient(to bottom, rgba(2, 1, 8, 0.14) 0%, transparent 14%, transparent 86%, rgba(2, 1, 8, 0.20) 100%);
}

/* ---------- тач-управление ---------- */
#touch {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 4;
  display: none;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding:
    0 max(14px, var(--nr-safe-r))
    calc(14px + var(--nr-safe-b))
    max(14px, var(--nr-safe-l));
  pointer-events: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

body.touch.in-game #touch {
  display: flex;
}

/* крестовина: 3×3 grid, кнопки в форме креста */
.dpad {
  display: grid;
  grid-template-columns: repeat(3, var(--nr-btn));
  grid-template-rows: repeat(3, var(--nr-btn));
  gap: 6px;
  pointer-events: none;
}

.dpad .tbtn {
  width: var(--nr-btn);
  height: var(--nr-btn);
}

.dpad-up    { grid-area: 1 / 2 / 2 / 3; }
.dpad-left  { grid-area: 2 / 1 / 3 / 2; }
.dpad-right { grid-area: 2 / 3 / 3 / 4; }
.dpad-down  { grid-area: 3 / 2 / 4 / 3; }

/* экшены: 2×2, спец — звезда в акценте */
.tacts {
  display: grid;
  grid-template-columns: repeat(2, var(--nr-btn));
  grid-template-rows: repeat(2, var(--nr-btn));
  gap: 8px;
  pointer-events: none;
}

.tacts .tbtn {
  width: var(--nr-btn);
  height: var(--nr-btn);
}

.act-punch   { grid-area: 1 / 1 / 2 / 2; }
.act-kick    { grid-area: 1 / 2 / 2 / 3; }
.act-jump    { grid-area: 2 / 1 / 3 / 2; }
.act-special { grid-area: 2 / 2 / 3 / 3; }

/* общий вид кнопки — стекло с неоновой кромкой */
.tbtn {
  -webkit-appearance: none;
  appearance: none;
  display: grid;
  place-items: center;
  margin: 0;
  padding: 0;
  border: 2px solid rgba(34, 230, 255, 0.42);
  border-radius: 18px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0) 48%),
    rgba(9, 7, 22, 0.56);
  color: var(--nr-ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: clamp(18px, calc(var(--nr-btn) * 0.30), 22px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.02em;
  text-align: center;
  text-shadow: 0 0 8px rgba(34, 230, 255, 0.75), 0 1px 0 rgba(0, 0, 0, 0.65);
  box-shadow:
    inset 0 0 14px rgba(34, 230, 255, 0.12),
    0 4px 16px rgba(0, 0, 0, 0.48);
  -webkit-backdrop-filter: blur(7px) saturate(1.2);
  backdrop-filter: blur(7px) saturate(1.2);
  pointer-events: auto;
  cursor: pointer;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition:
    transform 0.08s ease,
    background-color 0.08s ease,
    border-color 0.08s ease,
    box-shadow 0.12s ease,
    color 0.08s ease;
}

.tbtn > span {
  font-size: 0.56em;
  font-weight: 600;
  opacity: 0.72;
  margin-left: 0.16em;
}

/* стрелки крестовины — крупные, «пиксельные» */
.dpad .tbtn {
  border-radius: 16px;
  font-size: clamp(20px, calc(var(--nr-btn) * 0.38), 30px);
  text-shadow: 0 0 10px rgba(34, 230, 255, 0.85), 0 1px 0 rgba(0, 0, 0, 0.7);
}

.act-jump {
  font-size: clamp(11px, calc(var(--nr-btn) * 0.20), 14px);
  letter-spacing: 0.06em;
}

/* спецприём: акцент маджента/янтарь, звезда */
.act-special {
  border-color: rgba(255, 46, 136, 0.66);
  color: #ffd9ea;
  font-size: clamp(22px, calc(var(--nr-btn) * 0.36), 30px);
  text-shadow: 0 0 12px rgba(255, 46, 136, 0.95), 0 1px 0 rgba(0, 0, 0, 0.7);
  box-shadow:
    inset 0 0 16px rgba(255, 46, 136, 0.18),
    0 0 18px rgba(255, 46, 136, 0.22),
    0 4px 16px rgba(0, 0, 0, 0.5);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0) 48%),
    rgba(30, 7, 26, 0.58);
}

.act-special > span {
  color: var(--nr-amber);
  text-shadow: 0 0 8px rgba(255, 179, 0, 0.9);
  opacity: 0.95;
}

/* нажатие: вспыхивает неоном */
.tbtn:active,
.tbtn.active,
.tbtn.is-down {
  transform: translateY(1px) scale(0.96);
  background: rgba(34, 230, 255, 0.30);
  border-color: var(--nr-cyan);
  color: #ffffff;
  box-shadow:
    0 0 26px rgba(34, 230, 255, 0.55),
    inset 0 0 20px rgba(34, 230, 255, 0.38);
}

.act-special:active,
.act-special.active,
.act-special.is-down {
  background: rgba(255, 46, 136, 0.36);
  border-color: var(--nr-magenta);
  color: #ffffff;
  box-shadow:
    0 0 30px rgba(255, 46, 136, 0.66),
    inset 0 0 20px rgba(255, 46, 136, 0.42);
}

.tbtn:focus-visible {
  outline: 2px solid var(--nr-lime);
  outline-offset: 3px;
}

/* retro-кнопки: жёстче, квадратнее, «железные» */
html[data-gfx="retro"] .tbtn {
  border-radius: 6px;
  background: rgba(14, 10, 30, 0.80);
  box-shadow:
    4px 4px 0 rgba(0, 0, 0, 0.62),
    inset 0 0 0 2px rgba(0, 0, 0, 0.32);
  text-shadow: none;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}

html[data-gfx="retro"] .dpad .tbtn {
  border-radius: 4px;
}

html[data-gfx="retro"] .act-special {
  border-color: var(--nr-amber);
  color: #ffe9b0;
  background: rgba(38, 20, 6, 0.82);
  box-shadow:
    4px 4px 0 rgba(0, 0, 0, 0.62),
    inset 0 0 0 2px rgba(255, 179, 0, 0.22);
}

html[data-gfx="retro"] .tbtn:active,
html[data-gfx="retro"] .tbtn.active,
html[data-gfx="retro"] .tbtn.is-down {
  background: rgba(34, 230, 255, 0.36);
  box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7);
}

/* ---------- тост-подсказка ---------- */
#hint {
  position: fixed;
  left: 50%;
  bottom: calc(18px + var(--nr-safe-b));
  z-index: 6;
  max-width: min(92vw, 620px);
  margin: 0;
  padding: 9px 16px;
  border: 1px solid rgba(34, 230, 255, 0.34);
  border-radius: 999px;
  background: rgba(12, 10, 28, 0.76);
  color: var(--nr-ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 13px;
  line-height: 1.35;
  letter-spacing: 0.01em;
  text-align: center;
  text-shadow: 0 0 10px rgba(34, 230, 255, 0.35);
  box-shadow:
    0 8px 30px rgba(0, 0, 0, 0.55),
    0 0 0 1px rgba(255, 255, 255, 0.04) inset,
    0 0 22px rgba(34, 230, 255, 0.10);
  -webkit-backdrop-filter: blur(10px) saturate(1.25);
  backdrop-filter: blur(10px) saturate(1.25);
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, 10px);
  pointer-events: none;
  transition:
    opacity 0.22s ease,
    transform 0.22s ease,
    visibility 0.22s ease;
  will-change: opacity, transform;
}

#hint.show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}

/* на тач-экранах тост поднимается над кнопками */
body.touch #hint {
  bottom: calc(14px + var(--nr-safe-b) + var(--nr-btn) * 3 + 22px);
}

/* ---------- оверлей ошибки (main выставляет style.display) ---------- */
#err {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  margin: 0;
  padding:
    calc(18px + var(--nr-safe-t))
    max(18px, var(--nr-safe-r))
    calc(18px + var(--nr-safe-b))
    max(18px, var(--nr-safe-l));
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  background:
    radial-gradient(90% 70% at 50% 0%, rgba(255, 46, 136, 0.14), transparent 70%),
    rgba(16, 2, 9, 0.95);
  color: #ff5c7a;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
  text-shadow: 0 0 10px rgba(255, 46, 136, 0.35);
  -webkit-user-select: text;
  user-select: text;
}


/* ---------- скрытый отладочный вывод ---------- */
#testout {
  display: none !important;
  position: absolute;
  left: -9999px;
  top: -9999px;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: pre;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 1px;
  color: transparent;
  pointer-events: none;
}

/* ---------- «JS выключен» ---------- */
.noscript {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  padding: 28px;
  background:
    radial-gradient(70% 52% at 50% 38%, rgba(255, 46, 136, 0.16), transparent 72%),
    rgba(7, 6, 15, 0.97);
  color: var(--nr-ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 16px;
  line-height: 1.5;
  letter-spacing: 0.02em;
  text-align: center;
  text-shadow:
    0 0 14px rgba(34, 230, 255, 0.55),
    0 0 28px rgba(255, 46, 136, 0.35);
}

/* ---------- адаптив: портрет, ландшафт, узкие экраны ---------- */
@media (orientation: portrait) and (max-width: 620px) {
  :root {
    --nr-btn: 54px;
  }

  .dpad {
    gap: 5px;
  }

  .tacts {
    gap: 6px;
  }

  #touch {
    padding-left: max(10px, var(--nr-safe-l));
    padding-right: max(10px, var(--nr-safe-r));
    padding-bottom: calc(12px + var(--nr-safe-b));
  }
}

@media (orientation: landscape) and (max-height: 460px) {
  :root {
    --nr-btn: 52px;
  }

  #touch {
    padding-bottom: calc(8px + var(--nr-safe-b));
  }

  body.touch #hint {
    bottom: calc(8px + var(--nr-safe-b) + var(--nr-btn) * 3 + 14px);
    font-size: 11px;
    padding: 6px 12px;
  }
}

@media (max-width: 380px) {
  :root {
    --nr-btn: 52px;
  }

  .dpad {
    gap: 4px;
  }

  .tacts {
    gap: 5px;
  }

  #touch {
    padding-left: max(8px, var(--nr-safe-l));
    padding-right: max(8px, var(--nr-safe-r));
  }
}

@media (hover: none) and (pointer: coarse) {
  #stage {
    cursor: default;
  }
}

/* ---------- уважение к reduced-motion ---------- */
@media (prefers-reduced-motion: reduce) {
  html[data-gfx="modern"] body::before {
    animation: none !important;
  }

  #hint,
  .tbtn {
    transition-duration: 0.01ms !important;
  }

  body::after {
    background:
      radial-gradient(132% 96% at 50% 44%, transparent 62%, rgba(2, 1, 8, 0.24) 100%);
  }
}


/* ---------- тач-пауза: доступна на телефоне всегда ---------- */
#tpause {
  display: none;
}

body.touch.pausable #tpause {
  display: grid;
  place-items: center;
  position: fixed;
  z-index: 30;
  left: 50%;
  bottom: calc(10px + var(--nr-safe-b));
  transform: translateX(-50%);
  width: 46px;
  height: 32px;
  padding: 0;
  border: 1px solid rgba(244, 240, 255, 0.22);
  border-radius: 10px;
  background: rgba(9, 7, 22, 0.52);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  color: rgba(244, 240, 255, 0.72);
  font: 800 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  letter-spacing: 0.12em;
  text-shadow: 0 0 8px rgba(34, 230, 255, 0.6);
  cursor: pointer;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

body.touch #tpause:active {
  color: #fff;
  border-color: rgba(34, 230, 255, 0.72);
  background: rgba(12, 10, 30, 0.78);
}
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720" aria-label="НЕОН × ЯРОСТЬ: NEON RAGE — игра"></canvas>

<div id="touch" aria-hidden="true">
  <div class="dpad">
    <button class="tbtn dpad-up" data-hold="up" type="button" aria-label="Вверх">▲</button>
    <button class="tbtn dpad-left" data-hold="left" type="button" aria-label="Влево">◀</button>
    <button class="tbtn dpad-right" data-hold="right" type="button" aria-label="Вправо">▶</button>
    <button class="tbtn dpad-down" data-hold="down" type="button" aria-label="Вниз">▼</button>
  </div>
  <div class="tacts">
    <button class="tbtn act-special" data-press="special" type="button" aria-label="Ярость">★<span>L</span></button>
    <button class="tbtn act-punch" data-press="punch" type="button" aria-label="Удар">J</button>
    <button class="tbtn act-kick" data-press="kick" type="button" aria-label="Пинок">K</button>
    <button class="tbtn act-jump" data-press="jump" type="button" aria-label="Прыжок">SPACE</button>
  </div>
</div>

<button id="tpause" type="button" aria-label="Пауза">II</button>

<div id="hint" role="status" aria-live="polite"></div>
<pre id="err"></pre>
<pre id="testout"></pre>
<noscript><p class="noscript">Для игры нужен JavaScript.</p></noscript>
<script>
/* НЕОН × ЯРОСТЬ: NEON RAGE — сгенерировано tools/build.mjs, не редактировать вручную */
'use strict';
/* ==== src/font.js ==== */
/* ============================================================
   НЕОН × ЯРОСТЬ — пиксельный моноширинный шрифт 6×8 с кириллицей
   ------------------------------------------------------------
   Знакоместо 6×8: 5 px на глиф (колонки 0–4) + 1 px пробела (колонка 5).
   Заглавные и цифры занимают 7 px (строки 0–6), строчные — 5 px
   x-height (строки 2–6), выносные элементы — строки 6–7.
   В байте строки: бит 5 = левый пиксель, бит 0 = правый (6 колонок).

   API (docs/CONTRACT.md §1):
     NR_FONT.W, NR_FONT.H      — размер знакоместа (6, 8)
     NR_FONT.glyphs            — { 'A': [b0..b7], ... }
     NR_FONT.has(ch)           — есть ли глиф

    };
    try {
      osc.start(t);
      osc.stop(t + d + 0.03);
    } catch (e) {
      if (!entry.dead) {
        entry.dead = true;
        if (entry.counted) { entry.counted = false; if (activeVoices > 0) { activeVoices--; } }
      }
      osc.onended = null;
      try { osc.disconnect(); } catch (e2) { /* ignore */ }
      disconnect(amp); disconnect(filt); disconnect(pan);
    }
  }

  function noiseHit(dest, t, dur, type, f0, f1, q, peak, pan) {
    var ctx = state.ctx;
    if (!ctx || !dest || !state.noise || !isFinite(peak) || peak <= 0) { return; }
    if (state.stalled || activeNoise >= MAX_NOISE) { return; }
    if (voiceRegistry.length > 192) { sweepVoices(true); }
    var d = clamp(dur, 0.02, 3), src, filt, amp, panNode = null;
    try { src = ctx.createBufferSource(); filt = ctx.createBiquadFilter(); amp = ctx.createGain(); }
    catch (e) { return; }
    try { src.buffer = state.noise; } catch (e) { /* ignore */ }
    try {
      filt.type = type || 'bandpass';
      filt.frequency.setValueAtTime(clamp(f0 || 1200, 40, 18000), t);
      if (f1 && f1 > 0) { filt.frequency.exponentialRampToValueAtTime(clamp(f1, 40, 18000), t + d); }
      filt.Q.value = q === undefined ? 0.8 : clamp(q, 0.0001, 24);
    } catch (e) { /* ignore */ }
    var tail = dest;
    if (pan && typeof ctx.createStereoPanner === 'function') {
      try { panNode = ctx.createStereoPanner(); panNode.pan.value = clamp(pan, -1, 1); if (connect(panNode, tail)) { tail = panNode; } }
      catch (e) { panNode = null; }
    }
    if (!connect(amp, tail) || !connect(src, filt) || !connect(filt, amp)) {
      disconnect(src); disconnect(filt); disconnect(amp); disconnect(panNode);
      return;
    }
    try {
      var g = amp.gain, top = clamp(peak, 0.0002, 1.2);
      g.setValueAtTime(0.0001, t);
      g.linearRampToValueAtTime(top, t + 0.003);
      g.exponentialRampToValueAtTime(0.0004, t + d);
    } catch (e) { /* ignore */ }
    activeNoise++;
    var nEntry = { kind: 'noise', until: t + d + 0.12, nodes: [src, filt, amp, panNode], dead: false, counted: true };
    voiceRegistry.push(nEntry);
    src.onended = function () {
      if (nEntry.dead) { return; }
      nEntry.dead = true;
      if (nEntry.counted) { nEntry.counted = false; if (activeNoise > 0) { activeNoise--; } }
      disconnect(src); disconnect(filt); disconnect(amp); disconnect(panNode);
    };
    try { src.start(t); src.stop(t + d + 0.04); }
    catch (e) {
      if (!nEntry.dead) {
        nEntry.dead = true;
        if (nEntry.counted) { nEntry.counted = false; if (activeNoise > 0) { activeNoise--; } }
      }
      src.onended = null;
      disconnect(src); disconnect(filt); disconnect(amp); disconnect(panNode);
    }
  }

  /* ---------- chip instruments (dry, 4-channel 8-bit feel) ---------- */
  function chipLead(dest, t, hz, dur, vel, song) {
    voice(dest, t, hz, dur, song.leadVol * vel, {
      wave: pulseWave(song.leadDuty), attack: 0.005, release: 0.035,
      pluck: true, decay: Math.min(0.14, dur * 0.5)
    });
  }
  function chipHarm(dest, t, hz, dur, vel, song) {
    voice(dest, t, hz, Math.max(0.05, dur * 0.8), song.harmVol * vel, {
      wave: pulseWave(song.harmDuty), attack: 0.004, release: 0.02, pluck: true
    });
  }
  function chipBass(dest, t, hz, dur, vel, song) {
    voice(dest, t, hz, dur * 0.94, song.bassVol * vel, {
      type: 'triangle', attack: 0.006, release: 0.04
    });
  }

  /* ---------- synth instruments (detuned saws, filters, delay) ---------- */
  function synthLead(dest, t, hz, dur, vel, song) {
    var peak = song.leadVol * 0.62 * vel;
    var cut = 900 + state.intensity * 2600 + (state.ducked ? -500 : 0);
    voice(dest, t, hz, dur, peak * 0.62, {
      type: 'sawtooth', detune: -7, attack: 0.012, release: 0.05, pan: -0.2,
      filter: { type: 'lowpass', from: cut * 1.6, to: cut * 0.8, q: 1.1 }
    });
    voice(dest, t, hz, dur, peak * 0.62, {
      type: 'sawtooth', detune: 7, attack: 0.012, release: 0.05, pan: 0.2,
      filter: { type: 'lowpass', from: cut * 1.6, to: cut * 0.85, q: 1.1 }
    });
    voice(dest, t, hz * 0.5, dur, peak * 0.26, { type: 'triangle', attack: 0.01, release: 0.06 });
  }
  function synthHarm(dest, t, hz, dur, vel, song, pan) {
    var cut = 1200 + state.intensity * 2800 + (state.ducked ? -600 : 0);
    voice(dest, t, hz, dur, song.harmVol * 1.1 * vel, {
      type: 'sawtooth', attack: 0.004, release: 0.02, pluck: true, pan: pan || 0.28,
      filter: { type: 'lowpass', from: cut * 1.5, to: cut, q: 2.2 }
    });
  }
  function synthBass(dest, t, hz, dur, vel, song) {
    var cut = 260 + state.intensity * 260;
    voice(dest, t, hz, dur * 0.96, song.bassVol * 0.82 * vel, {
      type: 'sawtooth', attack: 0.005, release: 0.04,
      filter: { type: 'lowpass', from: cut * 2.4, to: cut, q: 2.6 }
    });
    voice(dest, t, hz * 0.5, dur * 0.96, song.bassVol * 0.42 * vel, {
      type: 'triangle', attack: 0.005, release: 0.04
    });
  }
  function synthPad(dest, t, hz, dur, vel) {
    var cut = 620 + state.intensity * 1500 + (state.ducked ? -380 : 0);
    voice(dest, t, hz, dur, 0.028 * vel, {
      type: 'sawtooth', detune: -9, attack: 0.18, release: 0.32, pan: -0.42,
      filter: { type: 'lowpass', from: cut * 0.7, to: cut * 1.25, q: 0.7 }
    });
    voice(dest, t, hz * 1.004, dur, 0.028 * vel, {
      type: 'sawtooth', detune: 9, attack: 0.2, release: 0.32, pan: 0.42,
      filter: { type: 'lowpass', from: cut * 0.7, to: cut * 1.25, q: 0.7 }
    });
  }

  /* ---------- drums ---------- */
  function chipDrum(dest, t, lane, vol) {
    var v = clamp(vol, 0.05, 1.6);
    if (lane === 'k') {
      voice(dest, t, 152, 0.14, 0.34 * v, { type: 'sine', toHz: 48, attack: 0.002, release: 0.03 });
      noiseHit(dest, t, 0.024, 'highpass', 1800, 3600, 0.7, 0.05 * v);
    } else if (lane === 's') {
      noiseHit(dest, t, 0.12, 'bandpass', 1900, 900, 1.15, 0.2 * v);
      voice(dest, t, 196, 0.08, 0.08 * v, { type: 'triangle', toHz: 118, attack: 0.002, release: 0.02 });
    } else if (lane === 'h') {
      noiseHit(dest, t, 0.028, 'highpass', 7800, 9800, 0.7, 0.042 * v);
    } else if (lane === 'o') {
      noiseHit(dest, t, 0.13, 'highpass', 6800, 8400, 0.7, 0.038 * v);
    } else if (lane === 'c') {
      noiseHit(dest, t, 0.42, 'lowpass', 5600, 1600, 0.7, 0.1 * v, -0.2);
    } else if (lane === 't') {
      voice(dest, t, 190, 0.12, 0.18 * v, { type: 'sine', toHz: 92, attack: 0.002, release: 0.02 });
    }
  }
  function synthDrum(dest, t, lane, vol) {
    var v = clamp(vol, 0.05, 1.6);
    if (lane === 'k') {
      voice(dest, t, 190, 0.22, 0.48 * v, { type: 'sine', toHz: 42, attack: 0.002, release: 0.05 });
      noiseHit(dest, t, 0.018, 'highpass', 2600, 5200, 0.7, 0.06 * v);
    } else if (lane === 's') {
      noiseHit(dest, t, 0.16, 'bandpass', 2100, 800, 1.0, 0.24 * v);
      voice(dest, t, 214, 0.1, 0.1 * v, { type: 'triangle', toHz: 128, attack: 0.002, release: 0.03 });
    } else if (lane === 'h') {
      noiseHit(dest, t, 0.03, 'highpass', 8600, 11000, 0.6, 0.045 * v, 0.3);
    } else if (lane === 'o') {
      noiseHit(dest, t, 0.16, 'highpass', 7200, 9000, 0.6, 0.04 * v, -0.3);
    } else if (lane === 'c') {
      noiseHit(dest, t, 0.55, 'lowpass', 6400, 1400, 0.6, 0.12 * v, 0.4);
    } else if (lane === 't') {
      voice(dest, t, 210, 0.14, 0.2 * v, { type: 'sine', toHz: 86, attack: 0.002, release: 0.03 });
    }
  }

  function playDrum(dest, t, lane, song, style, scale) {
    var vol = (song.drumVol || 1) * (scale === undefined ? 1 : scale);
    if (style === 'synth') { synthDrum(dest, t, lane, vol); }
    else { chipDrum(dest, t, lane, vol); }
  }

  /* ============================================================
     6. MUSIC PLAYER + LOOKAHEAD SEQUENCER
     ============================================================ */
  function Player(id, song) {
    this.id = id;
    this.song = song;
    this.style = state.style;
    this.out = null;
    this.chipIn = null;
    this.chipOut = null;
    this.synthIn = null;
    this.synthFilter = null;
    this.synthOut = null;
    this.delay = null;
    this.fb = null;
    this.damp = null;
    this.wet = null;
    this.timer = 0;
    this.tailTimer = 0;
    this.nextTime = 0;
    this.step = 0;
    this.stopping = false;
    this.finished = false;
    this.disposed = false;
    this.fadeSec = 0.3;
  }

  Player.prototype.start = function (fadeSec) {
    var ctx = state.ctx;
    if (!ctx || this.disposed) { return false; }
    this.fadeSec = clamp(fadeSec === undefined ? 0.3 : fadeSec, 0.05, 2);
    try {
      this.out = ctx.createGain();
      this.chipIn = ctx.createGain();
      this.chipOut = ctx.createGain();
      this.synthIn = ctx.createGain();
      this.synthFilter = ctx.createBiquadFilter();
      this.synthOut = ctx.createGain();
    } catch (e) { this.dispose(); return false; }

    this.synthFilter.type = 'lowpass';
    this.synthFilter.frequency.value = synthCutoff();
    this.synthFilter.Q.value = 0.8;

    var chipTarget = this.style === 'chip' ? 1 : 0;
    var synthTarget = this.style === 'synth' ? 1 : 0;
    try {
      this.out.gain.value = 0.0001;
      this.chipIn.gain.value = 1;
      this.chipOut.gain.value = chipTarget;
      this.synthIn.gain.value = 1;
      this.synthOut.gain.value = synthTarget;
    } catch (e) { this.dispose(); return false; }

    connect(this.chipIn, this.chipOut);
    connect(this.chipOut, this.out);
    connect(this.synthIn, this.synthFilter);
    connect(this.synthFilter, this.synthOut);
    connect(this.synthOut, this.out);

    /* warm synth echo, panned wide via the wet path */
    try {
      this.delay = ctx.createDelay(1.0);
      this.delay.delayTime.value = 0.27;
      this.fb = ctx.createGain();
      this.fb.gain.value = 0.24;
      this.damp = ctx.createBiquadFilter();
      this.damp.type = 'lowpass';
      this.damp.frequency.value = 2600;
      this.wet = ctx.createGain();
      this.wet.gain.value = 0.16;
      connect(this.synthFilter, this.delay);
      connect(this.delay, this.damp);
      connect(this.damp, this.fb);
      connect(this.fb, this.delay);
      connect(this.damp, this.wet);
      connect(this.wet, this.synthOut);
    } catch (e) { /* echo is optional */ }

    if (!connect(this.out, state.musicMix)) { this.dispose(); return false; }

    try {
      var now = ctx.currentTime, p = this.out.gain;
      p.setValueAtTime(0.0001, now);
      p.linearRampToValueAtTime(MUSIC_TRACK_LEVEL, now + this.fadeSec);
    } catch (e) { /* ignore */ }

    this.nextTime = ctx.currentTime + 0.08;
    this.step = 0;
    var self = this;
    this.timer = every(function () { self.tick(); }, TICK_MS);
    this.tick();
    return true;
  };

  Player.prototype.tick = function () {
    var ctx = state.ctx;
    if (!ctx || this.disposed || this.stopping || this.finished) { return; }
    try {
      sweepVoices(false);
      if (ctx.state !== 'running' || audioClockStalled()) {
        this.nextTime = ctx.currentTime + 0.08;
        return;
      }
      var now = ctx.currentTime, song = this.song, guard = 0;
      if (this.nextTime < now - 0.4) { this.nextTime = now + 0.06; }
      while (this.nextTime < now + LOOKAHEAD && guard < 96) {
        if (!song.loop && this.step >= song.totalSteps) { this.finish(); break; }
        this.schedule(this.step % song.totalSteps, this.nextTime);
        this.step++;
        if (song.loop) { this.step %= song.totalSteps; }
        this.nextTime += song.stepDur;
        guard++;
      }
      if (!song.loop && this.step >= song.totalSteps) { this.finish(); }
    } catch (e) { /* a timer must never throw into the host page */ }
  };

  Player.prototype.schedule = function (stepIndex, t) {
    var ctx = state.ctx;
    if (!ctx || this.disposed || !this.chipIn) { return; }
    var song = this.song, sd = song.stepDur;
    var bar = song.bars[Math.floor(stepIndex / 16) % song.barCount];
    if (!bar) { return; }
    var pos = stepIndex % 16;
    var style = this.style;
    var dest = style === 'synth' ? this.synthIn : this.chipIn;
    var inten = song.layers ? state.intensity : 0;
    var i, ev, list;

    /* synth pad: one sustained chord per bar */
    if (style === 'synth' && pos === 0) {
      var padBase = 48 + bar.chord.root, padTones = bar.chord.intervals;
      for (i = 0; i < padTones.length; i++) {
        synthPad(dest, t, midiToFreq(padBase + padTones[i]), sd * 16 * 1.02, 1);
        state.notes++;
      }
    }

    /* lead */
    list = bar.lead[pos];
    for (i = 0; i < list.length; i++) {
      ev = list[i];
      var ldur = ev.steps * sd;
      if (style === 'synth') { synthLead(dest, t, ev.hz, ldur * 0.92, ev.vel, song); }
      else { chipLead(dest, t, ev.hz, ldur * 0.92, ev.vel, song); }
      state.notes++;
      /* high-intensity fifth layer */
      if (inten > 0.82 && ev.steps >= 2) {
        var fifth = ev.hz * 1.4983;
        if (style === 'synth') { synthHarm(dest, t, fifth, ldur * 0.7, 0.5, song, 0.1); }
        else { chipHarm(dest, t, fifth, ldur * 0.7, 0.5, song); }
        state.notes++;
      }
    }

    /* harmony / arpeggio channel */
    if (bar.arp) {
      var slot = bar.arp[pos];
      if (slot) {
        var adur = slot.steps * sd * 0.85;
        if (style === 'synth') { synthHarm(dest, t, slot.hz, adur, 1, song, pos % 4 < 2 ? -0.3 : 0.3); }
        else { chipHarm(dest, t, slot.hz, adur, 1, song); }
        state.notes++;
        if (inten > 0.32) {
          var oct = slot.hz * 2;
          if (style === 'synth') { synthHarm(dest, t, oct, adur * 0.7, 0.42, song, pos % 4 < 2 ? 0.32 : -0.32); }
          else { chipHarm(dest, t, oct, adur * 0.7, 0.45, song); }
          state.notes++;
        }
      }
    }

    /* bass */
    list = bar.bass[pos];
    for (i = 0; i < list.length; i++) {
      ev = list[i];
      if (style === 'synth') { synthBass(dest, t, ev.hz, ev.steps * sd, ev.vel, song); }
      else { chipBass(dest, t, ev.hz, ev.steps * sd, ev.vel, song); }
      state.notes++;
    }

    /* drums */
    list = bar.drums[pos];
    for (i = 0; i < list.length; i++) {
      playDrum(dest, t, list[i].lane, song, style, list[i].vel);
      state.notes++;
    }

    /* intensity: extra percussion drive as the fight heats up */
    if (inten > 0.55 && (pos % 4 === 2 || pos % 4 === 3)) {
      playDrum(dest, t, 'h', song, style, 0.42);
      state.notes++;
    }
    if (inten > 0.72 && pos === 0 && style === 'synth') {
      playDrum(dest, t, 'c', song, style, 0.5);
      state.notes++;
    }
  };

  Player.prototype.finish = function () {
    if (this.finished || this.disposed) { return; }
    this.finished = true;
    if (this.timer) { stopTimer(this.timer); this.timer = 0; }
    var ctx = state.ctx, self = this;
    var wait = 0.4;
    if (ctx && isFinite(this.nextTime)) { wait = Math.max(0.3, this.nextTime - ctx.currentTime) + 0.5; }
    if (state.current === this) { state.current = null; state.desired = null; }
    this.tailTimer = later(function () { self.stop(0.7, true); }, Math.round(wait * 1000));
  };

  Player.prototype.stop = function (fadeSec, silent) {
    if (this.disposed || this.stopping) { return; }
    this.stopping = true;
    if (this.timer) { stopTimer(this.timer); this.timer = 0; }
    if (this.tailTimer) { stopTimer(this.tailTimer); this.tailTimer = 0; }
    var ctx = state.ctx, f = clamp(fadeSec === undefined ? 0.35 : fadeSec, 0.05, 3);
    if (ctx && this.out) {
      try {
        var now = ctx.currentTime, p = this.out.gain, cur = Number(p.value);
        if (!isFinite(cur) || cur <= 0) { cur = 0.0001; }
        p.cancelScheduledValues(now);
        p.setValueAtTime(cur, now);
        p.linearRampToValueAtTime(0.0001, now + f);
      } catch (e) { /* ignore */ }
    }
    var self = this;
    this.tailTimer = later(function () { self.dispose(); }, Math.round((f + 0.18) * 1000));
  };

  Player.prototype.dispose = function () {
    if (this.disposed) { return; }
    this.disposed = true;
    this.stopping = true;
    if (this.timer) { stopTimer(this.timer); this.timer = 0; }
    if (this.tailTimer) { stopTimer(this.tailTimer); this.tailTimer = 0; }
    disconnect(this.chipIn); disconnect(this.chipOut);
    disconnect(this.synthIn); disconnect(this.synthFilter); disconnect(this.synthOut);
    disconnect(this.delay); disconnect(this.fb); disconnect(this.damp); disconnect(this.wet);
    disconnect(this.out);
    this.chipIn = this.chipOut = this.synthIn = this.synthFilter = this.synthOut = null;
    this.delay = this.fb = this.damp = this.wet = this.out = null;
    var idx = state.players.indexOf(this);
    if (idx >= 0) { state.players.splice(idx, 1); }
    if (state.current === this) { state.current = null; }
    sweepVoices(true);
  };

  function synthCutoff() {
    var base = 900 + state.intensity * 2600;
    if (state.ducked) { base *= 0.36; }
    return clamp(base, 180, 12000);
  }
  function applyFilterTargets(sec) {
    for (var i = 0; i < state.players.length; i++) {
      var p = state.players[i];
      if (p.synthFilter) { rampParam(p.synthFilter.frequency, synthCutoff(), sec); }
    }
  }

  function startTrack(id) {
    if (!isTrackId(id)) { return false; }
    var song = SONGS[id];
    if (!song) { return false; }
    if (state.current && state.current.id === id && !state.current.finished) { return true; }
    if (!ctxRunning()) { state.desired = id; return true; }
    var player = new Player(id, song);
    var fade = (state.current && !state.current.finished) ? CROSSFADE : 0.22;
    if (!player.start(fade)) { return false; }
    state.players.push(player);
    var old = state.current;
    state.current = player;
    state.desired = id;
    if (old && old !== player) { old.stop(CROSSFADE); }
    return true;
  }

  /* ============================================================
     7. SOUND EFFECTS (22 one-shots)
     ============================================================ */
  function pl(dest, t, hz, dur, peak, o) { voice(dest, t, hz, dur, peak, o); }

  var SFX_DEFS = {
    ui_move: function (t, b) {
      pl(b, t, 760, 0.05, 0.1, { wave: pulseWave(0.25), attack: 0.001, release: 0.008, pluck: true });
    },
    ui_select: function (t, b) {
      pl(b, t, 660, 0.055, 0.11, { wave: pulseWave(0.25), attack: 0.001, release: 0.01, pluck: true });
      pl(b, t + 0.055, 990, 0.09, 0.11, { wave: pulseWave(0.25), attack: 0.001, release: 0.02, pluck: true });
    },
    ui_back: function (t, b) {
      pl(b, t, 520, 0.05, 0.1, { wave: pulseWave(0.25), attack: 0.001, release: 0.008, pluck: true });
      pl(b, t + 0.05, 370, 0.08, 0.1, { wave: pulseWave(0.125), attack: 0.001, release: 0.015, pluck: true });
    },
    punch: function (t, b) {
      pl(b, t, 182, 0.09, 0.22, { type: 'sine', toHz: 70, attack: 0.002, release: 0.02 });
      noiseHit(b, t, 0.06, 'lowpass', 1200, 380, 0.8, 0.16);
    },
    kick: function (t, b) {
      pl(b, t, 205, 0.13, 0.27, { type: 'sine', toHz: 58, attack: 0.002, release: 0.03 });
      noiseHit(b, t, 0.04, 'bandpass', 1900, 650, 1, 0.1);
    },
    hit: function (t, b) {
      noiseHit(b, t, 0.07, 'bandpass', 2400, 900, 1.1, 0.21);
      pl(b, t, 320, 0.06, 0.17, { type: 'square', toHz: 140, attack: 0.001, release: 0.012 });
    },
    hit_heavy: function (t, b) {
      noiseHit(b, t, 0.16, 'lowpass', 1400, 280, 0.8, 0.28);
      pl(b, t, 120, 0.2, 0.29, { type: 'sine', toHz: 42, attack: 0.002, release: 0.05 });
      pl(b, t, 258, 0.08, 0.11, { type: 'square', toHz: 90, attack: 0.001, release: 0.02 });
      noiseHit(b, t + 0.02, 0.1, 'highpass', 3200, 6200, 0.8, 0.06);
    },
    block: function (t, b) {
      pl(b, t, 520, 0.07, 0.13, { type: 'square', attack: 0.001, release: 0.012 });
      pl(b, t + 0.01, 790, 0.08, 0.09, { type: 'square', attack: 0.001, release: 0.02 });
      noiseHit(b, t, 0.03, 'highpass', 5200, 9000, 0.8, 0.07);
    },
    jump: function (t, b) {
      pl(b, t, 260, 0.16, 0.14, { wave: pulseWave(0.25), toHz: 840, attack: 0.003, release: 0.02 });
    },
    land: function (t, b) {
      pl(b, t, 110, 0.09, 0.2, { type: 'sine', toHz: 50, attack: 0.002, release: 0.02 });
      noiseHit(b, t, 0.07, 'lowpass', 900, 280, 0.9, 0.13);
    },
    special: function (t, b) {

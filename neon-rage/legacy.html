  function drawSelectCard(ctx, r, idx, selected, t, st) {
    var meta = CHAR_META[idx];
    if (!meta) return;
    var accent = meta.accent;
    ctx.save();
    if (selected) {
      drawGlow(ctx, r.x + r.w / 2, r.y + r.h / 2, r.w * 0.62, accent, 0.10, 'lighter');
    } else {
      ctx.globalAlpha *= 0.97;
    }
    glass(ctx, r.x, r.y, r.w, r.h, {
      cut: 10, accent: accent, alpha: selected ? 0.99 : 0.98,
      border: selected ? rgba(accent, 0.6) : 'rgba(255,255,255,0.16)',
      glow: selected ? accent : null, glowBlur: 18,
      fillA: selected ? 'rgba(12,16,40,0.98)' : 'rgba(8,10,26,0.97)',
      fillB: selected ? 'rgba(5,6,20,0.99)' : 'rgba(4,5,16,0.98)'

    ctx.save();
    cutPath(ctx, r.x + 1, r.y + 1, r.w - 2, r.h - 2, 10);
    ctx.clip();
    // верхняя тонировка
    ctx.fillStyle = lg(ctx, r.x, r.y, r.x + r.w, r.y + r.h * 0.6, [
      0, rgba(accent, selected ? 0.18 : 0.09), 1, rgba(accent, 0)

    ctx.fillRect(r.x, r.y, r.w, r.h);
    // диагональные штрихи
    ctx.globalAlpha = selected ? 0.18 : 0.09;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1;
    for (var d = 0; d < 7; d++) {
      ctx.beginPath();
      ctx.moveTo(r.x + 16 + d * 26, r.y + r.h);
      ctx.lineTo(r.x + 40 + d * 26, r.y + r.h * 0.6);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // номер
    drawText(ctx, '0' + (idx + 1), r.x + r.w - 14, r.y + 18, {
      size: 16, weight: 900, fam: F_DISPLAY, align: 'right', color: rgba(accent, selected ? 0.9 : 0.4)
    });
    // имя
    drawText(ctx, tt(meta.aliasKey), r.x + 14, r.y + 20, {
      size: 21, weight: 900, fam: F_DISPLAY, italic: true, align: 'left',
      color: '#ffffff', grad: ['#ffffff', '#ffffff', accent], glow: accent, blur: 10, glowAlpha: selected ? 0.65 : 0.25,

    });

      size: 6.4, weight: 900, fam: F_SANS, align: 'left', color: rgba(accent, 0.95), spacing: 2.4
    });

    // платформа
    var pcx = r.x + 60, pbase = r.y + r.h - 16;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(ctx, pcx, pbase, 44, accent, selected ? 0.17 : 0.09, 'lighter');
    ctx.strokeStyle = rgba(accent, selected ? 0.62 : 0.3);
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(pcx, pbase, 40, 8.5, 0, 0, TAU); ctx.stroke();
    ctx.strokeStyle = rgba(accent, selected ? 0.30 : 0.14);
    ctx.beginPath(); ctx.ellipse(pcx, pbase, 29, 5.8, 0, 0, TAU); ctx.stroke();
    ctx.restore();

    // фигура героя
    var fake = {
      id: 700 + idx, kind: 'player', char: meta.id, x: pcx, y: pbase - 1, z: 0,
      facing: 1, anim: selected ? 'ready' : 'idle', animT: 0.3 + idx, scale: 1.16,

    drawActor(ctx, fake, t, 0, { portrait: true, noReflect: true });

    // статы
    var sx = r.x + 118, sy = r.y + 46, sw = r.w - 134;
    for (var i = 0; i < 4; i++) {
      var yy = sy + i * 10.5;
      drawText(ctx, tt(STAT_KEYS[i]), sx, yy, {
        size: 4.9, weight: 700, fam: F_SANS, align: 'left', color: rgba(C.white, 0.55), spacing: 0.5
      });
      var bx = sx + 34, bw = Math.max(20, sw - 34);
      rr(ctx, bx, yy - 2, bw, 3.6, 1.8);
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fill();
      var v = meta.stats[i] / 5;
      rr(ctx, bx, yy - 2, Math.max(2, bw * v), 3.6, 1.8);
      ctx.fillStyle = lg(ctx, bx, 0, bx + bw, 0, [0, rgba(accent, 0.55), 1, accent]);

        ctx.fillStyle = 'rgba(255,255,255,0.38)';
        ctx.fillRect(bx + 1, yy - 1.4, Math.max(1, bw * v - 2), 1);
      }
    }
    // описание

  /* ---------------- ИНТРО ---------------- */
  function drawChipArt(ctx, cx, cy, s, t) {
    ctx.save();
    ctx.translate(cx, cy + Math.sin(t * 1.6) * 3);
    ctx.rotate(Math.sin(t * 0.7) * 0.06);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(ctx, 0, 0, s * 1.9, C.cyan, 0.20, 'lighter');
    drawGlow(ctx, 0, 0, s * 1.1, C.pink, 0.16, 'lighter');
    ctx.globalCompositeOperation = 'source-over';
    // корпус чипа
    var g = lg(ctx, -s, -s, s, s, [0, '#122040', 0.5, '#0a1226', 1, '#050812']);
    rr(ctx, -s * 0.62, -s * 0.62, s * 1.24, s * 1.24, 4);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = rgba(C.cyan, 0.7);
    ctx.lineWidth = 1;
    ctx.stroke();
    // ножки
    ctx.strokeStyle = rgba(C.cyan2, 0.55);
    ctx.lineWidth = 1.4;
    for (var i = 0; i < 6; i++) {
      var off = -s * 0.45 + i * s * 0.18;
      ctx.beginPath(); ctx.moveTo(off, -s * 0.62); ctx.lineTo(off, -s * 0.82); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(off, s * 0.62); ctx.lineTo(off, s * 0.82); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-s * 0.62, off); ctx.lineTo(-s * 0.82, off); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s * 0.62, off); ctx.lineTo(s * 0.82, off); ctx.stroke();
    }
    // ядро
    var cg = lg(ctx, -s * 0.3, -s * 0.3, s * 0.3, s * 0.3, [0, '#8ff6ff', 0.5, '#22e6ff', 1, '#0a6fd0']);
    rr(ctx, -s * 0.3, -s * 0.3, s * 0.6, s * 0.6, 2);
    ctx.fillStyle = cg;
    ctx.fill();
    // схема
    ctx.strokeStyle = 'rgba(4,10,24,0.8)';
    ctx.lineWidth = 0.8;
    for (var k = 0; k < 3; k++) {
      ctx.beginPath();
      ctx.moveTo(-s * 0.28 + k * s * 0.18, -s * 0.28);
      ctx.lineTo(-s * 0.28 + k * s * 0.18, s * 0.28);
      ctx.stroke();
    }
    ctx.fillStyle = '#04101c';
    ctx.fillRect(-s * 0.08, -s * 0.08, s * 0.16, s * 0.16);
    ctx.fillStyle = C.lime;
    ctx.fillRect(-s * 0.03, s * 0.12, s * 0.06, s * 0.06);
    // блик
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(-s * 0.55, -s * 0.55, s * 0.5, 1.2);
    ctx.restore();
    // код
    ctx.save();
    ctx.globalAlpha = 0.6;
    for (var r = 0; r < 4; r++) {
      var line = 'NEON-8 · ' + ('000' + Math.floor(hash(r * 3.3 + Math.floor(t * 2)) * 999)).slice(-3);
      drawText(ctx, line, cx + s * 1.05, cy - 18 + r * 9, {
        size: 4.6, weight: 700, fam: F_MONO, align: 'left', color: rgba(C.cyan, 0.6), spacing: 0.6
      });
    }
    ctx.restore();
  }

  /* ---------------- НАСТРОЙКИ ---------------- */
  function settingValue(set, id) {
    switch (id) {
      case 'lang': return String(set.lang || 'ru').toUpperCase();
      case 'gfx': return tt(set.gfx === 'retro' ? 'gfx.retro' : 'gfx.modern');
      case 'music': return tt(set.music ? 'common.on' : 'common.off');
      case 'audioStyle': return tt(set.audioStyle === 'synth' ? 'audio.synth' : 'audio.chip');
      case 'sfx': return tt(set.sfx ? 'common.on' : 'common.off');
      case 'volume': return Math.round((set.volume == null ? 0.8 : set.volume) * 100) + '%';
      case 'crt': return tt(set.crt ? 'common.on' : 'common.off');
      case 'difficulty': return tt('diff.' + (set.difficulty || 'normal'));
      case 'reset': return '';
      default: return '';
    }
  }
  function settingColor(id, set) {
    if (id === 'gfx') return set.gfx === 'retro' ? C.amber : C.lime;
    if (id === 'lang') return C.cyan;
    if (id === 'music' || id === 'sfx') return set[id] ? C.pink : C.dim;
    if (id === 'audioStyle') return set.audioStyle === 'synth' ? C.violet2 : C.amber;
    if (id === 'volume') return C.cyan;
    if (id === 'crt') return set.crt ? C.lime : C.dim;
    if (id === 'difficulty') return set.difficulty === 'hard' ? C.red : set.difficulty === 'easy' ? C.lime : C.amber;
    if (id === 'reset') return C.red;
    return C.cyan;
  }

        });

  function screenVictory(ctx, st, t) {

    drawGlow(ctx, W / 2, 70, 190, C.lime, 0.16, 'lighter');

    ctx.restore();
    drawShafts(ctx, [{ x: 60, col: C.lime }, { x: 200, col: C.cyan }, { x: 320, col: C.pink }], t, 1);
    ctx.fillStyle = lg(ctx, 0, 0, 0, H, [0, 'rgba(3,6,10,0.66)', 0.5, 'rgba(3,8,14,0.45)', 1, 'rgba(3,4,10,0.86)']);
    ctx.fillRect(0, 0, W, H);

    // герои по краям
    var heroD = {
      id: 811, kind: 'player', char: 'comet', x: 44, y: 250, z: 0, facing: 1,
      anim: 'victory', animT: 0.5, scale: 0.95, alpha: 1, flash: 0, hp: 1, maxHp: 1, state: 'victory', attack: null
    };
    var heroT = {
      id: 812, kind: 'player', char: 'hammer', x: 438, y: 250, z: 0, facing: -1,
      anim: 'victory', animT: 0.5, scale: 0.95, alpha: 1, flash: 0, hp: 1, maxHp: 1, state: 'victory', attack: null
    };
    drawActor(ctx, heroD, t, 0, { noReflect: true });
    drawActor(ctx, heroT, t, 0, { noReflect: true });

    // конфетти
    ctx.save();
    for (var i = 0; i < 30; i++) {
      var ph = (t * 0.35 + hash(i * 3.3)) % 1;
      var x = hash(i * 7.1) * W + Math.sin(t * 2 + i) * 6;
      var y = ph * (H + 20) - 10;
      ctx.globalAlpha = 0.25 + 0.5 * Math.sin(ph * PI);
      ctx.fillStyle = [C.lime, C.cyan, C.pink, C.amber][i % 4];
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(t * 2 + i);
      ctx.fillRect(-1.4, -1.4, 2.8, 2.8);
      ctx.restore();
    }
    ctx.restore();

    drawText(ctx, tt('end.victoryTitle'), W / 2, 48, {
      size: fitSize(ctx, tt('end.victoryTitle'), 400, 34, 900, F_DISPLAY, 18), weight: 900,
      fam: F_DISPLAY, italic: true, align: 'center', color: '#ffffff',
      grad: ['#ffffff', '#f4ffd0', C.lime], glow: C.lime, blur: 20, glowAlpha: 0.8,
      stroke: 'rgba(3,8,4,0.6)', strokeW: 3.4, spacing: 1
    });
    var vs = tt('end.victorySub');
    drawText(ctx, vs, W / 2, 70, {
      size: fitSize(ctx, vs, 380, 6.6, 700, F_SANS, 5), weight: 700, fam: F_SANS,
      align: 'center', color: rgba(C.white, 0.7), spacing: 0.8
    });
    drawEndStats(ctx, st, 96, 82, 288, t);
    drawEndButtons(ctx, st, t, C.lime);
    // «чип возвращён» марка
    drawText(ctx, 'NEON-8 · ONLINE', W / 2, 240, {
      size: 5.6, weight: 700, fam: F_MONO, align: 'center', color: rgba(C.lime, 0.7), spacing: 2
    });
    drawWeather(ctx, 2, t, { rainScale: 0.55 });
  }

  /* ---------- диспетчер ---------- */
  function draw(ctx, view) {
    if (!ctx) return;
    useCtx(ctx);
    var st = DS();
    var t = (view && view.t != null) ? view.t : (st.t || 0);
    var mode = st.mode || 'title';
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    switch (mode) {
      case 'title': screenTitle(ctx, st, t); break;
      case 'select': screenSelect(ctx, st, t); break;
      case 'intro': screenIntro(ctx, st, t); break;
      case 'help': screenHelp(ctx, st, t); break;
      case 'settings': screenSettings(ctx, st, t); break;
      case 'about': screenAbout(ctx, st, t); break;
      case 'play':
        drawPlayWorld(ctx, st, t);
        drawHUD(ctx, st, t);
        drawBanner(ctx, st, t);
        drawBossIntro(ctx, st, t);
        break;
      case 'paused': screenPaused(ctx, st, t); break;
      case 'dead': screenDead(ctx, st, t); break;
      case 'gameover': screenGameOver(ctx, st, t); break;
      case 'victory': screenVictory(ctx, st, t); break;
      default: screenTitle(ctx, st, t); break;
    }
    ctx.restore();
    frameOverlays(ctx, st, t);
  }

  var API = { draw: draw, version: 1 };
  if (typeof window !== 'undefined') window.NR_RENDER_MODERN = API;
  return API;
})();

/* ============================================================
   НЕОН × ЯРОСТЬ: NEON RAGE
   main.js — оболочка: canvas, масштаб, ввод, звук, CRT, rAF, QA-хэши.
   Владелец: Lead. Контракт: docs/CONTRACT.md.
   ============================================================ */
(function () {
  'use strict';

  var NR = window.NR;
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d', { alpha: false });
  var errBox = document.getElementById('err');
  var testBox = document.getElementById('testout');
  var hint = document.getElementById('hint');

  if (!NR || !canvas || !ctx) return;

  var W = NR.W || 480, H = NR.H || 270;
  var RETRO = window.NR_RENDER_RETRO;
  var MODERN = window.NR_RENDER_MODERN;

  var off = document.createElement('canvas');
  off.width = W;
  off.height = H;
  var offCtx = off.getContext('2d', { alpha: false });
  offCtx.imageSmoothingEnabled = false;

  var dpr = 1, cw = 0, ch = 0;
  var stage = { x: 0, y: 0, w: W, h: H, scale: 1 };
  var lastGfx = null, lastLang = null, lastMusic = null;
  var bootedAudio = false;
  var fatal = false;
  var bgGrad = null, vignette = null;
  var hintTimer = 0;

  function report(msg) {
    if (!errBox) return;
    errBox.style.display = 'block';
    errBox.textContent += String(msg) + '\n';
  }

  window.addEventListener('error', function (ev) {
    try { report((ev.message || 'error') + (ev.filename ? ' @ ' + ev.filename + ':' + ev.lineno : '')); } catch (e) { /* ok */ }
  });
  window.addEventListener('unhandledrejection', function (ev) {
    try { report('promise: ' + String(ev.reason)); } catch (e) { /* ok */ }
  });

  /* ---------- масштаб ---------- */
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cw = Math.max(280, window.innerWidth || 960);
    ch = Math.max(200, window.innerHeight || 540);
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = true;

    var s;
    if (NR.settings.gfx === 'retro') {
      var availW = Math.max(120, cw);
      var availH = Math.max(90, ch);
      s = Math.min(availW / W, availH / H);
      if (s >= 2) s = Math.floor(s + 0.0001);
      else s = Math.max(0.5, s);
    } else {
      var pad = Math.min(cw, ch) > 900 ? 14 : 0;
      s = Math.min((cw - pad * 2) / W, (ch - pad * 2) / H);
      s = Math.max(0.5, s);
    }
    var sw = Math.round(W * s), sh = Math.round(H * s);
    stage = {
      x: Math.round((cw - sw) / 2),
      y: Math.round((ch - sh) / 2),
      w: sw, h: sh, scale: s
    };
    offCtx.imageSmoothingEnabled = false;

    /* фон вокруг игры */
    bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#0b0820');
    bgGrad.addColorStop(0.5, '#07060f');
    bgGrad.addColorStop(1, '#03020a');

    vignette = ctx.createRadialGradient(
      canvas.width * 0.5, canvas.height * 0.48, Math.min(canvas.width, canvas.height) * 0.18,
      canvas.width * 0.5, canvas.height * 0.5, Math.max(canvas.width, canvas.height) * 0.72
    );
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(0.68, 'rgba(0,0,0,0.08)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.62)');
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 150); });

  /* ---------- звук ---------- */
  function ensureAudio() {
    var A = window.NR_AUDIO;
    if (!A) return;
    try {
      if (!bootedAudio) {
        bootedAudio = true;
        A.init();
      }
      var r = A.unlock ? A.unlock() : null;
      if (r && r.then) r.then(function () { NR.syncAudio(); }).catch(function () { /* ok */ });
      NR.syncAudio();
    } catch (e) { report('audio: ' + (e && e.message ? e.message : e)); }
  }

  /* ---------- ввод ---------- */
  var heldKeys = {};

  function syncHeld() {
    NR.setHeld('left', !!(heldKeys.ArrowLeft || heldKeys.KeyA));
    NR.setHeld('right', !!(heldKeys.ArrowRight || heldKeys.KeyD));
    NR.setHeld('up', !!(heldKeys.ArrowUp || heldKeys.KeyW));
    NR.setHeld('down', !!(heldKeys.ArrowDown || heldKeys.KeyS));
    NR.setHeld('jump', !!heldKeys.Space);
    NR.setHeld('punch', !!(heldKeys.KeyJ || heldKeys.KeyZ));
    NR.setHeld('kick', !!(heldKeys.KeyK || heldKeys.KeyX));
    NR.setHeld('special', !!(heldKeys.KeyL || heldKeys.KeyV));
  }

  function menuMode() {
    var m = NR.state.mode;
    return m !== 'play' && m !== 'dead';
  }

  function onKeyDown(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var code = e.code;
    var gameKeys = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter', 'Escape',
      'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyJ', 'KeyK', 'KeyL', 'KeyZ', 'KeyX', 'KeyV', 'KeyP',
      'KeyG', 'KeyT', 'KeyM', 'KeyF'];
    if (gameKeys.indexOf(code) >= 0) e.preventDefault();
    if (code === 'Space' && menuMode()) e.preventDefault();
    ensureAudio();
    if (e.repeat) {
      heldKeys[code] = true;
      syncHeld();
      return;
    }
    heldKeys[code] = true;
    syncHeld();
    switch (code) {
      case 'ArrowLeft': case 'KeyA': NR.press('left'); break;
      case 'ArrowRight': case 'KeyD': NR.press('right'); break;
      case 'ArrowUp': case 'KeyW': NR.press('up'); break;
      case 'ArrowDown': case 'KeyS': NR.press('down'); break;
      case 'Space':
        if (menuMode()) NR.press('confirm');
        else NR.press('jump');
        break;
      case 'KeyJ': case 'KeyZ': NR.press('punch'); break;
      case 'KeyK': case 'KeyX': NR.press('kick'); break;
      case 'KeyL': case 'KeyV': NR.press('special'); break;
      case 'Enter': case 'NumpadEnter': NR.press('confirm'); break;
      case 'Escape': NR.press('back'); break;
      case 'KeyP': NR.press('pause'); break;
      case 'KeyG': NR.press('gfx'); break;
      case 'KeyT': NR.press('lang'); break;
      case 'KeyM': NR.press('music'); break;
      case 'KeyF': NR.press('fullscreen'); break;
      default: break;
    }
  }

  function onKeyUp(e) {
    heldKeys[e.code] = false;
    syncHeld();
  }

  window.addEventListener('keydown', onKeyDown, { passive: false });
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', function () {
    heldKeys = {};
    syncHeld();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && NR.state.mode === 'play') NR.press('pause');
  });

  /* ---------- указатель / тач ---------- */
  function logicalFromEvent(e) {
    var r = canvas.getBoundingClientRect();
    var px = e.clientX - r.left;
    var py = e.clientY - r.top;
    return {
      x: (px - stage.x) / stage.w * W,
      y: (py - stage.y) / stage.h * H
    };
  }

  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    if (e.pointerType === 'touch') document.body.classList.add('touch');
    var p = logicalFromEvent(e);
    NR.input.pointer.x = p.x;
    NR.input.pointer.y = p.y;
    NR.pointerDown(p.x, p.y);
    try { canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('pointermove', function (e) {
    var p = logicalFromEvent(e);
    NR.input.pointer.x = p.x;
    NR.input.pointer.y = p.y;
  });

  canvas.addEventListener('pointerup', function (e) {
    var p = logicalFromEvent(e);
    NR.pointerUp(p.x, p.y);
  });
  canvas.addEventListener('pointercancel', function () { NR.pointerUp(0, 0); });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* тач-кнопки из template.html */
  var touchEl = document.getElementById('touch');
  if (touchEl) {
    var isCoarse = false;
    try {
      isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    } catch (e) { /* ok */ }
    if (isCoarse || (('ontouchstart' in window) || navigator.maxTouchPoints > 0) && window.innerWidth < 1100) {
      document.body.classList.add('touch');
    }
    var holdBtns = touchEl.querySelectorAll('[data-hold]');
    for (var hi = 0; hi < holdBtns.length; hi++) {
      (function (btn) {
        var name = btn.getAttribute('data-hold');
        function down(e) {
          ensureAudio();
          e.preventDefault();
          btn.classList.add('active');
          NR.setHeld(name, true);
          try { btn.setPointerCapture && btn.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
        }
        function up(e) {
          if (e) e.preventDefault();
          btn.classList.remove('active');
          NR.setHeld(name, false);
        }
        btn.addEventListener('pointerdown', down, { passive: false });
        btn.addEventListener('pointerup', up, { passive: false });
        btn.addEventListener('pointercancel', up);
        btn.addEventListener('pointerleave', up);
      })(holdBtns[hi]);
    }
    var pressBtns = touchEl.querySelectorAll('[data-press]');
    for (var pi = 0; pi < pressBtns.length; pi++) {
      (function (btn) {
        var action = btn.getAttribute('data-press');
        btn.addEventListener('pointerdown', function (e) {
          ensureAudio();
          e.preventDefault();
          btn.classList.add('active');
          NR.press(action);
          try { btn.setPointerCapture && btn.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
        }, { passive: false });
        btn.addEventListener('pointerup', function () { btn.classList.remove('active'); });
        btn.addEventListener('pointercancel', function () { btn.classList.remove('active'); });
        btn.addEventListener('pointerleave', function () { btn.classList.remove('active'); });
      })(pressBtns[pi]);
    }
  }

  var touchPause = document.getElementById('tpause');
  if (touchPause) {
    touchPause.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      ensureAudio();
      touchPause.classList.add('active');
      NR.press('pause');
    }, { passive: false });
    touchPause.addEventListener('pointerup', function () { touchPause.classList.remove('active'); });
    touchPause.addEventListener('pointercancel', function () { touchPause.classList.remove('active'); });
    touchPause.addEventListener('pointerleave', function () { touchPause.classList.remove('active'); });
  }

  /* ---------- фуллскрин / подсказки ---------- */
  function handleFullscreen() {
    if (!NR.wantFullscreen) return;
    NR.wantFullscreen = false;
    try {
      if (!document.fullscreenElement) {
        var r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        if (r && r.catch) r.catch(function () { /* ok */ });
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    } catch (e) { /* ok */ }
  }

  function showHint(text, ms) {
    if (!hint || !text) return;
    hint.textContent = text;
    hint.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { hint.classList.remove('show'); }, ms || 1900);
  }

  function valueLabel(setting) {
    var s = NR.settings;
    if (setting === 'gfx') return NR.t(s.gfx === 'retro' ? 'gfx.retro' : 'gfx.modern');
    if (setting === 'music') return NR.t(s.music ? 'common.on' : 'common.off');
    if (setting === 'lang') return String(s.lang).toUpperCase();
    return '';
  }

  function watchSettings() {
    if (lastGfx !== null && NR.settings.gfx !== lastGfx) {
      resize();
      showHint(NR.t('quick.gfx') + ' · ' + valueLabel('gfx'));
    }
    if (lastLang !== null && NR.settings.lang !== lastLang) {
      showHint('ЯЗЫК · ' + String(NR.settings.lang).toUpperCase());
    }
    if (lastMusic !== null && NR.settings.music !== lastMusic) {
      showHint(NR.t('quick.music') + ' · ' + valueLabel('music'));
    }
    lastGfx = NR.settings.gfx;
    lastLang = NR.settings.lang;
    lastMusic = NR.settings.music;
    document.documentElement.setAttribute('data-gfx', NR.settings.gfx);
    document.documentElement.lang = NR.settings.lang;
    var touchPlay = NR.state.mode === 'play' || NR.state.mode === 'dead';
    document.body.classList.toggle('in-game', touchPlay);
    document.body.classList.toggle('pausable', touchPlay || NR.state.mode === 'paused');
  }

  /* ---------- отрисовка ---------- */
  function drawCrt(retro) {
    if (!NR.settings.crt) return;
    var sd = dpr;
    var s = stage;
    ctx.save();
    if (retro) {
      /* фосфорное послесвечение */
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.05;
      ctx.imageSmoothingEnabled = false;
      try { ctx.drawImage(off, 0, 0, W, H, s.x * sd, s.y * sd, s.w * sd, s.h * sd); } catch (e) { /* ok */ }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    /* скан-линии */
    var lineStep = Math.max(2, Math.round((s.h * sd) / H * (retro ? 1.7 : 2.4)));
    var lineH = Math.max(1, Math.round(lineStep * (retro ? 0.42 : 0.22)));
    ctx.globalAlpha = retro ? 0.20 : 0.07;
    ctx.fillStyle = '#000';
    for (var y = s.y * sd; y < (s.y + s.h) * sd; y += lineStep) {
      ctx.fillRect(s.x * sd, y, s.w * sd, lineH);
    }
    ctx.globalAlpha = 1;
    /* виньетка */
    if (vignette) {
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    /* тонкая рамка */
    ctx.strokeStyle = retro ? 'rgba(150,160,255,0.20)' : 'rgba(34,230,255,0.16)';
    ctx.lineWidth = Math.max(1, Math.round(dpr));
    ctx.strokeRect(s.x * sd + 0.5, s.y * sd + 0.5, s.w * sd - 1, s.h * sd - 1);
    ctx.restore();
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.fillStyle = bgGrad || '#05040a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var s = stage;
    var sd = dpr;
    var gfx = NR.settings.gfx;

    if (gfx === 'retro') {
      if (!RETRO) return;
      offCtx.setTransform(1, 0, 0, 1, 0, 0);
      offCtx.imageSmoothingEnabled = false;
      RETRO.draw(offCtx, { w: W, h: H, t: NR.state.t });
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, W, H, Math.round(s.x * sd), Math.round(s.y * sd),
        Math.round(s.w * sd), Math.round(s.h * sd));
      drawCrt(true);
    } else {
      if (!MODERN) return;
      var scale = s.scale * sd;
      ctx.setTransform(scale, 0, 0, scale, Math.round(s.x * sd), Math.round(s.y * sd));
      MODERN.draw(ctx, { w: W, h: H, t: NR.state.t });
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      drawCrt(false);
    }
  }

  /* ---------- QA URL hash ---------- */
  function applyHash() {
    var raw = String(window.location.hash || '').replace(/^#/, '');
    if (!raw) return;
    var params = {};
    raw.split('&').forEach(function (pair) {
      var i = pair.indexOf('=');
      if (i < 0) params[decodeURIComponent(pair)] = '1';
      else params[decodeURIComponent(pair.slice(0, i))] = decodeURIComponent(pair.slice(i + 1));
    });
    if (params.gfx === 'modern' || params.gfx === 'retro') NR.settings.gfx = params.gfx;
    if (params.lang === 'ru' || params.lang === 'en') NR.settings.lang = params.lang;
    if (params.scene && NR.debug) NR.debug.scene(params.scene);
    if (params.wave && NR.debug) NR.debug.wave(parseInt(params.wave, 10) || 0);
    if (params.touch === '1') document.body.classList.add('touch');
    if (params.freeze === '1' && NR.debug) NR.debug.freeze(true);
    if (params.demo === '1' && NR.debug) NR.debug.demo();
    watchSettings();
    resize();
  }

  /* ---------- цикл ---------- */
  var last = 0;
  function frame(ts) {
    if (!last) last = ts;
    var dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.1) dt = 0.033;
    try {
      handleFullscreen();
      NR.update(dt);
      watchSettings();
      render();
    } catch (e) {
      fatal = true;
      report('FATAL: ' + (e && e.stack ? e.stack : e));
      try { console.error(e); } catch (err) { /* ok */ }
    }
    if (!fatal) window.requestAnimationFrame(frame);
  }

  /* ---------- старт ---------- */
  try {
    NR.init();
    resize();
    lastGfx = NR.settings.gfx;
    lastLang = NR.settings.lang;
    lastMusic = NR.settings.music;
    if (window.location.hash) applyHash();
    lastGfx = NR.settings.gfx;
    lastLang = NR.settings.lang;
    lastMusic = NR.settings.music;
    NR.syncAudio();
    render();
    window.requestAnimationFrame(frame);
    setTimeout(function () {
      if (!window.location.hash && !document.body.classList.contains('touch')) {
        showHint(NR.t('help.quickKeys'), 5200);
      }
    }, 900);
  } catch (e) {
    fatal = true;
    report('BOOT: ' + (e && e.stack ? e.stack : e));
  }

  /* отладочный доступ для QA */
  window.NR_SHELL = {
    stage: function () { return stage; },
    resize: resize,
    render: render,
    fatal: function () { return fatal; }
  };
})();

</script>

<a id="catalog-back" href="../" title="На стартовую страницу проекта — в каталог игр" aria-label="Вернуться на стартовую страницу проекта — каталог игр" data-catalog-back="1"><span class="catalog-back-arrow" aria-hidden="true">&larr;</span>Каталог</a>
<script>
(function () {
  var link = document.getElementById('catalog-back');
  if (!link) return;

  /* На file:// каталог лежит в index.html корня: «../» открыл бы листинг. */
  if (location.protocol === 'file:') link.setAttribute('href', '../index.html');

  /* Не даём клику/Enter всплывать в игровые обработчики (старт, пауза и т.п.). */
  ['pointerdown', 'click', 'keydown'].forEach(function (type) {
    link.addEventListener(type, function (event) { event.stopPropagation(); }, true);
  });

  /* --- адаптивное размещение, чтобы не перекрывать меню и кнопки игр --- */
  var INTERACTIVE = 'a,button,input,select,textarea,[role="button"],[tabindex],[onclick]';
  link.style.setProperty('transform', 'none', 'important');

  function interactiveBoxes() {
    var boxes = [];
    var nodes = document.querySelectorAll(INTERACTIVE);
    for (var i = 0; i < nodes.length; i += 1) {
      var el = nodes[i];
      if (el === link || el.contains(link)) continue;
      var r = el.getBoundingClientRect();
      if (r.width < 4 || r.height < 4) continue;
      var cs = window.getComputedStyle(el);
      if (cs.visibility === 'hidden' || cs.display === 'none' || Number(cs.opacity) < 0.05) continue;
      if (cs.pointerEvents === 'none') continue;
      boxes.push({ left: r.left, top: r.top, right: r.right, bottom: r.bottom });
    }
    return boxes;
  }

  function overlap(a, b) {
    return a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
  }

  function place() {
    var w = link.offsetWidth;
    var h = link.offsetHeight;
    if (!w || !h) return;
    var W = window.innerWidth;
    var H = window.innerHeight;
    var m = 10;
    var candidates = [
      { name: 'left-mid', left: 0, top: Math.round((H - h) / 2), shape: 'tab' },
      { name: 'bottom-left', left: m, top: H - h - m, shape: 'round' },
      { name: 'top-left', left: m, top: m, shape: 'round' },
      { name: 'bottom-right', left: W - w - m, top: H - h - m, shape: 'round' },
      { name: 'top-right', left: W - w - m, top: m, shape: 'round' },
      { name: 'bottom-center', left: Math.round((W - w) / 2), top: H - h - m, shape: 'round' },
      { name: 'top-center', left: Math.round((W - w) / 2), top: m, shape: 'round' }
    ];
    var boxes = interactiveBoxes();
    var chosen = candidates[0];
    for (var i = 0; i < candidates.length; i += 1) {
      var c = candidates[i];
      var box = { left: c.left, top: c.top, right: c.left + w, bottom: c.top + h };
      var hit = false;
      for (var j = 0; j < boxes.length; j += 1) {
        if (overlap(box, boxes[j])) { hit = true; break; }
      }
      if (!hit) { chosen = c; break; }
    }
    link.style.setProperty('left', chosen.left + 'px', 'important');
    link.style.setProperty('top', chosen.top + 'px', 'important');
    link.classList.toggle('catalog-back-round', chosen.shape === 'round');
    link.dataset.place = chosen.name;
  }

  var timer = 0;
  function schedule() {
    window.clearTimeout(timer);
    timer = window.setTimeout(place, 120);
  }

  place();
  window.setTimeout(place, 350);
  window.setTimeout(place, 1200);
  window.addEventListener('resize', schedule, { passive: true });
  window.addEventListener('orientationchange', schedule, { passive: true });
  document.addEventListener('fullscreenchange', schedule);
})();
</script>

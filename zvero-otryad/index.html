<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#120a06;color:#eef2f8;font-family:Inter,system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;min-height:100dvh;user-select:none;overflow:hidden}
.wrap{position:relative;width:min(96vw,620px);margin-top:10px}
canvas{width:100%;display:block;border:1px solid #3a2a1c;border-radius:10px;background:#120a06}
.pad{width:min(96vw,620px);margin:10px 0;display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:470px}
.pad button{height:54px;background:#1d140d;border:1px solid #3a2a1c;border-radius:12px;color:#eef2f8;font-size:19px;font-weight:800}
.pad button:active{background:#2a1d12}

<div class="wrap"><canvas id="c" width="960" height="600" aria-label="ЗВЕРО-ОТРЯД"></canvas></div>
<div class="pad">
  <button data-d="L">◀</button><button data-d="R">▶</button><button data-d="U">⤒</button><button data-d="A">●</button><button data-pause="1">II</button>
</div>
<div class="foot"><b>ЗВЕРО-ОТРЯД</b> · Пыж (И1): ← → бег, ↑ прыжок, / или пробел — схватить/бросить · Тяпа (И2): A D бег, W прыжок, F — схватить/бросить · 1/2 на заставке — игроки · P/Esc пауза · L язык, T тема, M звук. Тач — только И1.</div>

<script src="./js/modern.js"></script>
<script>
'use strict';
var Z=window.ZVERO;
var STR={
 ru:{play:'Играть',players:'Игроки',touch1p:'тач — 1 игрок',language:'Язык',theme:'Тема',sound:'Звук',on:'вкл',off:'выкл',score:'Счёт',level:'Цех',best:'Рекорд',win:'МАСТЕРСКАЯ СПАСЕНА!',gameover:'ОТРЯД ПОВЕРЖЕН',pause:'ПАУЗА',resume:'Продолжить',menu:'В меню',tapstart:'пробел / тап',title:'ЗВЕРО-ОТРЯД',subtitle:'Старая Мастерская · ко-оп платформер · 1–2 игрока'},
 en:{play:'Play',players:'Players',touch1p:'touch — 1 player',language:'Language',theme:'Theme',sound:'Sound',on:'on',off:'off',score:'Score',level:'Stage',best:'Best',win:'WORKSHOP SAVED!',gameover:'SQUAD DOWN',pause:'PAUSE',resume:'Resume',menu:'Menu',tapstart:'space / tap',title:'ZVERO-OTRYAD',subtitle:'Old Workshop · co-op platformer · 1–2 players'}
};
var g=Arcade.createGame({canvas:'#c',width:960,height:600,gameId:'zvero-otryad',strings:STR,theme:'modern'});
var pad=document.querySelector('.pad');
g.input.bindDpad(pad);
g.fit(620); addEventListener('resize',function(){g.fit(620);});
g.useStandardScreens({title:'ЗВЕРО-ОТРЯД',subtitle:STR.ru.subtitle,lives:0});
var co=Arcade.coop(g,{
  bind:{ p1:{left:['ArrowLeft'],right:['ArrowRight'],jump:['ArrowUp'],grab:['Slash','NumpadDivide','Period','Space']},
         p2:{left:['KeyA'],right:['KeyD'],jump:['KeyW'],grab:['KeyF','ShiftLeft']} },
  actions:['jump','grab'], pad:pad, touch:{L:'left',R:'right',U:'jump',A:'grab'},
  hint:{ ru:['Пыж (И1): ← → бег, ↑ прыжок, / или пробел — схватить/бросить','Тяпа (И2): A D бег, W прыжок, F — схватить/бросить · 1/2 — игроки'],
         en:['Pyzh (P1): ← → run, ↑ jump, / or space — grab/throw','Tyapa (P2): A D run, W jump, F — grab/throw · 1/2 — players'] }
});
var game=null;
function bp(f,d,t,v){ g.audio.beep(f,d,t,v); }
function mkGame(){ return Z.Game({hi:g.state.best,twoP:co.players()===2,onEvent:function(type){
  if(type==='jump') bp(560,.05,'square',.05);
  else if(type==='grab') bp(420,.05,'triangle',.06);
  else if(type==='throw') bp(760,.06,'square',.05);
  else if(type==='smash') bp(130,.14,'sawtooth',.07);
  else if(type==='pickup') bp(1180,.07,'triangle');
  else if(type==='bosshit') bp(180,.12,'sawtooth',.08);
  else if(type==='door') bp(1300,.14,'triangle');
  else if(type==='hurt') bp(210,.14,'sawtooth',.07);
  else if(type==='gameover'){ if(game) g.state.score=game.state().score; g.gameover(); }
  else if(type==='win'){ if(game) g.state.score=game.state().score; g.win(); }
}}); }
co.onAction(function(pi,name){ if(!game) return; if(name==='jump') game.jump(pi); else if(name==='grab') game.action(pi); });
function render(ctx){ var st=game?game.state():null; if(!st){ g.clear(); return; }
  if(Z.i18n) Z.i18n.lang=g.i18n.lang;
  (g.themeName==='retro'?Z.classic:Z.modern).draw(ctx,st); }
// Кооп: оба героя всегда в кадре — И2 появляется рядом с И1, а движок держит «поводок»
// (не дальше ширины экрана минус отступ) и камеру по середине пары (js/game.js).
g.scene('play',{realtime:true,
  enter:function(d){ co.arm(); if(!(d&&d.resume)){ game=mkGame(); game.start(); } },
  press:function(a){ if(a==='pause') this.pause(); },
  update:function(dt){ if(!game) return;
    for(var pi=0;pi<co.players();pi++){ game.setHeld(pi,'left',co.held(pi,'left')); game.setHeld(pi,'right',co.held(pi,'right')); }
    game.update(Math.min(dt,0.05)); if(game) g.state.score=game.state().score; },
  draw:function(ctx){ render(ctx); }
});
window.__ZVERO_V2={g:g,co:co,game:function(){return game;}};
g.start('title');
</script></body></html>

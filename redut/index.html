<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#12160f;color:#eef2f8;font-family:Inter,system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;min-height:100dvh;user-select:none;overflow:hidden}
.wrap{position:relative;width:min(96vw,620px);margin-top:10px}
canvas{width:100%;display:block;border:1px solid #2a3520;border-radius:10px;background:#12160f}
.pad{width:min(96vw,620px);margin:10px 0;display:grid;grid-template-columns:repeat(6,1fr);gap:7px;max-width:470px}
.pad button{height:54px;background:#1a2014;border:1px solid #2a3520;border-radius:12px;color:#eef2f8;font-size:19px;font-weight:800}

<a class="back" href="../">← Каталог</a>
<div class="wrap"><canvas id="c" width="960" height="600" aria-label="РЕДУТ"></canvas></div>
<div class="pad">
  <button data-d="L">◀</button><button data-d="U">▲</button><button data-d="D">▼</button><button data-d="R">▶</button>
  <button data-d="A">●</button><button data-pause="1">II</button>
</div>
<div class="foot"><b>РЕДУТ</b> · И1: стрелки + / (или пробел) — огонь · И2: WASD + F — огонь · 1/2 на заставке — игроки · P/Esc пауза · L язык, T тема, M звук. Тач — только И1.</div>
<script src="./engine.js"></script>
<script src="./js/music.js"></script>

<script src="./js/game.js"></script>
<script src="./js/classic.js"></script>
<script src="./js/modern.js"></script>
<script>
'use strict';
var STR={
 ru:{play:'Играть',players:'Игроки',touch1p:'тач — 1 игрок',language:'Язык',theme:'Тема',sound:'Звук',on:'вкл',off:'выкл',score:'Счёт',level:'Волна',best:'Рекорд',win:'РУБЕЖ УДЕРЖАН!',gameover:'БАЗА ПАЛА',pause:'ПАУЗА',resume:'Продолжить',menu:'В меню',tapstart:'пробел / тап',title:'РЕДУТ',subtitle:'Оборона базы · танковый бой · 1–2 игрока'},
 en:{play:'Play',players:'Players',touch1p:'touch — 1 player',language:'Language',theme:'Theme',sound:'Sound',on:'on',off:'off',score:'Score',level:'Wave',best:'Best',win:'LINE HELD!',gameover:'BASE DESTROYED',pause:'PAUSE',resume:'Resume',menu:'Menu',tapstart:'space / tap',title:'REDUT',subtitle:'Base defense · tank battle · 1–2 players'}
};
// Подсказки HUD родных рендереров — под новую раскладку (И1 стрелки, И2 WASD).
(function(S){ if(!S) return;
  Object.assign(S.ru,{hudMove:'Стрелки / WASD — ход',hudFire:'Пробел или / — огонь',hudP1:'И1 Стрелки + /',hudP2:'И2 WASD + F'});
  Object.assign(S.en,{hudMove:'Arrows / WASD — move',hudFire:'Space or / — fire',hudP1:'P1 Arrows + /',hudP2:'P2 WASD + F'});
})(window.REDUT&&REDUT.i18n&&REDUT.i18n.strings);
var g=Arcade.createGame({canvas:'#c',width:960,height:600,gameId:'redut',strings:STR,theme:'modern'});
var pad=document.querySelector('.pad');
g.input.bindDpad(pad);
g.fit(620); addEventListener('resize',function(){g.fit(620);});
g.useStandardScreens({title:'РЕДУТ',subtitle:STR.ru.subtitle,lives:0});
// Кооп за одной клавиатурой — движок (g.usePlayers + g.input.player(i)): пункт «Игроки», 1/2, подсказка, тач — только И1.
g.usePlayers({
  bind:{ p1:{left:['ArrowLeft'],right:['ArrowRight'],up:['ArrowUp'],down:['ArrowDown'],fire:['Slash','NumpadDivide','Period','Space']},
         p2:{left:['KeyA'],right:['KeyD'],up:['KeyW'],down:['KeyS'],fire:['KeyF','ShiftLeft']} },
  actions:['fire'], repeat:['fire'], pad:pad, touch:{L:'left',R:'right',U:'up',D:'down',A:'fire'},
  hint:{ ru:['И1 (зелёный): стрелки — ход, / или пробел — огонь','И2 (жёлтый): W A S D — ход, F — огонь · 1/2 — число игроков'],
         en:['P1 (green): arrows — move, / or space — fire','P2 (yellow): W A S D — move, F — fire · 1/2 — player count'] }
});
var game=null, prev=[{},{}], DIRS=['up','down','left','right'];
function bp(f,d,t,v){ g.audio.beep(f,d,t,v); }
function mkGame(){ return REDUT.Game({hi:g.state.best,players:g.input.playerCount,onEvent:function(type){
  if(type==='shoot') bp(880,.04,'square',.04);
  else if(type==='brick') bp(240,.05,'square',.05);
  else if(type==='steel') bp(1500,.04,'square',.04);
  else if(type==='explode') bp(110,.16,'sawtooth',.08);
  else if(type==='hit') bp(300,.08,'sawtooth',.06);
  else if(type==='pickup') bp(1100,.07,'triangle');
  else if(type==='life') bp(1320,.12,'triangle');
  else if(type==='freeze') bp(1600,.1,'sine');
  else if(type==='spawn') bp(420,.04,'triangle',.03);
  else if(type==='gameover'){ if(game) g.state.score=game.state().score; g.gameover(); }
  else if(type==='win'){ if(game) g.state.score=game.state().score; g.win(); }
}}); }
[0,1].forEach(function(pi){ g.input.player(pi).onPress(function(name){ if(game&&name==='fire') game.fire(pi); }); });
function render(ctx){ var st=game?game.state():null; if(!st){ g.clear(); return; }
  if(window.REDUT&&REDUT.i18n) REDUT.i18n.lang=g.i18n.lang;
  (g.themeName==='retro'?REDUT.classic:REDUT.modern).draw(ctx,st); }
g.scene('play',{realtime:true,
  enter:function(d){ if(!(d&&d.resume)){ game=mkGame(); game.start(); prev=[{},{}]; } },
  press:function(a){ if(a==='pause') this.pause(); },
  update:function(dt){ if(!game) return;
    // held — только по изменению: движок РЕДУТа запоминает lastDir по моменту нажатия.
    for(var pi=0;pi<g.input.playerCount;pi++) for(var i=0;i<4;i++){ var d=DIRS[i], h=g.input.player(pi).pressed(d); if(h!==!!prev[pi][d]){ prev[pi][d]=h; game.setHeld(pi,d,h); } }
    game.update(Math.min(dt,0.05)); if(game) g.state.score=game.state().score; },
  draw:function(ctx){ render(ctx); }
});
window.__REDUT_V2={g:g,game:function(){return game;}};
g.start('title');
</script></body></html>
